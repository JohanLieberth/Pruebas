<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { padding: 20px; background-color: #f4f7f6; }
    .doc-card { margin-bottom: 15px; transition: transform 0.2s; }
    .doc-card:hover { transform: translateY(-5px); }
    .status-badge { float: right; }
  </style>
</head>
<body>
  <div class="container">
    <h3>Gestión Documental de Contratos</h3>
    <hr>
    <div class="row mb-3">
      <div class="col-md-6">
        <input type="text" id="filtroContrato" class="form-control" placeholder="Buscar contrato...">
      </div>
      <div class="col-md-6 text-end">
        <select id="filtroEstado" class="form-select" style="width: auto; display: inline-block;">
          <option value="">Todos los Estados</option>
          <option value="verde">🟢 Óptimo</option>
          <option value="amarillo">🟡 Pendiente</option>
          <option value="rojo">🔴 Crítico</option>
        </select>
      </div>
    </div>

    <div id="listaContratos" class="list-group">
      <!-- Se cargará dinámicamente -->
      <div class="text-center p-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p>Cargando contratos...</p>
      </div>
    </div>
  </div>

  <script>
    function cargarLista() {
      google.script.run
        .withSuccessHandler(renderLista)
        .obtenerListaContratos();
    }

    function renderLista(contratos) {
      const contenedor = document.getElementById('listaContratos');
      if (!contratos || contratos.length === 0) {
        contenedor.innerHTML = '<div class="alert alert-info">No hay contratos registrados.</div>';
        return;
      }

      contenedor.innerHTML = contratos.map(c => `
        <div class="list-group-item list-group-item-action doc-card">
          <div class="d-flex w-100 justify-content-between">
            <h5 class="mb-1">${c.numContrato || "S/N"}</h5>
            <span class="badge bg-light text-dark">${c.estatus}</span>
          </div>
          <p class="mb-1">${c.dependencia}</p>
          <div class="mt-2">
            <button class="btn btn-sm btn-outline-primary" onclick="abrirDetalle('${c.consecutivo}')">Ver Expediente</button>
          </div>
        </div>
      `).join('');
    }

    window.onload = cargarLista;
  </script>
</body>
</html>
