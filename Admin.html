<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Xplore 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --xplore-red: #e2411f;
      --xplore-dark-red: #af3319;
      --xplore-black: #190909;
      --xplore-cream: #fff4ea;
    }
    body { background-color: var(--xplore-cream); color: var(--xplore-black); }
    .sidebar { background-color: var(--xplore-black); color: white; min-height: 100vh; }
    .stats-card { border-left: 4px solid var(--xplore-red); }
    .table-container { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    #login-container { max-width: 400px; margin-top: 100px; }
    .btn-success { background-color: var(--xplore-red); border-color: var(--xplore-red); }
    .btn-success:hover { background-color: var(--xplore-dark-red); border-color: var(--xplore-dark-red); }
  </style>
</head>
<body>

  <!-- Login Overlay -->
  <div id="login-container" class="container">
    <div class="card shadow">
      <div class="card-body p-4">
        <h3 class="text-center mb-4">Admin Xplore 2026</h3>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" id="adminPassword" class="form-control" placeholder="Ingresa la clave">
        </div>
        <button class="btn btn-success w-100" onclick="login()">Entrar</button>
      </div>
    </div>
  </div>

  <!-- Admin Content -->
  <div id="admin-content" style="display: none;">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid">
        <span class="navbar-brand">Panel Administrativo Xplore 2026</span>
        <button class="btn btn-outline-light btn-sm" onclick="location.reload()">Cerrar Sesión</button>
      </div>
    </nav>

    <div class="container mt-4">
      <!-- Stats -->
      <div class="row mb-4">
        <div class="col-md-4">
          <div class="card stats-card shadow-sm mb-3">
            <div class="card-body text-center">
              <h6 class="text-muted">Total Registros</h6>
              <h2 id="stat-total">0</h2>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card stats-card shadow-sm mb-3" style="border-left-color: var(--xplore-black);">
            <div class="card-body text-center">
              <h6 class="text-muted">Individual</h6>
              <h2 id="stat-individual">0</h2>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card stats-card shadow-sm mb-3" style="border-left-color: var(--xplore-dark-red);">
            <div class="card-body text-center">
              <h6 class="text-muted">VIP</h6>
              <h2 id="stat-vip">0</h2>
            </div>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Listado de Registros</h4>
        <button class="btn btn-primary" onclick="downloadCSV()">Exportar a CSV</button>
      </div>

      <div class="table-container">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>Folio</th>
                <th>Nombre Completo</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Categoría</th>
                <th>Horario</th>
                <th>Estatus</th>
              </tr>
            </thead>
            <tbody id="registros-table-body">
              <!-- Rows will be added here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="loading-spinner" style="position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; z-index:9999;">
    <div class="spinner-border text-light" role="status"></div>
  </div>

  <script>
    let currentPassword = "";

    function login() {
      const pass = document.getElementById('adminPassword').value;
      showLoading(true);
      google.script.run
        .withSuccessHandler(function(isValid) {
          if (isValid) {
            currentPassword = pass;
            loadAdminData();
          } else {
            showLoading(false);
            alert('Contraseña incorrecta');
          }
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          alert('Error: ' + err.message);
        })
        .checkPassword(pass);
    }

    function loadAdminData() {
      google.script.run
        .withSuccessHandler(function(data) {
          if (!data) {
            showLoading(false);
            alert('Error: No se recibieron datos.');
            return;
          }
          document.getElementById('login-container').style.display = 'none';
          document.getElementById('admin-content').style.display = 'block';

          // Set Stats
          document.getElementById('stat-total').textContent = data.stats.total;
          document.getElementById('stat-individual').textContent = data.stats.individual;
          document.getElementById('stat-vip').textContent = data.stats.vip;

          // Populate Table
          const tbody = document.getElementById('registros-table-body');
          tbody.innerHTML = '';

          // Skip header row (index 0)
          for (let i = 1; i < data.registrations.length; i++) {
            const r = data.registrations[i];
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td><strong>${r[0]}</strong></td>
              <td>${r[2]} ${r[3]} ${r[4]}</td>
              <td>${r[7]}</td>
              <td>${r[6]}</td>
              <td><span class="badge bg-info text-dark">${r[12]}</span></td>
              <td>${r[13]}</td>
              <td><span class="badge bg-success">${r[15]}</span></td>
            `;
            tbody.appendChild(tr);
          }
          showLoading(false);
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          alert('Error al cargar datos: ' + err.message);
        })
        .getAdminData(currentPassword);
    }

    function downloadCSV() {
      showLoading(true);
      google.script.run
        .withSuccessHandler(function(base64) {
          showLoading(false);
          const link = document.createElement('a');
          link.href = 'data:text/csv;base64,' + base64;
          link.download = 'registros_xplore_2026.csv';
          link.click();
        })
        .exportToCSV(currentPassword);
    }

    function showLoading(show) {
      document.getElementById('loading-spinner').style.display = show ? 'flex' : 'none';
    }
  </script>
</body>
</html>
