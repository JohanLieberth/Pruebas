<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('Styles'); ?>
    <style>
      table { width: 100%; border-collapse: collapse; margin-top: 20px; }
      th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
      th { background-color: var(--primary-color); color: white; }
      tr:nth-child(even) { background-color: #f2f2f2; }
      .status-badge { padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Panel de Administración</h1>
      <p>Gestión de Certificaciones "Mujeres Seguras"</p>
    </div>

    <div class="container">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Empresas Registradas</h2>
        <button class="btn btn-outline" onclick="loadRegistros()">Actualizar</button>
      </div>

      <div style="overflow-x: auto;">
        <table id="tabla-registros">
          <thead>
            <tr>
              <th>RFC</th>
              <th>Empresa/Representante</th>
              <th>Folio</th>
              <th>Estatus</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="lista-empresas">
            <!-- Cargado por JS -->
          </tbody>
        </table>
      </div>

      <div class="button-group">
        <button class="btn btn-primary" onclick="google.script.run.setupDatabase(); alert('Tablas verificadas/creadas');">Inicializar Base de Datos</button>
      </div>
    </div>

    <script>
      function loadRegistros() {
        google.script.run
          .withSuccessHandler(function(data) {
            const tbody = document.getElementById('lista-empresas');
            tbody.innerHTML = '';

            // Empezar desde 1 para saltar cabeceras
            for (let i = 1; i < data.length; i++) {
              const row = data[i];
              const tr = document.createElement('tr');

              tr.innerHTML = `
                <td>${row[0]}</td>
                <td>${row[1]}</td>
                <td>${row[4]}</td>
                <td><span class="status-badge" style="background:${getStatusColor(row[6])}; color:white;">${row[6]}</span></td>
                <td>
                  <select onchange="cambiarEstatus('${row[0]}', this.value)">
                    <option value="">Cambiar Estatus...</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="En Revisión">En Revisión</option>
                    <option value="Aprobado">Aprobado</option>
                    <option value="Rechazado">Rechazado</option>
                  </select>
                </td>
              `;
              tbody.appendChild(tr);
            }
          })
          .getRegistrosAdmin();
      }

      function getStatusColor(status) {
        const colors = {
          'Pendiente': '#f0ad4e',
          'En Revisión': '#5bc0de',
          'Aprobado': '#5cb85c',
          'Rechazado': '#d9534f'
        };
        return colors[status] || '#ccc';
      }

      function cambiarEstatus(rfc, nuevoEstatus) {
        if (!nuevoEstatus) return;
        if (confirm(`¿Seguro que desea cambiar el estatus a ${nuevoEstatus}?`)) {
          google.script.run
            .withSuccessHandler(function() {
              alert('Estatus actualizado');
              loadRegistros();
            })
            .cambiarEstatus(rfc, nuevoEstatus);
        }
      }

      window.onload = loadRegistros;
    </script>
  </body>
</html>
