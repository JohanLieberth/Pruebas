<div class="row">
  <div class="col-md-12 mb-4">
    <div class="card shadow-sm border-0 bg-merida text-white">
      <div class="card-body">
        <h4 class="card-title">Panel de Administración</h4>
        <p class="card-text">Gestión global de documentos, usuarios y métricas del sistema.</p>
      </div>
    </div>
  </div>

  <!-- Métricas -->
  <div class="col-md-3 mb-4">
    <div class="card text-center h-100 shadow-sm">
      <div class="card-body">
        <h6 class="text-muted">Total Documentos</h6>
        <h2 id="stat_total">-</h2>
      </div>
    </div>
  </div>
  <div class="col-md-3 mb-4">
    <div class="card text-center h-100 shadow-sm border-start border-warning border-4">
      <div class="card-body">
        <h6 class="text-muted">En Revisión</h6>
        <h2 id="stat_revision">-</h2>
      </div>
    </div>
  </div>
  <div class="col-md-3 mb-4">
    <div class="card text-center h-100 shadow-sm border-start border-success border-4">
      <div class="card-body">
        <h6 class="text-muted">Aprobados</h6>
        <h2 id="stat_aprobado">-</h2>
      </div>
    </div>
  </div>
  <div class="col-md-3 mb-4">
    <div class="card text-center h-100 shadow-sm">
      <div class="card-body">
        <h6 class="text-muted">Tipos de Documento</h6>
        <div class="small" id="stat_tipos"></div>
      </div>
    </div>
  </div>

  <!-- Gestión de Usuarios -->
  <div class="col-md-12">
    <div class="card shadow-sm">
      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h6 class="mb-0 fw-bold">Usuarios del Sistema</h6>
        <button class="btn btn-sm btn-merida" data-bs-toggle="modal" data-bs-target="#modalUsuario">Nuevo Usuario</button>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-sm">
            <thead>
              <tr>
                <th>Email</th>
                <th>Nombre</th>
                <th>Rol</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="listaUsuarios">
              <!-- Cargado dinámicamente -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Usuario -->
<div class="modal fade" id="modalUsuario" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Registrar Usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formUsuario">
          <div class="mb-3">
            <label class="form-label">Email de Google</label>
            <input type="email" id="user_email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Nombre Completo</label>
            <input type="text" id="user_nombre" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Rol</label>
            <select id="user_rol" class="form-select">
              <option value="USER">Usuario Estándar</option>
              <option value="ADMIN">Administrador</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="saveUser()">Guardar Usuario</button>
      </div>
    </div>
  </div>
</div>
