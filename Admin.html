<html>
  <head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        transition: transform 0.2s;
        cursor: pointer;
      }
      .stat-card:hover {
        transform: translateY(-5px);
      }
    </style>
  </head>
  <body>
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="#"><i class="fas fa-user-shield me-2"></i>Admin Panel</a>
        <div class="ms-auto d-flex align-items-center">
          <span class="text-white me-3 d-none d-md-inline" id="adminName"></span>
          <button class="btn btn-outline-light btn-sm" onclick="logout()">Cerrar Sesión</button>
        </div>
      </div>
    </nav>

    <div class="container-fluid px-4">
      <div id="alertPlaceholder"></div>

      <!-- Dashboard Stats -->
      <div class="row g-3 mb-4" id="statsContainer">
        <div class="col-6 col-md-2">
          <div class="card stat-card text-center p-3" onclick="filtrarEstatus('Todos')">
            <h6 class="text-muted">Total</h6>
            <h3 id="stat-total">0</h3>
          </div>
        </div>
        <div class="col-6 col-md-2">
          <div class="card stat-card border-warning text-center p-3" onclick="filtrarEstatus('Pendiente')">
            <h6 class="text-warning">Pendientes</h6>
            <h3 id="stat-pendiente">0</h3>
          </div>
        </div>
        <div class="col-6 col-md-2">
          <div class="card stat-card border-primary text-center p-3" onclick="filtrarEstatus('En reparación')">
            <h6 class="text-primary">En Reparación</h6>
            <h3 id="stat-en-reparacion">0</h3>
          </div>
        </div>
        <div class="col-6 col-md-2">
          <div class="card stat-card border-success text-center p-3" onclick="filtrarEstatus('Listo')">
            <h6 class="text-success">Listos</h6>
            <h3 id="stat-listo">0</h3>
          </div>
        </div>
        <div class="col-6 col-md-2">
          <div class="card stat-card border-secondary text-center p-3" onclick="filtrarEstatus('Entregado')">
            <h6 class="text-secondary">Entregados</h6>
            <h3 id="stat-entregado">0</h3>
          </div>
        </div>
        <div class="col-6 col-md-2">
          <div class="card stat-card border-danger text-center p-3" onclick="filtrarEstatus('Cancelado')">
            <h6 class="text-danger">Cancelados</h6>
            <h3 id="stat-cancelado">0</h3>
          </div>
        </div>
      </div>

      <!-- Filters & Actions -->
      <div class="card mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-search"></i></span>
                <input type="text" id="searchInput" class="form-control" placeholder="Buscar por folio, nombre, tel..." onkeyup="if(event.key==='Enter') cargarServicios()">
              </div>
            </div>
            <div class="col-md-3">
              <select id="statusFilter" class="form-select" onchange="cargarServicios()">
                <option value="Todos">Todos los estatus</option>
                <option value="Pendiente">Pendiente</option>
                <option value="En reparación">En reparación</option>
                <option value="Listo">Listo</option>
                <option value="Entregado">Entregado</option>
                <option value="Cancelado">Cancelado</option>
              </select>
            </div>
            <div class="col-md-5 text-end">
              <a href="<?= getScriptUrl() ?>?page=registro" class="btn btn-outline-primary">
                <i class="fas fa-plus me-2"></i>Registro Nuevo
              </a>
              <button class="btn btn-outline-success" onclick="exportarCSV()">
                <i class="fas fa-file-export me-2"></i>Exportar CSV
              </button>
              <button class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#configModal">
                <i class="fas fa-cog me-2"></i>Configuración
              </button>
              <button class="btn btn-primary" onclick="cargarServicios()">
                <i class="fas fa-sync-alt me-2"></i>Actualizar
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Services Table -->
      <div class="card">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>Folio</th>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Dispositivo</th>
                <th>Estatus</th>
                <th>Total</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="serviciosTableBody">
              <!-- Content loaded via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Config Modal -->
    <div class="modal fade" id="configModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Configuración del Sistema</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="configForm">
              <div class="mb-3">
                <label class="form-label">URL Logo Principal</label>
                <input type="text" name="Logo Principal" class="form-control" id="configLogoPrincipal">
              </div>
              <div class="mb-3">
                <label class="form-label">URL Logo Pequeño</label>
                <input type="text" name="Logo Pequeño" class="form-control" id="configLogoPequeno">
              </div>
              <div class="mb-3">
                <label class="form-label">URL Video Promocional (MP4)</label>
                <input type="text" name="URL_Video_Promocional" class="form-control" id="configVideo">
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            <button type="button" class="btn btn-primary" onclick="guardarConfig()">Guardar Configuración</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title">Actualizar Servicio: <span id="modalFolio"></span></h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="editForm">
              <input type="hidden" id="editFolio">
              <div class="row mb-3">
                <div class="col-md-4">
                  <label class="form-label fw-bold">Estatus</label>
                  <select id="editEstatus" class="form-select" required>
                    <option value="Pendiente">Pendiente</option>
                    <option value="En reparación">En reparación</option>
                    <option value="Listo">Listo</option>
                    <option value="Entregado">Entregado</option>
                    <option value="Cancelado">Cancelado</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-bold">Fecha de Entrega / Promesa</label>
                  <input type="date" id="editFechaEntrega" class="form-control">
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-bold">Total ($)</label>
                  <input type="number" step="0.01" id="editTotal" class="form-control">
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Solución Aplicada / Notas Internas</label>
                <textarea id="editSolucion" class="form-control" rows="4"></textarea>
              </div>
              <div class="alert alert-info py-2 small">
                <i class="fas fa-info-circle me-2"></i>Si cambias a <strong>Listo</strong>, se enviará un correo automático al cliente.
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            <button type="button" class="btn btn-primary" onclick="guardarCambios()">Guardar Cambios</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <?!= include('JS'); ?>
    <script>
      let editModal;
      let currentUser;

      window.addEventListener('load', function() {
        const userStr = sessionStorage.getItem('user');
        if (!userStr) {
          window.top.location.href = '<?= getScriptUrl() ?>?page=login';
          return;
        }
        currentUser = JSON.parse(userStr);
        if (currentUser.rol !== 'Administrador' && currentUser.rol !== 'Supervisor') {
          window.top.location.href = '<?= getScriptUrl() ?>?page=panelCliente';
          return;
        }
        document.getElementById('adminName').innerText = currentUser.nombre;
        editModal = new bootstrap.Modal(document.getElementById('editModal'));

        cargarStats();
        cargarServicios();
        cargarConfig();
      });

      function cargarConfig() {
        google.script.run
          .withSuccessHandler(function(config) {
            document.getElementById('configLogoPrincipal').value = config["Logo Principal"] || '';
            document.getElementById('configLogoPequeno').value = config["Logo Pequeño"] || '';
            document.getElementById('configVideo').value = config["URL_Video_Promocional"] || '';
          })
          .getConfig();
      }

      function guardarConfig() {
        const config = {
          "Logo Principal": document.getElementById('configLogoPrincipal').value,
          "Logo Pequeño": document.getElementById('configLogoPequeno').value,
          "URL_Video_Promocional": document.getElementById('configVideo').value
        };
        showLoading(true);
        google.script.run
          .withSuccessHandler(function() {
            showLoading(false);
            bootstrap.Modal.getInstance(document.getElementById('configModal')).hide();
            showAlert('Configuración guardada', 'success');
          })
          .updateConfig(config);
      }

      function cargarStats() {
        google.script.run
          .withSuccessHandler(function(stats) {
            let total = 0;
            for (let key in stats) {
              const id = 'stat-' + getStatusSlug(key);
              if (document.getElementById(id)) {
                document.getElementById(id).innerText = stats[key];
                total += stats[key];
              }
            }
            document.getElementById('stat-total').innerText = total;
          })
          .getDashboardStats();
      }

      function cargarServicios() {
        showLoading(true);
        const filtros = {
          busqueda: document.getElementById('searchInput').value,
          estatus: document.getElementById('statusFilter').value
        };

        google.script.run
          .withSuccessHandler(function(servicios) {
            showLoading(false);
            const tbody = document.getElementById('serviciosTableBody');
            tbody.innerHTML = '';

            servicios.forEach(s => {
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td class="fw-bold">${s.Folio}</td>
                <td class="small">${s["Fecha de recepción"]}</td>
                <td>
                  <div class="fw-bold">${s.Nombre}</div>
                  <div class="small text-muted">${s["Teléfono"]}</div>
                </td>
                <td>${s["Dispositivo a recibir"]}</td>
                <td>${formatStatus(s["Estatus (admin)"])}</td>
                <td class="fw-bold text-success">$${s.Total || '0.00'}</td>
                <td>
                  <button class="btn btn-sm btn-outline-primary" onclick='abrirEditar(${JSON.stringify(s).replace(/'/g, "&apos;")})'>
                    <i class="fas fa-edit"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-dark" onclick="window.open('<?= getScriptUrl() ?>?page=imprimir&folio=${s.Folio}&tipo=completo', '_blank')">
                    <i class="fas fa-print"></i>
                  </button>
                  ${currentUser.rol === 'Administrador' ? `
                    <button class="btn btn-sm btn-outline-danger" onclick="confirmarEliminar('${s.Folio}')">
                      <i class="fas fa-trash"></i>
                    </button>
                  ` : ''}
                </td>
              `;
              tbody.appendChild(tr);
            });
            if (servicios.length === 0) {
              tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No se encontraron registros</td></tr>';
            }
          })
          .obtenerServicios(filtros);
      }

      function filtrarEstatus(estatus) {
        document.getElementById('statusFilter').value = estatus;
        cargarServicios();
      }

      function abrirEditar(s) {
        document.getElementById('modalFolio').innerText = s.Folio;
        document.getElementById('editFolio').value = s.Folio;
        document.getElementById('editEstatus').value = s["Estatus (admin)"];
        document.getElementById('editSolucion').value = s["Solución aplicada (admin)"];
        document.getElementById('editTotal').value = s.Total || '';

        // Format date for input type=date (YYYY-MM-DD)
        if (s["Fecha de entrega (admin)"]) {
          const parts = s["Fecha de entrega (admin)"].split('/');
          if (parts.length === 3) {
            document.getElementById('editFechaEntrega').value = `${parts[2]}-${parts[1]}-${parts[0]}`;
          }
        } else {
          document.getElementById('editFechaEntrega').value = '';
        }

        editModal.show();
      }

      function guardarCambios() {
        const folio = document.getElementById('editFolio').value;
        const estatus = document.getElementById('editEstatus').value;
        const solucion = document.getElementById('editSolucion').value;
        const total = document.getElementById('editTotal').value;
        let fecha = document.getElementById('editFechaEntrega').value;

        // Format back to DD/MM/YYYY
        if (fecha) {
          const d = new Date(fecha + 'T00:00:00');
          fecha = ((d.getDate()+1) < 10 ? '0' : '') + (d.getDate()) + '/' +
                  ((d.getMonth()+1) < 10 ? '0' : '') + (d.getMonth()+1) + '/' +
                  d.getFullYear();
        }

        showLoading(true);
        google.script.run
          .withSuccessHandler(function(res) {
            showLoading(false);
            if (res.success) {
              editModal.hide();
              showAlert('Actualizado correctamente', 'success');
              cargarStats();
              cargarServicios();
            } else {
              showAlert(res.message);
            }
          })
          .actualizarEstatus(folio, estatus, solucion, fecha, currentUser.rol, total);
      }

      function confirmarEliminar(folio) {
        if (confirm('¿Estás seguro de que deseas eliminar permanentemente el folio ' + folio + '?')) {
          showLoading(true);
          google.script.run
            .withSuccessHandler(function(res) {
              showLoading(false);
              if (res.success) {
                showAlert('Registro eliminado correctamente', 'success');
                cargarStats();
                cargarServicios();
              } else {
                showAlert(res.message);
              }
            })
            .eliminarServicio(folio, currentUser.rol);
        }
      }

      function exportarCSV() {
        showLoading(true);
        google.script.run
          .withSuccessHandler(function(base64) {
            showLoading(false);
            downloadCSV(base64, 'servicios_gamesservice_' + new Date().toLocaleDateString() + '.csv');
          })
          .exportToCSV();
      }

      function logout() {
        sessionStorage.clear();
        window.top.location.href = '<?= getScriptUrl() ?>?page=login';
      }
    </script>
  </body>
</html>
