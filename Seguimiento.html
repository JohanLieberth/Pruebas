<div class="card shadow-sm">
  <div class="card-header bg-merida text-white d-flex justify-content-between align-items-center">
    <h5 class="mb-0"><i class="bi bi-list-task me-2"></i>Seguimiento de Documentos</h5>
    <button class="btn btn-sm btn-light" onclick="loadDocuments()"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
  </div>
  <div class="card-body">
    <div class="row mb-3">
      <div class="col-md-4">
        <input type="text" id="filterText" class="form-control" placeholder="Buscar por nombre o código..." onkeyup="filterDocs()">
      </div>
      <div class="col-md-3">
        <select id="filterTipo" class="form-select" onchange="filterDocs()">
          <option value="">Todos los tipos</option>
          <option value="F-ADM/CMC-14">Procedimiento</option>
          <option value="F-ADM/CMC-13">Política</option>
        </select>
      </div>
      <div class="col-md-3">
        <select id="filterEstado" class="form-select" onchange="filterDocs()">
          <option value="">Todos los estados</option>
          <option value="Borrador">Borrador</option>
          <option value="En revisión">En revisión</option>
          <option value="Aprobado">Aprobado</option>
          <option value="Obsoleto">Obsoleto</option>
        </select>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle" id="tablaSeguimiento">
        <thead class="table-light">
          <tr>
            <th>Código</th>
            <th>Tipo</th>
            <th>Nombre del Documento</th>
            <th>Versión</th>
            <th>Estado</th>
            <th>Última Actualización</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody id="listaDocumentos">
          <!-- Se llena con JS -->
        </tbody>
      </table>
    </div>
  </div>
</div>
