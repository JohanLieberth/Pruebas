<!-- PROYECTOS.HTML -->
<div id="view-proyectos" class="app-view d-none">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-1"><i class="bi bi-folder2-open text-primary me-2"></i>Gestión de Proyectos</h3>
      <p class="text-muted small mb-0">Listado y administración de proyectos institucionales</p>
    </div>
    <button class="btn btn-primary-custom rounded-pill px-3 sol-creador-admin" onclick="abrirModalNuevoProyecto();">
      <i class="bi bi-plus-lg me-1"></i> Nuevo Proyecto
    </button>
  </div>

  <div class="card border-0 shadow-sm rounded-3">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover align-middle" id="tabla-proyectos">
          <thead>
            <tr>
              <th>ID Proyecto</th>
              <th>Nombre del Proyecto</th>
              <th>Descripción</th>
              <th>Estatus</th>
              <th>Fecha Creación</th>
              <th>Creado Por</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- Inyectado por JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal Proyecto (Crear / Editar) -->
<div class="modal fade" id="modalProyecto" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-primary-custom text-white">
        <h5 class="modal-title fw-bold" id="modalProyectoTitle"><i class="bi bi-folder-plus me-2"></i>Nuevo Proyecto</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="form-proyecto" onsubmit="event.preventDefault(); guardarProyecto();">
        <div class="modal-body">
          <input type="hidden" id="proyecto-id">

          <div class="mb-3">
            <label for="proyecto-nombre" class="form-label fw-semibold">Nombre del Proyecto *</label>
            <input type="text" class="form-control" id="proyecto-nombre" required placeholder="Ej. Modernización Tecnológica">
          </div>

          <div class="mb-3">
            <label for="proyecto-descripcion" class="form-label fw-semibold">Descripción</label>
            <textarea class="form-control" id="proyecto-descripcion" rows="3" placeholder="Objetivos y alcance del proyecto"></textarea>
          </div>

          <div class="mb-3">
            <label for="proyecto-estatus" class="form-label fw-semibold">Estatus</label>
            <select class="form-select" id="proyecto-estatus">
              <option value="Activo">Activo</option>
              <option value="Inactivo">Inactivo</option>
              <option value="Cerrado">Cerrado</option>
            </select>
          </div>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary rounded-pill px-3" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary-custom rounded-pill px-4">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
