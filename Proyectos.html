<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Gestión de Proyectos</title>
  <?!= include('Estilos'); ?>
</head>
<body>
  <div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="fw-bold text-primary mb-0"><i class="bi bi-folder-fill me-2"></i>Gestión de Proyectos</h4>
      <button class="btn btn-primary-custom btn-sm" onclick="abrirModalNuevoProyecto()">
        <i class="bi bi-plus-lg me-1"></i>Nuevo Proyecto
      </button>
    </div>

    <div class="card card-custom">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Nombre del Proyecto</th>
                <th>Descripción</th>
                <th>Estatus</th>
                <th>Fecha Creación</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tbodyProyectos">
              <tr>
                <td colspan="6" class="text-center py-4 text-muted">Cargando proyectos...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Proyecto -->
  <div class="modal fade" id="modalProyecto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="modalProyectoLabel">Nuevo Proyecto</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="formProyecto" onsubmit="guardarProyectoSubmit(event)">
          <div class="modal-body">
            <input type="hidden" id="proj_id">
            <div class="mb-3">
              <label class="form-label fw-semibold">Nombre del Proyecto <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="proj_nombre" required placeholder="Ej. Modernización de Infraestructura">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Descripción</label>
              <textarea class="form-control" id="proj_descripcion" rows="3" placeholder="Objetivos y alcance del proyecto..."></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Estatus</label>
              <select class="form-select" id="proj_estatus">
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary-custom">Guardar Proyecto</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <?!= include('Scripts'); ?>

  <script>
    let proyectosList = [];

    function initProyectos() {
      cargarProyectos();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initProyectos);
    } else {
      initProyectos();
    }

    function cargarProyectos() {
      toggleSpinner(true);
      google.script.run
        .withSuccessHandler(data => {
          toggleSpinner(false);
          proyectosList = data || [];
          renderTablaProyectos();
        })
        .withFailureHandler(err => {
          toggleSpinner(false);
          mostrarAlerta("Error al cargar proyectos: " + err.message, "danger");
        })
        .listarProyectos();
    }

    function renderTablaProyectos() {
      const tbody = document.getElementById('tbodyProyectos');
      if (proyectosList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No hay proyectos registrados.</td></tr>`;
        return;
      }

      tbody.innerHTML = proyectosList.map(p => `
        <tr>
          <td><span class="badge bg-light text-dark border">${escapeHtml(p.ID_Proyecto)}</span></td>
          <td class="fw-bold">${escapeHtml(p.Nombre_Proyecto)}</td>
          <td>${escapeHtml(p.Descripción || '-')}</td>
          <td>
            <span class="badge ${p.Estatus === 'Activo' ? 'bg-success' : 'bg-secondary'}">${escapeHtml(p.Estatus)}</span>
          </td>
          <td class="small text-muted">${escapeHtml(p.Fecha_Creación)}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-primary" onclick="editarProyecto('${p.ID_Proyecto}')">
              <i class="bi bi-pencil-fill"></i> Editar
            </button>
          </td>
        </tr>
      `).join('');
    }

    function abrirModalNuevoProyecto() {
      document.getElementById('formProyecto').reset();
      document.getElementById('proj_id').value = '';
      document.getElementById('modalProyectoLabel').innerText = 'Nuevo Proyecto';
      new bootstrap.Modal(document.getElementById('modalProyecto')).show();
    }

    function editarProyecto(id) {
      const proj = proyectosList.find(p => p.ID_Proyecto === id);
      if (!proj) return;

      document.getElementById('proj_id').value = proj.ID_Proyecto;
      document.getElementById('proj_nombre').value = proj.Nombre_Proyecto;
      document.getElementById('proj_descripcion').value = proj.Descripción || '';
      document.getElementById('proj_estatus').value = proj.Estatus || 'Activo';

      document.getElementById('modalProyectoLabel').innerText = 'Editar Proyecto';
      new bootstrap.Modal(document.getElementById('modalProyecto')).show();
    }

    function guardarProyectoSubmit(e) {
      e.preventDefault();
      const payload = {
        ID_Proyecto: document.getElementById('proj_id').value,
        Nombre_Proyecto: document.getElementById('proj_nombre').value,
        Descripción: document.getElementById('proj_descripcion').value,
        Estatus: document.getElementById('proj_estatus').value
      };

      toggleSpinner(true);
      google.script.run
        .withSuccessHandler(res => {
          toggleSpinner(false);
          bootstrap.Modal.getInstance(document.getElementById('modalProyecto')).hide();
          mostrarAlerta(res.mensaje, "success");
          cargarProyectos();
        })
        .withFailureHandler(err => {
          toggleSpinner(false);
          mostrarAlerta("Error: " + err.message, "danger");
        })
        .guardarProyecto(payload);
    }
  </script>
</body>
</html>
