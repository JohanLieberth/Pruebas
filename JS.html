<script>
  /**
   * Variables de Estado SPA
   */
  let currentUser = null;
  let activeRevisionCode = null;
  let toastBootstrap = null;
  let modalRevision = null;

  $(document).ready(function() {
    toastBootstrap = bootstrap.Toast.getOrCreateInstance(document.getElementById('liveToast'));
    modalRevision = new bootstrap.Modal(document.getElementById('modalRevision'));

    setupGlobalErrorHandling();
    initApp();
  });

  /**
   * Seguridad: Manejo de Errores Globales
   */
  function setupGlobalErrorHandling() {
    window.onerror = function(msg, url, line) {
      console.error("Fallo Interfaz:", msg, url, line);
      renderErrorPanel(`Error en la interfaz: ${msg}`);
      return true;
    };

    window.addEventListener('unhandledrejection', function(event) {
      console.error("Promesa Rechazada:", event.reason);
      renderErrorPanel(`Error de conexión asíncrona: ${event.reason}`);
    });
  }

  function renderErrorPanel(msg) {
    $('#error-panel-container').html(`
      <div id="error-panel" class="alert alert-danger shadow-lg border-start border-5 border-danger fade show">
        <div class="d-flex align-items-center">
          <i class="bi bi-exclamation-octagon-fill fs-2 me-3"></i>
          <div>
            <h5 class="alert-heading fw-bold">Interrupción del Sistema</h5>
            <p class="mb-0">${msg}</p>
          </div>
        </div>
        <hr>
        <div class="d-flex justify-content-end gap-2">
          <button class="btn btn-danger btn-sm" onclick="location.reload()"><i class="bi bi-arrow-clockwise"></i> Recargar Todo</button>
          <button class="btn btn-outline-danger btn-sm" onclick="showSection('inicio')">Menú Principal</button>
        </div>
      </div>
    `);
    showLoader(false);
  }

  /**
   * Ejecución Segura en Servidor
   */
  function runServer(funcName, args, onSuccess) {
    showLoader(true);

    // Timer de Seguridad para Timeout (30s)
    const timeout = setTimeout(() => {
      renderErrorPanel("El servidor no responde (Tiempo Agotado). Verifique su conexión.");
    }, 30000);

    const runner = google.script.run
      .withFailureHandler(function(err) {
        clearTimeout(timeout);
        console.error(`Error en ${funcName}:`, err);
        renderErrorPanel(`Servidor (${funcName}): ${err.message}`);
        showLoader(false);
      })
      .withSuccessHandler(function(res) {
        clearTimeout(timeout);
        try {
          onSuccess(res);
        } catch (e) {
          console.error("Error Procesamiento:", e);
          renderErrorPanel("Error al renderizar los datos del servidor.");
        }
        showLoader(false);
      });

    if (args) runner[funcName](...args);
    else runner[funcName]();
  }

  function showLoader(show, text = "Procesando solicitud...") {
    $('#loading-text').text(text);
    if (show) {
      $('#loading-overlay').css('display', 'flex').hide().fadeIn(200);
    } else {
      $('#loading-overlay').fadeOut(200);
    }
  }

  function showToast(title, message, type = 'primary') {
    $('#toastTitle').text(title);
    $('#toastMessage').text(message);
    $('#liveToast').removeClass('text-bg-primary text-bg-danger text-bg-success').addClass(`text-bg-${type}`);
    toastBootstrap.show();
  }

  /**
   * SPA Navigation
   */
  function showSection(sectionId) {
    console.log("Cambiando a sección:", sectionId);
    $('.section').hide();
    $('#error-panel-container').empty();

    const target = $(`#${sectionId}`);
    if (target.length) {
      target.show();
      $('.nav-link').removeClass('active');
      $(`.nav-link[onclick*="${sectionId}"]`).addClass('active');

      if (sectionId === 'seguimiento') loadSeguimiento();
      if (sectionId === 'anexos') loadAnexosView();
      if (sectionId === 'admin') loadAdminData();
    } else {
      console.warn("Sección no mapeada:", sectionId);
      $('#inicio').show();
    }
  }

  function initApp() {
    runServer('getUserInfo', null, function(info) {
      currentUser = info;
      $('#userDisplay').html(`<i class="bi bi-person-circle me-1"></i> ${info.nombre}`);
      if (info.rol === 'ADMIN') $('.admin-only').show();
      showSection('inicio');
    });
  }

  // --- MÓDULO GESTIÓN DOCUMENTAL ---

  function guardarNuevoDoc() {
    const data = {
      Nombre: $('#doc_nombre').val(),
      Tipo: $('#doc_tipo').val(),
      Version: $('#doc_version').val()
    };

    if (!data.Nombre || !data.Tipo) {
      $('#formDoc').addClass('was-validated');
      showToast('Validación', 'Complete los campos obligatorios.', 'danger');
      return;
    }

    runServer('saveDocument', [data], function(res) {
      showToast('Éxito', `Documento ${res.codigo} registrado y en seguimiento.`, 'success');
      $('#formDoc')[0].reset();
      $('#formDoc').removeClass('was-validated');
      showSection('seguimiento');
    });
  }

  // --- MÓDULO SEGUIMIENTO ---

  function loadSeguimiento() {
    runServer('getSeguimientoData', null, function(data) {
      const tbody = $('#lista-seguimiento');
      tbody.empty();

      if (!data || data.length === 0) {
        $('#seguimiento-vacio').show();
        $('#container-tabla-seguimiento').hide();
        return;
      }

      $('#seguimiento-vacio').hide();
      $('#container-tabla-seguimiento').show();

      data.forEach(item => {
        const badge = getBadgeEstado(item.Estado);
        const fecha = item.UltimaActualizacion ? new Date(item.UltimaActualizacion).toLocaleString() : '-';

        tbody.append(`
          <tr>
            <td class="ps-3"><span class="badge bg-light text-dark border">${item.Codigo}</span></td>
            <td>
              <div class="fw-bold">${item.NombreDocumento}</div>
              <small class="text-muted">${item.TipoDocumento}</small>
            </td>
            <td>${item.Versión}</td>
            <td>${badge}</td>
            <td class="small text-muted">${fecha}</td>
            <td class="text-end pe-3">
              <button class="btn btn-sm btn-outline-mujeres" onclick="abrirRevision('${item.Codigo}', '${item.NombreDocumento.replace(/'/g, "\\'")}', '${item.Estado}')">
                <i class="bi bi-search me-1"></i>Revisar
              </button>
            </td>
          </tr>
        `);
      });
    });
  }

  function getBadgeEstado(est) {
    let cls = "bg-secondary";
    if (est === 'Aprobado') cls = "bg-success";
    if (est === 'En revisión') cls = "bg-warning text-dark";
    if (est === 'Rechazado') cls = "bg-danger";
    if (est === 'Requiere ajustes') cls = "bg-info text-dark";
    return `<span class="badge ${cls}">${est}</span>`;
  }

  function abrirRevision(codigo, nombre, estado) {
    activeRevisionCode = codigo;
    $('#rev-codigo-title').text(codigo);
    $('#rev-nombre').val(nombre);
    $('#rev-estado-badge').html(getBadgeEstado(estado));
    $('#rev-nuevo-estado').val(estado);
    $('#rev-observaciones').val('');
    modalRevision.show();
  }

  function confirmarRevision() {
    const data = {
      codigo: activeRevisionCode,
      nuevoEstado: $('#rev-nuevo-estado').val(),
      observaciones: $('#rev-observaciones').val()
    };

    if (!data.observaciones) {
      showToast('Faltan datos', 'Debe incluir observaciones para la revisión.', 'warning');
      return;
    }

    runServer('guardarRevision', [data], function() {
      showToast('Guardado', 'La revisión se ha registrado con éxito.', 'success');
      modalRevision.hide();
      loadSeguimiento();
    });
  }

  // --- MÓDULO ANEXOS ---

  function loadAnexosView() {
    runServer('getDocumentosParaSelect', null, function(docs) {
      const select = $('#anexo_codigo_doc');
      select.empty().append('<option value="">Seleccione documento...</option>');
      docs.forEach(d => select.append(`<option value="${d.codigo}">${d.codigo} - ${d.nombre}</option>`));
    });
  }

  function actualizarListaAnexos() {
    const codigo = $('#anexo_codigo_doc').val();
    if (!codigo) {
      $('#lista-anexos-existentes').html('<li class="list-group-item text-center text-muted py-5">Seleccione un documento para ver sus anexos.</li>');
      return;
    }

    runServer('obtenerAnexos', [codigo], function(anexos) {
      const list = $('#lista-anexos-existentes');
      list.empty();

      if (!anexos || anexos.length === 0) {
        list.append('<li class="list-group-item text-center py-4">No hay expedientes cargados aún.</li>');
        return;
      }

      anexos.forEach(a => {
        const icon = a.tipo === 'Diagrama de Flujo' ? 'bi-diagram-3-fill text-primary' : 'bi-file-earmark-text text-secondary';
        list.append(`
          <li class="list-group-item d-flex justify-content-between align-items-center py-3">
            <div class="d-flex align-items-center">
              <i class="bi ${icon} fs-4 me-3"></i>
              <div>
                <div class="fw-bold">${a.nombre}</div>
                <small class="text-muted d-block">${a.tipo}</small>
                <small class="fst-italic text-mujeres">${a.desc || ''}</small>
              </div>
            </div>
            <a href="${a.url}" target="_blank" class="btn btn-sm btn-light border"><i class="bi bi-eye"></i></a>
          </li>
        `);
      });
    });
  }

  function subirArchivo(tipo, fileInputId, descInputId = null) {
    const codigo = $('#anexo_codigo_doc').val();
    if (!codigo) {
      showToast('Aviso', 'Seleccione primero el documento principal.', 'warning');
      return;
    }

    const fileInput = document.getElementById(fileInputId);
    if (!fileInput.files.length) {
      showToast('Sin archivo', 'Seleccione un archivo del equipo.', 'warning');
      return;
    }

    const file = fileInput.files[0];
    const descripcion = descInputId ? $(`#${descInputId}`).val() : "";
    const reader = new FileReader();

    reader.onload = function(e) {
      const base64Data = e.target.result.split(',')[1];
      showLoader(true, "Transmitiendo archivo pesado al servidor Drive...");

      google.script.run
        .withFailureHandler(err => renderErrorPanel(`Carga fallida: ${err.message}`))
        .withSuccessHandler(res => {
          showToast('Cargado', 'Archivo guardado en el expediente digital.', 'success');
          fileInput.value = "";
          if (descInputId) $(`#${descInputId}`).val('');
          actualizarListaAnexos();
          showLoader(false);
        })
        .subirAnexo(base64Data, file.type, file.name, codigo, tipo, descripcion);
    };

    reader.readAsDataURL(file);
  }

  function loadAdminData() {
    runServer('getUsers', null, function(users) {
      const tbody = $('#lista-usuarios-admin');
      tbody.empty();
      users.forEach(u => {
        tbody.append(`<tr><td>${u.email}</td><td>${u.nombre}</td><td><span class="badge bg-dark">${u.rol}</span></td></tr>`);
      });
    });
  }
</script>
