<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  /**
   * Muestra u oculta el spinner de carga.
   */
  function toggleSpinner(mostrar) {
    let spinner = document.getElementById('spinnerOverlay');
    if (!spinner) {
      spinner = document.createElement('div');
      spinner.id = 'spinnerOverlay';
      spinner.className = 'spinner-overlay';
      spinner.innerHTML = `
        <div class="text-center">
          <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
          <div class="mt-2 fw-semibold text-dark">Cargando datos...</div>
        </div>
      `;
      document.body.appendChild(spinner);
    }
    spinner.style.display = mostrar ? 'flex' : 'none';
  }

  /**
   * Muestra un mensaje de alerta flotante (Toast/Banner).
   */
  function mostrarAlerta(mensaje, tipo = 'success') {
    const container = document.getElementById('alertContainer') || document.body;
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${tipo} alert-dismissible fade show position-fixed top-0 end-0 m-3 shadow-lg z-3`;
    alertDiv.style.maxWidth = '400px';
    alertDiv.role = 'alert';
    alertDiv.innerHTML = `
      <div>${mensaje}</div>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    `;
    container.appendChild(alertDiv);

    setTimeout(() => {
      const bsAlert = new bootstrap.Alert(alertDiv);
      bsAlert.close();
    }, 5000);
  }

  /**
   * Helper para escapar cadenas HTML.
   */
  function escapeHtml(text) {
    if (!text) return '';
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  /**
   * Formatea la prioridad a badge HTML.
   */
  function getBadgePrioridad(prioridad) {
    const prio = (prioridad || 'Media').toLowerCase();
    let bgClass = 'bg-secondary';
    if (prio === 'alta') bgClass = 'badge-priority-alta';
    else if (prio === 'media') bgClass = 'badge-priority-media';
    else if (prio === 'baja') bgClass = 'badge-priority-baja';

    return `<span class="badge ${bgClass}">${escapeHtml(prioridad || 'Media')}</span>`;
  }

  /**
   * Formatea el estatus a badge HTML.
   */
  function getBadgeEstatus(estatus) {
    const est = (estatus || 'Pendiente').toLowerCase();
    let bgClass = 'bg-secondary';
    if (est === 'pendiente') bgClass = 'badge-estatus-pendiente';
    else if (est === 'en proceso') bgClass = 'badge-estatus-proceso';
    else if (est === 'cumplido') bgClass = 'badge-estatus-cumplido';
    else if (est === 'cancelado') bgClass = 'badge-estatus-cancelado';

    return `<span class="badge ${bgClass}">${escapeHtml(estatus || 'Pendiente')}</span>`;
  }
</script>
