<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <?!= include('CSS'); ?>
  </head>
  <body>
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div class="container py-5">
      <div id="alertPlaceholder"></div>

      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="text-center mb-4">
            <a href="<?= getScriptUrl() ?>" class="text-decoration-none">
              <i class="fas fa-gamepad fa-3x text-primary mb-2"></i>
              <h2 class="text-dark">BitFix</h2>
            </a>
            <p class="text-muted">Consulta de Estatus de Servicio</p>
          </div>

          <div id="estatusContainer">
            <!-- Loaded via JS -->
            <div class="card shadow-sm mb-4">
              <div class="card-body p-4 text-center">
                <div class="spinner-border text-secondary mb-3" role="status"></div>
                <p>Buscando información del folio <strong id="folioUrl"><?= data.folio ?></strong>...</p>
              </div>
            </div>
          </div>

          <div class="text-center">
            <a href="<?= getScriptUrl() ?>" class="btn btn-outline-secondary">
              <i class="fas fa-arrow-left me-2"></i>Nueva Consulta
            </a>
          </div>
        </div>
      </div>
    </div>

    <?!= include('JS'); ?>
    <script>
      window.addEventListener('load', function() {
        const folio = '<?= data.folio ?>';
        if (folio) {
          consultarEstatus(folio);
        } else {
          window.top.location.href = '<?= getScriptUrl() ?>';
        }
      });

      function consultarEstatus(folio) {
        google.script.run
          .withSuccessHandler(function(res) {
            const container = document.getElementById('estatusContainer');
            if (res) {
              container.innerHTML = '';
              const card = document.createElement('div');
              card.className = 'card shadow mb-4';

              const header = document.createElement('div');
              header.className = 'card-header text-center py-3';
              const h4 = document.createElement('h4');
              h4.className = 'mb-0';
              h4.textContent = 'Folio: ' + res.Folio;
              header.appendChild(h4);

              const body = document.createElement('div');
              body.className = 'card-body p-4';

              const textCenter = document.createElement('div');
              textCenter.className = 'text-center mb-4';
              const mb2 = document.createElement('div');
              mb2.className = 'mb-2';
              mb2.textContent = 'Estatus Actual:';
              textCenter.appendChild(mb2);
              const statusSpan = document.createElement('span');
              statusSpan.innerHTML = formatStatus(res.Estatus).replace('status-badge', 'status-badge fs-4');
              textCenter.appendChild(statusSpan);

              const hr = document.createElement('hr');

              const row = document.createElement('div');
              row.className = 'row mb-3';
              const col5 = document.createElement('div');
              col5.className = 'col-5 fw-bold';
              col5.textContent = 'Dispositivo:';
              const col7 = document.createElement('div');
              col7.className = 'col-7';
              col7.textContent = res.Dispositivo;
              row.appendChild(col5);
              row.appendChild(col7);

              body.appendChild(textCenter);
              body.appendChild(hr);
              body.appendChild(row);

              card.appendChild(header);
              card.appendChild(body);

              const alert = document.createElement('div');
              alert.className = 'alert alert-light border small text-muted text-center mb-4';
              alert.innerHTML = '<i class="fas fa-info-circle me-2"></i>Los tiempos de reparación pueden variar según la disponibilidad de piezas.';

              container.appendChild(card);
              container.appendChild(alert);
            } else {
              container.innerHTML = '';
              const div = document.createElement('div');
              div.className = 'alert alert-danger text-center';

              const icon = document.createElement('i');
              icon.className = 'fas fa-exclamation-triangle fa-2x mb-3 d-block';

              const h5 = document.createElement('h5');
              h5.textContent = 'Folio no encontrado';

              const p = document.createElement('p');
              p.innerHTML = 'Verifica que el folio <strong id="folioError"></strong> sea correcto.';

              div.appendChild(icon);
              div.appendChild(h5);
              div.appendChild(p);
              container.appendChild(div);
              document.getElementById('folioError').textContent = folio;
            }
          })
          .obtenerEstatusPorFolio(folio);
      }
    </script>
  </body>
</html>
