<script>
/**
 * Sistema de Inventario - Subdirección de Mejora Regulatoria
 * Lógica de Cliente (JS.html)
 */

// Variables de estado global de la aplicación
let currentUser = ""; // Nombre del operador/usuario activo
let scannerInstance = null; // Instancia de Html5Qrcode
let isScannerRunning = false;
let currentCameraId = "";
let listadoCompleto = []; // Cache en cliente para el Listado de Inventario
let listadoFiltrado = []; // Resultados después de aplicar filtros
let paginacionActual = 1;
let paginacionLimite = 10;
let xlsxMapeadoTemp = []; // Datos de Excel listos para subir
let ubicacionesUnicas = []; // Ubicaciones cargadas dinámicamente para filtros
let webAppUrl = ""; // URL de la Web App obtenida de manera dinámica

// ============================================
// FUNCIÓN DE ESTADO UNIFICADA (SOLUCIÓN DEL ERROR)
// ============================================

/**
 * Función unificada para actualizar el estado en la UI
 * CORREGIDA: Asigna todas las clases mediante className, evitando el error de DOMTokenList
 * @param {string} mensaje - Mensaje a mostrar
 * @param {string} tipo - Tipo de mensaje: 'info', 'success', 'error', 'warning', 'loading'
 */
function updateStatus(mensaje, tipo = 'info') {
  console.log(`[Status] ${tipo.toUpperCase()}: ${mensaje}`);

  const estadoDiv = document.getElementById('estadoCamara') || document.getElementById('status-message');
  if (!estadoDiv) {
    console.warn('Elemento de estado no encontrado en el DOM');
    return;
  }

  let clasesBase = 'status-message text-xs mt-2 border-start border-3 border-info ps-2 text-start';

  // Mapeo de tipos a clases CSS limpias (sin espacios en tokens de classList)
  const clasesPorTipo = {
    'info': 'status-info text-info border-info',
    'success': 'status-success text-success border-success',
    'error': 'status-error text-danger border-danger',
    'warning': 'status-warning text-warning border-warning',
    'loading': 'status-loading text-warning border-warning'
  };

  const claseTipo = clasesPorTipo[tipo] || 'status-info text-info border-info';

  // Asignar todas las clases como string completo a través de className
  estadoDiv.className = `${clasesBase} ${claseTipo}`;

  // Actualizar texto
  estadoDiv.textContent = mensaje;

  // Si hay un elemento de estado alternativo, actualizarlo también
  const estadoAlternativo = document.getElementById('estado');
  if (estadoAlternativo) {
    estadoAlternativo.textContent = mensaje;
  }
}

/**
 * Actualiza el estado con múltiples clases CSS de forma segura
 * @param {string} mensaje - Mensaje a mostrar
 * @param {string} tipo - Tipo principal
 * @param {Array} clasesAdicionales - Array de clases adicionales
 */
function updateStatusWithClasses(mensaje, tipo = 'info', clasesAdicionales = []) {
  console.log(`[Status] ${tipo.toUpperCase()}: ${mensaje}`);

  const estadoDiv = document.getElementById('estadoCamara') || document.getElementById('status-message');
  if (!estadoDiv) {
    console.warn('Elemento de estado no encontrado');
    return;
  }

  let clases = ['status-message', 'text-xs', 'mt-2', 'border-start', 'border-3', 'ps-2', 'text-start'];

  const clasesPorTipo = {
    'info': 'status-info',
    'success': 'status-success',
    'error': 'status-error',
    'warning': 'status-warning',
    'loading': 'status-loading'
  };

  const claseTipo = clasesPorTipo[tipo] || 'status-info';
  clases.push(claseTipo);

  if (Array.isArray(clasesAdicionales)) {
    clases = clases.concat(clasesAdicionales);
  }

  // Asignar de manera segura
  estadoDiv.className = clases.join(' ');

  // Actualizar texto
  estadoDiv.textContent = mensaje;
}

// Crear alias de compatibilidad global
window.updateStatus = updateStatus;
window.updateStatusWithClasses = updateStatusWithClasses;
window.updateStatusAlias = updateStatus;
window.mostrarEstado = updateStatus;
window.setStatus = updateStatus;
window.updateUI = updateStatus;
window.updateUIStatus = updateStatus;

// Bandera para asegurar una única inicialización del ciclo de vida de la aplicación
window.isAppInitialized = false;

function inicializarAppCompleta() {
  if (window.isAppInitialized) return;
  window.isAppInitialized = true;

  // Diagnóstico obligatorio de contexto de ejecución (iframe sandbox de Google)
  const esIframe = window.self !== window.top;
  console.log("Inventario SMR - ¿Ejecutando dentro de un iframe sandbox de Google?:", esIframe);

  inicializarIdentidadUsuario();
  cargarEstadisticasInicio();

  // Por defecto mostrar sección inicio, a menos que venga redireccionado por fallback del escáner (?noinv=XXXX)
  if (typeof window.initialNoInvQuery !== "undefined" && window.initialNoInvQuery !== "") {
    showSection('escanear');
    procesarCodigoEtiqueta(window.initialNoInvQuery);
    mostrarAlerta("Código cargado desde redirección de escáner: " + window.initialNoInvQuery, "success");
  } else {
    showSection('inicio');
  }

  // Obtener URL de la Web App para el escáner de nivel superior
  google.script.run
    .withSuccessHandler(function(url) {
      webAppUrl = url;
    })
    .getScriptUrl();

  // 1. Escuchar mensajes del escáner externo vía BroadcastChannel ("inventario-smr")
  try {
    const channel = new BroadcastChannel("inventario-smr");
    channel.onmessage = function(event) {
      if (event.data && event.data.codigo) {
        procesarCodigoEtiqueta(event.data.codigo);
        mostrarAlerta("Código capturado desde ventana de escáner: " + event.data.codigo, "success");
      }
    };
  } catch (e) {
    console.warn("BroadcastChannel no soportado en este navegador: ", e);
  }

  // 2. Escuchar mensajes del escáner externo vía localStorage (evento 'storage' para navegadores más antiguos o fallback)
  window.addEventListener("storage", function(event) {
    if (event.key === "smr_scanned_code" && event.newValue) {
      procesarCodigoEtiqueta(event.newValue);
      mostrarAlerta("Código capturado desde ventana de escáner: " + event.newValue, "success");
      localStorage.removeItem("smr_scanned_code"); // Limpiar valor
    }
  });

  // Si el usuario intentó navegar antes de cargarse el script completo, redirigirlo de forma automática y fluida
  if (window.deferredSection) {
    const targetSection = window.deferredSection;
    delete window.deferredSection;

    // Ocultar el loader de seguridad temprana antes de realizar la navegación real
    hideLoader();
    showSection(targetSection);
  }
}

// Ejecutar inicialización inmediatamente si el DOM ya se cargó, de lo contrario esperar a DOMContentLoaded
if (document.readyState === "interactive" || document.readyState === "complete") {
  inicializarAppCompleta();
} else {
  document.addEventListener("DOMContentLoaded", inicializarAppCompleta);
}

/**
 * ==========================================
 * 1. IDENTIDAD DE USUARIO (SESIÓN / MANUAL)
 * ==========================================
 */
function inicializarIdentidadUsuario() {
  showLoader("Iniciando y obteniendo información del servidor...");

  // Establecer un timeout de respaldo de 6 segundos para ocultar el loader si el servidor tarda o está inactivo
  const safeTimeout = setTimeout(function() {
    console.warn("La respuesta del servidor de Apps Script ha tardado más de lo esperado. Ocultando loader preventivamente.");
    hideLoader();
    const savedUser = localStorage.getItem("smr_inventario_user");
    if (savedUser && savedUser.trim().length >= 3) {
      currentUser = savedUser;
      guardarUsuarioIdentificado(savedUser, true);
    } else {
      const modalEl = document.getElementById("modal-user-identity");
      if (modalEl) {
        const modal = new bootstrap.Modal(modalEl);
        modal.show();
      }
    }
  }, 6000);

  // Intentar obtener usuario desde Session de Google Apps Script
  google.script.run
    .withSuccessHandler(function(email) {
      clearTimeout(safeTimeout); // Desactivar timeout de respaldo
      if (email) {
        currentUser = email;
        guardarUsuarioIdentificado(email, false);
      } else {
        // No se pudo obtener sesión activa (Web App ejecutada como creador, o acceso anónimo)
        // Buscar en localStorage local
        const savedUser = localStorage.getItem("smr_inventario_user");
        if (savedUser && savedUser.trim().length >= 3) {
          currentUser = savedUser;
          guardarUsuarioIdentificado(savedUser, true);
        } else {
          hideLoader();
          // Forzar modal de identificación de usuario
          const modalEl = document.getElementById("modal-user-identity");
          if (modalEl) {
            const modal = new bootstrap.Modal(modalEl);
            modal.show();
          }
        }
      }
    })
    .withFailureHandler(function(err) {
      clearTimeout(safeTimeout); // Desactivar timeout de respaldo
      hideLoader();
      mostrarAlerta("Error al conectar con el servidor: " + err.message, "danger");
      // Intentar recuperar de localStorage si falla conexión inicial
      const savedUser = localStorage.getItem("smr_inventario_user");
      if (savedUser) {
        currentUser = savedUser;
        guardarUsuarioIdentificado(savedUser, true);
      }
    })
    .getActiveUserEmail();
}

function guardarUsuarioIdentificado(userName, guardarEnLocal) {
  currentUser = userName;
  if (guardarEnLocal) {
    localStorage.setItem("smr_inventario_user", userName);
  }

  // Actualizar UI con validaciones de existencia para evitar TypeError
  const nameDisplay = document.getElementById("current-user-name");
  if (nameDisplay) nameDisplay.textContent = userName;

  const detailsDisplay = document.getElementById("active-user-details");
  if (detailsDisplay) detailsDisplay.textContent = userName;

  // Cerrar modal si estuviera abierto
  const modalEl = document.getElementById("modal-user-identity");
  if (modalEl) {
    const modalInstance = bootstrap.Modal.getInstance(modalEl);
    if (modalInstance) {
      modalInstance.hide();
    }
  }
  hideLoader();
}

function guardarUsuarioManual() {
  const inputVal = document.getElementById("user-identity-input").value;
  if (inputVal && inputVal.trim().length >= 3) {
    guardarUsuarioIdentificado(inputVal.trim(), true);
    // Registrar el ingreso en la bitácora
    google.script.run.registrarBitacora("INGRESO_WEB", "", "Sesión iniciada por el operador", inputVal.trim());
    cargarEstadisticasInicio();
  } else {
    alert("Por favor escribe un nombre válido de al menos 3 caracteres.");
  }
}

function cambiarNombreUsuario() {
  const modalEl = document.getElementById("modal-user-identity");
  const modal = new bootstrap.Modal(modalEl);
  document.getElementById("user-identity-input").value = currentUser;
  modal.show();
}


// Bandera para prevenir navegación repetida o duplicada por clics sucesivos rápidos
let isNavigating = false;

/**
 * ==========================================
 * 2. ENRUTADOR DE VISTAS (SECCIONES)
 * ==========================================
 */
function showSection(sectionId) {
  if (isNavigating) return;
  isNavigating = true;

  try {
    // Ocultar todas las secciones
    const sections = document.querySelectorAll(".app-section");
    sections.forEach(s => s.classList.add("d-none"));

    // Desactivar todos los links de navegación
    const navLinks = document.querySelectorAll(".nav-link");
    navLinks.forEach(l => l.classList.remove("active"));

    // Mostrar la sección seleccionada
    const activeSection = document.getElementById("section-" + sectionId);
    if (activeSection) {
      activeSection.classList.remove("d-none");
    }

    // Activar link respectivo
    const activeLink = document.getElementById("nav-" + sectionId);
    if (activeLink) {
      activeLink.classList.add("active");
    }

    // Acciones secundarias al cambiar de sección
    if (sectionId !== 'escanear') {
      stopScanner(); // Apagar cámara si el usuario sale de escanear
    } else {
      // Si entra a escanear, enfocar entrada manual
      setTimeout(() => {
        const manualInput = document.getElementById("scan-manual-no-inv");
        if (manualInput) manualInput.focus();
      }, 300);
    }

    if (sectionId === 'listado') {
      cargarListadoInventario();
    } else if (sectionId === 'bitacora') {
      cargarDatosBitacora();
    } else if (sectionId === 'inicio') {
      cargarEstadisticasInicio();
    } else if (sectionId === 'buscar') {
      setTimeout(() => {
        const searchText = document.getElementById("buscar-texto");
        if (searchText) searchText.focus();
      }, 300);
    }

    // Cerrar menú responsivo colapsable de bootstrap al hacer click
    const navbarCollapse = document.getElementById("navbarNav");
    if (navbarCollapse && navbarCollapse.classList && navbarCollapse.classList.contains("show")) {
      const bsCollapse = new bootstrap.Collapse(navbarCollapse);
      bsCollapse.hide();
    }
  } catch (error) {
    console.error("Error en navegación showSection:", error);
  } finally {
    // Liberar bloqueo de navegación con un pequeño retraso
    setTimeout(() => {
      isNavigating = false;
    }, 150);
  }
}

// Exponer inmediatamente al ámbito de ventana (window) global para prevenir ReferenceError
window.showSection = showSection;


/**
 * ==========================================
 * 3. CONTROLADOR DEL ESCÁNER CON CÁMARA
 * ==========================================
 */
// Exponer callback global sincrónico para la comunicación directa del pop-up
window.procesarCodigoEtiquetaDesdePopup = function(codigo) {
  if (codigo) {
    procesarCodigoEtiqueta(codigo);
    mostrarAlerta("Código capturado desde ventana del escáner: " + codigo, "success");
  }
};

// Función para abrir el escáner de nivel superior about:blank (Opción A) para evadir las políticas del iframe de Google
function abrirPopupEscaner() {
  limpiarResultadosEscaner();

  // CAUSA RAÍZ: Google Apps Script sirve SIEMPRE la Web App dentro de un iframe sandbox (*.googleusercontent.com)
  // incluso si se abre en una pestaña nueva con /exec. Esto prohíbe la cámara a nivel de la política Permissions-Policy del iframe.
  // SOLUCIÓN DEFINTIVA (Opción A): Abrir una ventana emergente 'about:blank' (nivel superior puro) e inyectarle el HTML
  // completo del escáner de cámara. No hereda el iframe ni la Permissions-Policy restrictiva de Google.

  const popup = window.open("", "smr_camera_scanner", "width=500,height=600,scrollbars=yes,resizable=yes");

  if (!popup || popup.closed || typeof popup.closed === "undefined") {
    mostrarAlerta("¡Ventana emergente bloqueada! Por favor, permite las ventanas emergentes (pop-ups) de este sitio en la barra de direcciones de tu navegador y vuelve a presionar 'Iniciar Cámara Lector'.", "warning");
    return;
  }

  mostrarAlerta("Se ha abierto la ventana del escáner en nivel superior de forma segura. Escanea la etiqueta allí para transferir el código aquí.", "info");

  // Inyectar el HTML autocontenido del escáner en la ventana about:blank
  const htmlScannerLayout = `
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Escáner de Inventario SMR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #1a1a2e;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      font-family: system-ui, sans-serif;
    }
    .scanner-card {
      background-color: #161625;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
    }
    #reader {
      width: 100%;
      background-color: #000;
      border: none !important;
      border-radius: 12px;
      overflow: hidden;
    }
    #reader__scan_region {
      background-color: #000 !important;
    }
    #reader__dashboard {
      background: #222235 !important;
      padding: 10px !important;
      border-top: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: #fff !important;
    }
    #reader__dashboard_section_csr button {
      background-color: #16a085 !important;
      color: white !important;
      border: none !important;
      padding: 6px 12px !important;
      border-radius: 6px !important;
      font-weight: 600 !important;
    }
    .success-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(22, 160, 133, 0.95);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      border-radius: 16px;
    }
    .pulse-glow {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <header class="text-center py-2 mb-3 border-bottom border-secondary">
    <h5 class="fw-bold text-success mb-0">
      <i class="fa-solid fa-camera-retro me-2"></i>Escáner de Cámara Nivel Superior
    </h5>
    <p class="small text-muted mb-0">Subdirección de Mejora Regulatoria</p>
  </header>

  <main class="container-fluid flex-grow-1 d-flex flex-column justify-content-center p-0" style="max-width: 450px;">
    <div id="local-alert" class="alert alert-warning d-none mb-3" role="alert"></div>

    <div class="card scanner-card shadow-lg position-relative">
      <div class="card-body p-3">

        <!-- Éxito -->
        <div id="success-overlay" class="success-overlay d-none">
          <i class="fa-solid fa-circle-check fa-4x text-white mb-3 pulse-glow"></i>
          <h4 class="fw-bold">¡Código Leído!</h4>
          <p class="lead mb-4">No. INV: <strong id="success-code-text" class="bg-dark px-3 py-1 rounded text-warning">-</strong></p>

          <div class="d-grid gap-2 w-100">
            <button type="button" class="btn btn-light btn-lg fw-bold" onclick="reiniciarEscaneo()">
              <i class="fa-solid fa-arrows-rotate me-2"></i>Escanear Otro
            </button>
            <button type="button" class="btn btn-warning btn-lg fw-bold text-dark" onclick="enviarFallbackRedireccion()">
              <i class="fa-solid fa-share-from-square me-2"></i>Usar este número en Inventario
            </button>
            <button type="button" class="btn btn-outline-light" onclick="cerrarLector()">
              <i class="fa-solid fa-xmark me-2"></i>Cerrar Escáner
            </button>
          </div>
        </div>

        <div id="reader" style="width: 100%;"></div>

        <!-- Placeholder -->
        <div id="camera-placeholder" class="text-center py-5">
          <i class="fa-solid fa-barcode fa-4x text-secondary mb-3"></i>
          <p class="px-3 text-muted">Solicita los permisos nativos de cámara para poder escanear las etiquetas de patrimonio.</p>
          <div class="d-grid gap-2 col-10 mx-auto">
            <button type="button" id="btn-activar-camara" class="btn btn-success btn-lg fw-bold shadow" onclick="solicitarPermisosYComenzar()">
              <i class="fa-solid fa-circle-play me-2"></i>Activar Cámara
            </button>
          </div>
        </div>

      </div>

      <!-- Footer manual fallback (conservando el selector de cámara nativo e identificador) -->
      <div class="card-footer bg-dark border-0 p-3">
        <div id="controls-panel" class="d-flex align-items-center justify-content-between gap-2" style="display: none !important;">
          <span class="small text-muted"><i class="fa-solid fa-video me-1"></i>Cámara:</span>
          <select id="camera-select" class="form-select form-select-sm bg-secondary text-white border-0" style="max-width: 200px;" onchange="cambiarCamara(this.value)">
            <option value="">Seleccionando...</option>
          </select>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-2 text-muted small mt-3">
    <p class="mb-0">Ejecutando en ventana about:blank de nivel superior. Sincroniza en vivo sin heredar las restricciones de iframe de Google.</p>
  </footer>

</body>
</html>
  `;

  popup.document.write(htmlScannerLayout);

  // Escribir los scripts de forma dinámica y secuencial para evitar que el analizador HTML de index/GAppsScript se confunda
  // con etiquetas de cierre de script (como <\/script>) literales que romperían la carga de la aplicación matriz.
  const scriptLoader = popup.document.createElement("script");
  scriptLoader.src = "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";

  scriptLoader.onload = function() {
    const scriptLogica = popup.document.createElement("script");
    scriptLogica.textContent = `
      let scanner = null;
      let isRunning = false;
      const webAppUrl = "${webAppUrl || ''}";

      function solicitarPermisosYComenzar() {
        const alertDiv = document.getElementById("local-alert");
        alertDiv.classList.add("d-none");
        const btn = document.getElementById("btn-activar-camara");
        btn.disabled = true;
        btn.innerHTML = "Solicitando acceso...";

        console.log("Escáner Inyectado - ¿Ejecutando en iframe?:", window.self !== window.top);

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
          .then(stream => {
            stream.getTracks().forEach(track => track.stop());
            document.getElementById("camera-placeholder").classList.add("d-none");

            if (!scanner) {
              scanner = new Html5Qrcode("reader");
            }
            return Html5Qrcode.getCameras();
          })
          .then(devices => {
            if (devices && devices.length > 0) {
              const select = document.getElementById("camera-select");
              select.innerHTML = "";
              devices.forEach((device, index) => {
                const opt = document.createElement("option");
                opt.value = device.id;
                opt.textContent = device.label || "Cámara " + (index + 1);
                select.appendChild(opt);
              });

              document.getElementById("controls-panel").style.setProperty("display", "flex", "important");

              let backCam = devices.find(d =>
                d.label.toLowerCase().includes("back") ||
                d.label.toLowerCase().includes("trasera") ||
                d.label.toLowerCase().includes("environment")
              );

              const activeCamId = backCam ? backCam.id : devices[0].id;
              select.value = activeCamId;

              iniciarLector(activeCamId);
            } else {
              throw new Error("No se detectaron cámaras físicas.");
            }
          })
          .catch(err => {
            btn.disabled = false;
            btn.innerHTML = "<i class='fa-solid fa-circle-play me-2'></i>Activar Cámara";

            let msg = "No se pudo acceder a la cámara. ";
            if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
              msg += "Permiso denegado por el usuario o bloqueado por políticas de privacidad de su navegador. Por favor compruebe los permisos haciendo clic en el icono del candado en la barra de direcciones de su navegador y conceda el acceso.";
            } else if (err.name === "NotFoundError" || err.name === "DevicesNotFoundError") {
              msg += "No hay hardware de cámara disponible en este dispositivo.";
            } else if (err.name === "NotReadableError" || err.name === "TrackStartError") {
              msg += "La cámara ya está siendo utilizada por otra pestaña, navegador o aplicación.";
            } else {
              msg += err.message || err;
            }
            alertDiv.textContent = msg;
            alertDiv.classList.remove("d-none");
          });
      }

      function iniciarLector(cameraId) {
        if (isRunning) {
          scanner.stop().then(() => comenzarFlujo(cameraId));
        } else {
          comenzarFlujo(cameraId);
        }
      }

      function comenzarFlujo(cameraId) {
        const config = {
          fps: 15,
          qrbox: function(width, height) {
            const min = Math.min(width, height);
            const boxSize = Math.floor(min * 0.7);
            return { width: boxSize, height: Math.floor(boxSize * 0.5) };
          },
          aspectRatio: 1.0
        };

        scanner.start(cameraId, config, onCodeRead, () => {})
          .then(() => { isRunning = true; })
          .catch(err => { console.error(err); });
      }

      function onCodeRead(text) {
        if (scanner && isRunning) {
          scanner.stop().then(() => { isRunning = false; });
        }
        if (navigator.vibrate) {
          navigator.vibrate(150);
        }
        enviarCodigo(text);
      }

      function cambiarCamara(val) {
        if (val) iniciarLector(val);
      }

      function enviarCodigo(codigo) {
        if (!codigo) return;
        const noInv = String(codigo).trim();

        // 1. Enviar directamente vía window.opener (Capa 1: Comunicación sincrónica instantánea)
        try {
          if (window.opener && typeof window.opener.procesarCodigoEtiquetaDesdePopup === "function") {
            window.opener.procesarCodigoEtiquetaDesdePopup(noInv);
          }
        } catch (e) {
          console.warn("Error con window.opener: ", e);
        }

        // 2. Enviar vía BroadcastChannel ("inventario-smr")
        try {
          const channel = new BroadcastChannel("inventario-smr");
          channel.postMessage({ codigo: noInv });
        } catch (e) {
          console.warn("BroadcastChannel error: ", e);
        }

        // 3. Enviar vía localStorage
        try {
          localStorage.setItem("smr_scanned_code", noInv);
          localStorage.setItem("smr_scanned_time", String(Date.now()));
        } catch (e) {
          console.warn("LocalStorage error: ", e);
        }

        document.getElementById("success-code-text").textContent = noInv;
        document.getElementById("success-overlay").classList.remove("d-none");
      }

      function enviarManual() {
        const input = document.getElementById("manual-code");
        const val = input.value.trim();
        if (val) {
          enviarCodigo(val);
          input.value = "";
        }
      }

      function enviarFallbackRedireccion() {
        const code = document.getElementById("success-code-text").textContent;
        if (code && webAppUrl) {
          window.opener.location.href = webAppUrl + "?noinv=" + encodeURIComponent(code);
          window.close();
        } else if (code) {
          alert("Enlace seguro no disponible. Por favor copia este número: " + code);
        }
      }

      function reiniciarEscaneo() {
        document.getElementById("success-overlay").classList.add("d-none");
        const select = document.getElementById("camera-select");
        if (select.value) iniciarLector(select.value);
        else solicitarPermisosYComenzar();
      }

      function cerrarLector() {
        window.close();
      }

      // Intentar auto-iniciar si ya hay permisos previos guardados
      navigator.permissions.query({ name: "camera" }).then(res => {
        if (res.state === "granted") {
          solicitarPermisosYComenzar();
        }
      }).catch(e => {});
    `;
    popup.document.body.appendChild(scriptLogica);
  };

  popup.document.head.appendChild(scriptLoader);
  popup.document.close();
}

function procesarCodigoEtiqueta(codigo) {
  if (!codigo) return;
  const noInv = String(codigo).trim();

  // Mostrar feedback en UI
  const feedback = document.getElementById("scan-feedback");
  feedback.classList.remove("d-none");
  document.getElementById("scan-feedback-code").textContent = noInv;

  showLoader("Buscando artículo en inventario...");

  google.script.run
    .withSuccessHandler(function(articulo) {
      hideLoader();

      const resContainer = document.getElementById("scan-result-container");
      const notFoundContainer = document.getElementById("scan-not-found-container");

      if (articulo) {
        // EL ARTÍCULO EXISTE EN LA HOJA
        notFoundContainer.classList.add("d-none");
        resContainer.classList.remove("d-none");

        // Cabecera
        document.getElementById("scan-result-badge-noinv").textContent = articulo["No. INV."];
        document.getElementById("scan-result-title").innerHTML = `<i class="fa-solid fa-circle-check me-2"></i>Artículo Encontrado`;
        document.getElementById("scan-result-header").className = "card-header bg-success text-white d-flex justify-content-between align-items-center";

        // Detalle de solo lectura
        document.getElementById("scan-info-descripcion").textContent = articulo["DESCRIPCION"] || "(Sin descripción)";
        document.getElementById("scan-info-marca").textContent = articulo["MARCA"] || "N/A";
        document.getElementById("scan-info-modelo").textContent = articulo["MODELO"] || "N/A";
        document.getElementById("scan-info-serie").textContent = articulo["SERIE"] || "N/A";

        // Estado Badge
        const estadoBadge = document.getElementById("scan-info-estado");
        estadoBadge.textContent = articulo["ESTADO"] || "BUENO";
        if (articulo["ESTADO"] === "BUENO") estadoBadge.className = "badge bg-success";
        else if (articulo["ESTADO"] === "REGULAR") estadoBadge.className = "badge bg-warning text-dark";
        else if (articulo["ESTADO"] === "MALO") estadoBadge.className = "badge bg-danger";
        else if (articulo["ESTADO"] === "BAJA") estadoBadge.className = "badge bg-dark";
        else estadoBadge.className = "badge bg-secondary";

        document.getElementById("scan-info-ubicacion").textContent = articulo["UBICACION"] || "No especificada";
        document.getElementById("scan-info-resguardado").textContent = articulo["RESGUARDADO"] || "N/A";
        document.getElementById("scan-info-importe").textContent = articulo["IMPORTE"] !== undefined ? parseFloat(articulo["IMPORTE"]).toFixed(2) : "0.00";

        // Llenar Formulario de Actualización Real
        document.getElementById("scan-update-no-inv").value = articulo["No. INV."];
        document.getElementById("scan-update-no").value = articulo["No."];
        document.getElementById("scan-real-ubicacion").value = articulo["UBICACION_REAL"] || articulo["UBICACION"] || "";
        document.getElementById("scan-real-resguardante").value = articulo["RESGUARDANTE_REAL"] || articulo["RESGUARDADO"] || "";
        document.getElementById("scan-real-estado").value = articulo["ESTADO_REAL"] || articulo["ESTADO"] || "BUENO";

        // Llenar campos extra por si el usuario los expande
        document.getElementById("scan-extra-descripcion").value = articulo["DESCRIPCION"] || "";
        document.getElementById("scan-extra-serie").value = articulo["SERIE"] || "";
        document.getElementById("scan-extra-marca").value = articulo["MARCA"] || "";
        document.getElementById("scan-extra-modelo").value = articulo["MODELO"] || "";
        document.getElementById("scan-extra-importe").value = articulo["IMPORTE"] || 0;
        document.getElementById("scan-extra-estado").value = articulo["ESTADO"] || "BUENO";

        // Contraer sección de campos extra por defecto
        document.getElementById("scan-extra-campos").classList.add("d-none");

      } else {
        // EL ARTÍCULO NO EXISTE
        resContainer.classList.add("d-none");
        notFoundContainer.classList.remove("d-none");
        document.getElementById("scan-not-found-code").textContent = noInv;
      }
    })
    .withFailureHandler(function(err) {
      hideLoader();
      mostrarAlerta("Error al buscar artículo escaneado: " + err.message, "danger");
    })
    .buscarPorNoInv(noInv);
}

/**
 * ==========================================
 * 4. BÚSQUEDA RAPIDA CON CRITERIOS
 * ==========================================
 */
function buscarArticulosPorCriterio() {
  const criterio = document.getElementById("buscar-criterio").value;
  const texto = document.getElementById("buscar-texto").value.trim();
  const esExacto = document.getElementById("buscar-exacto").checked;

  if (!texto) {
    alert("Por favor introduce un texto de búsqueda.");
    return;
  }

  showLoader("Realizando búsqueda en la base de datos...");

  const exitoCallback = function(resultados) {
    hideLoader();

    // Si viene solo un objeto de buscarPorNoInv exacto, convertirlo a arreglo
    const dataArray = Array.isArray(resultados) ? resultados : (resultados ? [resultados] : []);

    const cardResultados = document.getElementById("buscar-resultados-card");
    const tbody = document.getElementById("buscar-resultados-tbody");
    const vacioMsg = document.getElementById("buscar-vacio-msg");
    const conteoBadge = document.getElementById("buscar-resultados-conteo");

    cardResultados.classList.remove("d-none");
    tbody.innerHTML = "";

    conteoBadge.textContent = `${dataArray.length} registros`;

    if (dataArray.length === 0) {
      vacioMsg.classList.remove("d-none");
    } else {
      vacioMsg.classList.add("d-none");

      dataArray.forEach(item => {
        const tr = document.createElement("tr");

        // Clases de badge estado
        let estadoClass = "badge bg-secondary";
        const estReal = item["ESTADO_REAL"] || item["ESTADO"] || "BUENO";
        if (estReal === "BUENO") estadoClass = "badge bg-success";
        else if (estReal === "REGULAR") estadoClass = "badge bg-warning text-dark";
        else if (estReal === "MALO") estadoClass = "badge bg-danger";
        else if (estReal === "BAJA") estadoClass = "badge bg-dark";

        tr.innerHTML = `
          <td><strong class="text-primary">${item["No. INV."]}</strong></td>
          <td class="text-ellipsis" style="max-width: 250px;" title="${item["DESCRIPCION"]}">${item["DESCRIPCION"] || ""}</td>
          <td>${item["SERIE"] || ""}</td>
          <td>${item["MARCA"] || ""}</td>
          <td>${item["MODELO"] || ""}</td>
          <td><span class="${estadoClass}">${estReal}</span></td>
          <td>${item["UBICACION_REAL"] || item["UBICACION"] || ""}</td>
          <td class="text-center">
            ${renderizarColumnaAcciones(item["No. INV."])}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
  };

  const fallaCallback = function(err) {
    hideLoader();
    mostrarAlerta("Error al realizar búsqueda: " + err.message, "danger");
  };

  if (criterio === "NO_INV") {
    // Si es búsqueda exacta por No. INV usamos buscarPorNoInv directamente, si no creamos un filtro manual
    if (esExacto) {
      google.script.run.withSuccessHandler(exitoCallback).withFailureHandler(fallaCallback).buscarPorNoInv(texto);
    } else {
      // Usar función del servidor de filtros parciales
      google.script.run.withSuccessHandler(exitoCallback).withFailureHandler(fallaCallback).buscarPorNoInvFiltros(texto, false);
    }
  } else {
    // Búsqueda por Serie
    google.script.run.withSuccessHandler(exitoCallback).withFailureHandler(fallaCallback).buscarPorSerie(texto, esExacto);
  }
}

/**
 * ==========================================
 * 6. CARGA DE EXCEL DESDE PATRIMONIO (SHEETJS)
 * ==========================================
 */
function procesarArchivoExcelLocal() {
  const fileInput = document.getElementById("excel-file-input");
  const file = fileInput.files[0];
  if (!file) return;

  showLoader("Validando y normalizando archivo Excel localmente...");

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });

      // Tomar la primera hoja de cálculo
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];

      // Convertir a JSON crudo de filas
      const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

      if (rawRows.length === 0) {
        throw new Error("El archivo de Excel está vacío.");
      }

      // Buscar la fila de encabezados y mapearla
      // Buscaremos una fila que tenga términos clave como "inv", "descrip", "serie" para tolerar filas de títulos anteriores
      let headerRowIndex = -1;
      let headersMapeados = [];

      for (let i = 0; i < Math.min(rawRows.length, 15); i++) {
        const fila = rawRows[i];
        const tieneNoInv = fila.some(celda => {
          const str = String(celda).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          return str.includes("inv") || str.includes("inventario");
        });
        const tieneDesc = fila.some(celda => {
          const str = String(celda).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          return str.includes("descrip") || str.includes("articulo");
        });

        if (tieneNoInv && tieneDesc) {
          headerRowIndex = i;
          headersMapeados = fila.map(h => String(h).trim());
          break;
        }
      }

      // Si no detectó encabezados clave, usar la primera fila por defecto
      if (headerRowIndex === -1) {
        headerRowIndex = 0;
        headersMapeados = rawRows[0].map(h => String(h).trim());
      }

      // Configurar reglas tolerantes a acentos, mayúsculas, espacios para asociar columnas
      const normalizarHeadersMap = {
        "No.": ["no", "no.", "numero", "id"],
        "No. INV.": ["no inv", "no. inv.", "no inventario", "numero inventario", "etiqueta", "noinv"],
        "DESCRIPCION": ["descripcion", "descripción", "articulo", "concepto", "nombre"],
        "SERIE": ["serie", "no serie", "no. serie", "numero de serie"],
        "MODELO": ["modelo"],
        "MARCA": ["marca"],
        "ESTADO": ["estado", "estado patrimonio"],
        "IMPORTE": ["importe", "valor", "costo", "precio"],
        "UBICACION": ["ubicacion", "ubicación"],
        "RESGUARDADO": ["resguardado", "resguardo", "resguardante"],
        "RESGUARDANTE_REAL": ["resguardante real", "resguardante_real"],
        "UBICACION_REAL": ["ubicacion real", "ubicación real", "ubicacion_real"],
        "ESTADO_REAL": ["estado real", "estado_real"]
      };

      // Encontrar correspondencia de índices
      const mapaIndicesExcel = {}; // internoHeader -> indexEnExcel

      Object.keys(normalizarHeadersMap).forEach(internoHeader => {
        const variantes = normalizarHeadersMap[internoHeader];

        const foundIndex = headersMapeados.findIndex(excelHeader => {
          const normExcel = String(excelHeader).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "").trim();

          return variantes.some(variente => {
            const normVariante = variente.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "").trim();
            return normExcel === normVariante || normExcel.includes(normVariante);
          });
        });

        if (foundIndex !== -1) {
          mapaIndicesExcel[internoHeader] = foundIndex;
        }
      });

      // Validar que tengamos al menos la columna obligatoria No. INV. y DESCRIPCION
      if (mapaIndicesExcel["No. INV."] === undefined) {
        throw new Error("No se pudo detectar de manera automática la columna de 'No. INV.' o 'Número de Inventario'. Por favor verifica los encabezados del archivo.");
      }

      // Procesar filas de datos (posteriores al headerRowIndex)
      const registrosMapeados = [];
      let totalFilasOmitidas = 0;

      for (let i = headerRowIndex + 1; i < rawRows.length; i++) {
        const fila = rawRows[i];

        // Ignorar filas totalmente vacías
        const estaVacia = fila.every(celda => String(celda).trim() === "");
        if (estaVacia) {
          totalFilasOmitidas++;
          continue;
        }

        // Extraer No. INV para validar obligatoriedad
        const noInvVal = fila[mapaIndicesExcel["No. INV."]];
        if (!noInvVal || String(noInvVal).trim() === "") {
          totalFilasOmitidas++;
          continue; // Ignorar si no tiene identificador de inventario
        }

        // Crear objeto mapeado
        const itemMapeado = {};

        // Mapear cada columna si el índice está definido en el archivo
        Object.keys(mapaIndicesExcel).forEach(internoHeader => {
          const idxExcel = mapaIndicesExcel[internoHeader];
          let valor = fila[idxExcel];

          // Tratamiento de importes para que sean numéricos limpios
          if (internoHeader === "IMPORTE") {
            if (typeof valor === "string") {
              valor = parseFloat(valor.replace(/[^0-9.-]/g, "")) || 0;
            } else if (typeof valor !== "number") {
              valor = 0;
            }
          }

          itemMapeado[internoHeader] = valor !== undefined ? String(valor).trim() : "";
        });

        registrosMapeados.push(itemMapeado);
      }

      // Guardar en cache temporal de subida
      xlsxMapeadoTemp = registrosMapeados;

      // Mostrar resumen en UI
      document.getElementById("excel-esperando-msg").classList.add("d-none");
      document.getElementById("excel-resumen-card").classList.remove("d-none");
      document.getElementById("excel-importacion-exito-alert").classList.add("d-none");

      document.getElementById("excel-total-filas").textContent = registrosMapeados.length;
      document.getElementById("excel-columnas-mapeadas").textContent = Object.keys(mapaIndicesExcel).length;
      document.getElementById("excel-filas-vacias").textContent = totalFilasOmitidas;

      // Llenar vista previa de los primeros 5
      const previewTbody = document.getElementById("excel-preview-tbody");
      previewTbody.innerHTML = "";

      const limitePreview = Math.min(registrosMapeados.length, 5);
      for (let k = 0; k < limitePreview; k++) {
        const r = registrosMapeados[k];
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${r["No. INV."] || ""}</strong></td>
          <td class="text-ellipsis" style="max-width: 150px;">${r["DESCRIPCION"] || ""}</td>
          <td>${r["SERIE"] || ""}</td>
          <td>${r["MARCA"] || ""}</td>
          <td>${r["MODELO"] || ""}</td>
          <td>${r["ESTADO"] || ""}</td>
          <td>$${parseFloat(r["IMPORTE"] || 0).toFixed(2)}</td>
        `;
        previewTbody.appendChild(tr);
      }

      // Habilitar botón de importación
      document.getElementById("btn-importar-excel").disabled = false;
      hideLoader();

    } catch (err) {
      hideLoader();
      alert("Error al procesar archivo: " + err.message);
      document.getElementById("excel-esperando-msg").classList.remove("d-none");
      document.getElementById("excel-resumen-card").classList.add("d-none");
      document.getElementById("btn-importar-excel").disabled = true;
      xlsxMapeadoTemp = [];
    }
  };

  reader.readAsArrayBuffer(file);
}

/**
 * ==========================================
 * 7. LISTADO COMPLETO, FILTROS Y PAGINACIÓN
 * ==========================================
 */
function cargarListadoInventario() {
  showLoader("Cargando listado completo de inventario...");
  console.log("[Client] Solicitando listado de inventario calling listarArticulos()...");
  google.script.run
    .withSuccessHandler(function(articulos) {
      console.log("[Client] Listado recibido con éxito. Cantidad de artículos:", articulos ? articulos.length : null);
      listadoCompleto = articulos || [];

      // Obtener lista única de ubicaciones para el filtro de ubicaciones reales
      const setUbi = new Set();
      listadoCompleto.forEach(item => {
        const ubi = item["UBICACION_REAL"] || item["UBICACION"];
        if (ubi && String(ubi).trim() !== "") {
          setUbi.add(String(ubi).trim());
        }
      });

      ubicacionesUnicas = Array.from(setUbi).sort();

      // Llenar selector de filtros de ubicación
      const ubiSelect = document.getElementById("filtro-ubicacion");
      const seleccionActual = ubiSelect.value;

      ubiSelect.innerHTML = `<option value="">-- Todas las Ubicaciones --</option>`;
      ubicacionesUnicas.forEach(u => {
        const option = document.createElement("option");
        option.value = u;
        option.textContent = u;
        ubiSelect.appendChild(option);
      });

      if (ubicacionesUnicas.includes(seleccionActual)) {
        ubiSelect.value = seleccionActual;
      }

      aplicarFiltrosYListar();
      hideLoader();
    })
    .withFailureHandler(function(err) {
      console.error("[Client] Fallo al cargar listado de inventario:", err);
      hideLoader();
      mostrarAlerta("Error al obtener listado de inventario: " + err.message, "danger");
    })
    .listarArticulos();
}

function aplicarFiltrosYListar() {
  const fEstado = document.getElementById("filtro-estado").value;
  const fUbi = document.getElementById("filtro-ubicacion").value;
  const fRapido = document.getElementById("filtro-rapido").value.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  listadoFiltrado = listadoCompleto.filter(item => {
    // Filtrar de forma ultra-defensiva filas completamente vacías o sin No. INV.
    if (!item || !item["No. INV."] || String(item["No. INV."]).trim() === "") {
      return false;
    }

    // 1. Filtrar por Estado Real (o patrimonio si no tiene real)
    const estReal = item["ESTADO_REAL"] || item["ESTADO"] || "BUENO";
    if (fEstado && estReal !== fEstado) {
      return false;
    }

    // 2. Filtrar por Ubicación Real (o patrimonio si no tiene)
    const ubiReal = item["UBICACION_REAL"] || item["UBICACION"] || "";
    if (fUbi && ubiReal !== fUbi) {
      return false;
    }

    // 3. Filtro rápido de texto libre sobre múltiples columnas
    if (fRapido) {
      const matchText = `${item["No. INV."]} ${item["DESCRIPCION"]} ${item["SERIE"]} ${item["MARCA"]} ${item["MODELO"]} ${ubiReal} ${item["RESGUARDANTE_REAL"]} ${item["RESGUARDADO"]}`
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

      if (matchText.indexOf(fRapido) === -1) {
        return false;
      }
    }

    return true;
  });

  // Reiniciar a página 1 al filtrar
  paginacionActual = 1;
  renderizarListadoTabla();
}

function renderizarListadoTabla() {
  const tbody = document.getElementById("listado-tbody");
  const vacioMsg = document.getElementById("listado-vacio-msg");
  const conteoBadge = document.getElementById("listado-conteo");

  tbody.innerHTML = "";

  const totalItems = listadoFiltrado.length;
  conteoBadge.textContent = `${totalItems} de ${listadoCompleto.length} registros`;

  if (totalItems === 0) {
    vacioMsg.classList.remove("d-none");
    document.getElementById("listado-paginacion-ul").innerHTML = "";
    return;
  }

  vacioMsg.classList.add("d-none");

  // Calcular límites de paginación
  const inicioIdx = (paginacionActual - 1) * paginacionLimite;
  const finIdx = Math.min(inicioIdx + paginacionLimite, totalItems);

  const itemsPagina = listadoFiltrado.slice(inicioIdx, finIdx);

  itemsPagina.forEach(item => {
    const tr = document.createElement("tr");

    // Formatear estado real
    const estReal = item["ESTADO_REAL"] || item["ESTADO"] || "BUENO";
    let estadoClass = "badge bg-secondary";
    if (estReal === "BUENO") estadoClass = "badge bg-success";
    else if (estReal === "REGULAR") estadoClass = "badge bg-warning text-dark";
    else if (estReal === "MALO") estadoClass = "badge bg-danger";
    else if (estReal === "BAJA") estadoClass = "badge bg-dark";

    tr.innerHTML = `
      <td>${item["No."] || ""}</td>
      <td><strong class="text-primary">${item["No. INV."]}</strong></td>
      <td class="text-ellipsis" style="max-width: 250px;" title="${item["DESCRIPCION"]}">${item["DESCRIPCION"] || ""}</td>
      <td>${item["SERIE"] || ""}</td>
      <td>${item["MARCA"] || ""}</td>
      <td>${item["MODELO"] || ""}</td>
      <td>${item["UBICACION_REAL"] || item["UBICACION"] || ""}</td>
      <td><span class="${estadoClass}">${estReal}</span></td>
      <td class="small text-secondary">${item["USUARIO_OPERADOR"] || "Sin registrar"}</td>
      <td class="small text-secondary">${item["RESGUARDANTE_REAL"] || item["RESGUARDADO"] || "Sin asignar"}</td>
      <td class="text-center">
        ${renderizarColumnaAcciones(item["No. INV."])}
      </td>
    `;
    tbody.appendChild(tr);
  });

  // Dibujar paginador
  renderizarControlesPaginacion(totalItems);
}

function renderizarControlesPaginacion(totalItems) {
  const totalPaginas = Math.ceil(totalItems / paginacionLimite);
  const ul = document.getElementById("listado-paginacion-ul");
  ul.innerHTML = "";

  if (totalPaginas <= 1) return;

  // Botón Anterior
  const liPrev = document.createElement("li");
  liPrev.className = `page-item ${paginacionActual === 1 ? 'disabled' : ''}`;
  liPrev.innerHTML = `<a class="page-link" href="#" onclick="cambiarPagina(${paginacionActual - 1})">Anterior</a>`;
  ul.appendChild(liPrev);

  // Páginas numeradas
  // Para optimizar en pantallas móviles limitamos a mostrar un máximo de 5 páginas alrededor de la activa
  let startPage = Math.max(1, paginacionActual - 2);
  let endPage = Math.min(totalPaginas, startPage + 4);
  if (endPage - startPage < 4) {
    startPage = Math.max(1, endPage - 4);
  }

  for (let i = startPage; i <= endPage; i++) {
    const li = document.createElement("li");
    li.className = `page-item ${paginacionActual === i ? 'active' : ''}`;
    li.innerHTML = `<a class="page-link" href="#" onclick="cambiarPagina(${i})">${i}</a>`;
    ul.appendChild(li);
  }

  // Botón Siguiente
  const liNext = document.createElement("li");
  liNext.className = `page-item ${paginacionActual === totalPaginas ? 'disabled' : ''}`;
  liNext.innerHTML = `<a class="page-link" href="#" onclick="cambiarPagina(${paginacionActual + 1})">Siguiente</a>`;
  ul.appendChild(liNext);
}

function cambiarPagina(pagina) {
  paginacionActual = pagina;
  renderizarListadoTabla();
}

function cambiarLimitePaginacion(nuevoLimite) {
  paginacionLimite = parseInt(nuevoLimite);
  paginacionActual = 1;
  renderizarListadoTabla();
}

function limpiarFiltrosCompleto() {
  document.getElementById("filtro-estado").value = "";
  document.getElementById("filtro-ubicacion").value = "";
  document.getElementById("filtro-rapido").value = "";
  aplicarFiltrosYListar();
}

/**
 * ==========================================
 * 7.5 GENERADOR DE ETIQUETAS QR COMPACTO PARA IMPRESIÓN Y DESCARGA
 * ==========================================
 */
// Variable global para almacenar el QR actual
let currentQrInstance = null;
let currentQrItem = null;

/**
 * Función auxiliar para renderizar el código QR y abrir el modal con la información de un artículo.
 * @param {Object} item - El objeto del artículo con sus propiedades.
 */
function renderizarQRConItem(item) {
  try {
    // Validar de manera proactiva que el artículo y sus datos esenciales existan
    if (!item) {
      mostrarAlerta("No se proporcionó información de artículo válida.", "danger");
      return;
    }
    if (!item["No. INV."] && String(item["No. INV."]).trim() === "") {
      mostrarAlerta("El artículo seleccionado no contiene un Número de Inventario ('No. INV.') válido.", "danger");
      return;
    }

    currentQrItem = item;

    // Rellenar información visual en el modal
    document.getElementById("qr-info-no-inv").textContent = item["No. INV."] || "";
    document.getElementById("qr-info-desc").textContent = item["DESCRIPCION"] || "Sin descripción";
    document.getElementById("qr-info-serie").textContent = "Serie: " + (item["SERIE"] || "N/A");

    // Limpiar el contenedor del QR anterior
    const qrContainer = document.getElementById("qr-code-element");
    qrContainer.innerHTML = "";

    // De acuerdo con la Solicitud 1, simplificamos el contenido del código QR
    // para que exclusivamente codifique el Número de Inventario (ID único del artículo).
    // Esto optimiza y acelera significativamente el proceso de escaneo interactivo en campo.
    const payloadString = String(item["No. INV."]).trim();

    // Crear el nuevo código QR (mínimo de 200x200px) utilizando QRCode.js
    currentQrInstance = new QRCode(qrContainer, {
      text: payloadString,
      width: 200,
      height: 200,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });

    // Abrir el modal de Bootstrap
    const modalEl = document.getElementById("modal-generar-qr");
    const modalInstance = new bootstrap.Modal(modalEl);
    modalInstance.show();
  } catch (error) {
    console.error("Error en renderizarQRConItem:", error);
    mostrarAlerta("Error al renderizar el código QR: " + error.message, "danger");
  }
}

/**
 * Función principal para generar el código QR de un artículo desde el listado.
 * Implementa búsqueda local robusta e inmune a discrepancias de tipos de datos,
 * fallback automático de consulta en tiempo real al servidor en caso de caché vacía o desincronizada,
 * y control defensivo de excepciones.
 * @param {string|number} noInv - Número de inventario del artículo seleccionado.
 */
function abrirGeneradorQR(noInv) {
  try {
    if (!noInv || String(noInv).trim() === "") {
      mostrarAlerta("Número de inventario inválido o vacío.", "danger");
      return;
    }

    // Convertir el parámetro a string para una comparación 100% robusta
    const searchVal = String(noInv).trim().toLowerCase();

    // Buscar artículo en caché local listadoCompleto
    const item = listadoCompleto.find(i => String(i["No. INV."]).trim().toLowerCase() === searchVal);

    if (item) {
      renderizarQRConItem(item);
    } else {
      // Fallback: Si el artículo no está en caché, solicitar los datos frescos al servidor en tiempo real
      showLoader("Buscando artículo en el servidor...");
      google.script.run
        .withSuccessHandler(function(serverItem) {
          hideLoader();
          if (serverItem) {
            renderizarQRConItem(serverItem);
          } else {
            mostrarAlerta("No se encontró ningún artículo con el No. INV. '" + noInv + "' en la base de datos de Google Sheets.", "danger");
          }
        })
        .withFailureHandler(function(error) {
          hideLoader();
          console.error("Error en google.script.run.buscarPorNoInv:", error);
          mostrarAlerta("Error al buscar artículo en el servidor: " + error.message, "danger");
        })
        .buscarPorNoInv(noInv);
    }
  } catch (error) {
    console.error("Error en abrirGeneradorQR:", error);
    mostrarAlerta("Ocurrió un error inesperado al procesar la generación de código QR: " + error.message, "danger");
  }
}

function descargarLabelQRPNG() {
  if (!currentQrItem) return;

  try {
    // Buscar la imagen generada por qrcode.js
    const qrContainer = document.getElementById("qr-code-element");
    const img = qrContainer.querySelector("img");
    const canvas = qrContainer.querySelector("canvas");

    let imageSrc = "";
    if (img && img.src) {
      imageSrc = img.src;
    } else if (canvas) {
      imageSrc = canvas.toDataURL("image/png");
    } else {
      mostrarAlerta("No se pudo obtener la imagen del QR para descarga.", "danger");
      return;
    }

    // Crear enlace temporal de descarga
    const link = document.createElement("a");
    link.href = imageSrc;
    link.download = `QR_${currentQrItem["No. INV."] || "Etiqueta"}.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

  } catch (error) {
    console.error("Error al descargar PNG:", error);
    mostrarAlerta("Error al intentar descargar la etiqueta como PNG.", "danger");
  }
}

/**
 * Valida localmente el formato y tamaño del archivo seleccionado por el usuario antes de procesarlo.
 */
function validarYPrevisualizarFotoLocal() {
  const fileInput = document.getElementById("fotos-file-input");
  const btnSubir = document.getElementById("btn-fotos-subir");
  const previewDiv = document.getElementById("fotos-preview-local");
  const previewImg = document.getElementById("fotos-preview-img");
  const previewInfo = document.getElementById("fotos-preview-info");

  btnSubir.disabled = true;
  previewDiv.classList.add("d-none");

  if (fileInput.files.length === 0) return;

  const file = fileInput.files[0];
  const sizeMB = file.size / (1024 * 1024);
  const ext = file.name.split(".").pop().toLowerCase();

  const formatosPermitidos = ["png", "jpg", "jpeg", "gif", "webp"];
  if (formatosPermitidos.indexOf(ext) === -1) {
    alert("Formato no permitido. Solo se aceptan imágenes JPG, PNG, GIF o WEBP.");
    fileInput.value = "";
    return;
  }

  if (sizeMB > 5) {
    alert("El archivo excede los 5MB máximos permitidos.");
    fileInput.value = "";
    return;
  }

  // Mostrar vista previa local
  const reader = new FileReader();
  reader.onload = function(e) {
    previewImg.src = e.target.result;
    previewInfo.textContent = `${file.name} (${sizeMB.toFixed(2)} MB)`;
    previewDiv.classList.remove("d-none");
    btnSubir.disabled = false;
  };
  reader.readAsDataURL(file);
}

/**
 * Convierte el archivo previsualizado a Base64 y lo envía a Google Drive mediante el servidor de GAS.
 */
function subirFotoLocalAlServidor() {
  const fileInput = document.getElementById("fotos-file-input");
  if (fileInput.files.length === 0) return;

  const noInv = document.getElementById("fotos-no-inv").value;
  const file = fileInput.files[0];
  const ext = file.name.split(".").pop().toLowerCase();

  // Cerrar modal de fotos para dar paso al loader
  const modalEl = document.getElementById("modal-fotos");
  const modalInstance = bootstrap.Modal.getInstance(modalEl);
  if (modalInstance) modalInstance.hide();

  showLoader("Subiendo imagen de evidencia a Google Drive...");

  const reader = new FileReader();
  reader.onload = function(e) {
    const base64Data = e.target.result;

    google.script.run
      .withSuccessHandler(function(res) {
        hideLoader();
        if (res.success) {
          mostrarAlerta("Fotografía adjuntada con éxito en Google Drive.", "success");

          // Forzar actualización inmediata del listado local
          cargarListadoInventario();

          // Reabrir el modal con el listado actualizado después de un breve delay para refrescar
          setTimeout(() => {
            abrirModalFotos(noInv);
          }, 600);
        } else {
          mostrarAlerta("Error al subir foto: " + res.message, "danger");
        }
      })
      .withFailureHandler(function(err) {
        hideLoader();
        mostrarAlerta("Error de servidor al subir foto: " + err.message, "danger");
      })
      .subirFotoArticulo(noInv, base64Data, ext, file.name);
  };
  reader.readAsDataURL(file);
}

/**
 * Solicita la eliminación de una foto en el servidor de GAS.
 */
function eliminarFotoArticuloJS(noInv, fileId) {
  if (!confirm("¿Está seguro de eliminar de forma permanente esta fotografía de evidencia?")) return;

  // Cerrar modal fotos

function exportarExcelSheetJS() {
  if (listadoFiltrado.length === 0) {
    alert("No hay registros en el listado activo para exportar.");
    return;
  }

  showLoader("Generando archivo de Excel...");

  try {
    // Definir los encabezados oficiales de salida
    const headers = [
      "No.",
      "No. INV.",
      "DESCRIPCION",
      "SERIE",
      "MODELO",
      "MARCA",
      "ESTADO",
      "IMPORTE",
      "UBICACION",
      "RESGUARDADO",
      "RESGUARDANTE_REAL",
      "UBICACION_REAL",
      "ESTADO_REAL",
      "ULTIMA_ACTUALIZACION"
    ];

    // Preparar filas
    const rows = listadoFiltrado.map(item => [
      item["No."] || "",
      item["No. INV."] || "",
      item["DESCRIPCION"] || "",
      item["SERIE"] || "",
      item["MODELO"] || "",
      item["MARCA"] || "",
      item["ESTADO"] || "",
      parseFloat(item["IMPORTE"] || 0),
      item["UBICACION"] || "",
      item["RESGUARDADO"] || "",
      item["RESGUARDANTE_REAL"] || "",
      item["UBICACION_REAL"] || "",
      item["ESTADO_REAL"] || "",
      item["ULTIMA_ACTUALIZACION"] || ""
    ]);

    // Insertar headers al inicio
    rows.unshift(headers);

    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Inventario_SMR");

    // Exportar descarga local
    const fecha = new Date().toISOString().split('T')[0];
    XLSX.writeFile(wb, `Inventario_SMR_Patrimonio_${fecha}.xlsx`);
    hideLoader();
  } catch (err) {
    hideLoader();
    alert("Error al exportar Excel: " + err.message);
  }
}

function exportarCSV() {
  if (listadoFiltrado.length === 0) {
    alert("No hay registros para exportar.");
    return;
  }

  showLoader("Generando archivo CSV...");

  try {
    const headers = [
      "No.", "No. INV.", "DESCRIPCION", "SERIE", "MODELO", "MARCA", "ESTADO",
      "IMPORTE", "UBICACION", "RESGUARDADO", "RESGUARDANTE_REAL", "UBICACION_REAL",
      "ESTADO_REAL", "ULTIMA_ACTUALIZACION"
    ];

    let csvContent = "\ufeff"; // BOM para asegurar codificación UTF-8 correcta en Excel español
    csvContent += headers.map(h => `"${h.replace(/"/g, '""')}"`).join(",") + "\n";

    listadoFiltrado.forEach(item => {
      const row = [
        item["No."] || "",
        item["No. INV."] || "",
        item["DESCRIPCION"] || "",
        item["SERIE"] || "",
        item["MODELO"] || "",
        item["MARCA"] || "",
        item["ESTADO"] || "",
        item["IMPORTE"] || 0,
        item["UBICACION"] || "",
        item["RESGUARDADO"] || "",
        item["RESGUARDANTE_REAL"] || "",
        item["UBICACION_REAL"] || "",
        item["ESTADO_REAL"] || "",
        item["ULTIMA_ACTUALIZACION"] || ""
      ];
      csvContent += row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",") + "\n";
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    const fecha = new Date().toISOString().split('T')[0];

    link.setAttribute("href", url);
    link.setAttribute("download", `Inventario_SMR_Export_${fecha}.csv`);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    hideLoader();
  } catch (err) {
    hideLoader();
    alert("Error al exportar CSV: " + err.message);
  }
}

function cargarEstadisticasInicio() {
  console.log("[Client] Solicitando estadísticas de inicio calling listarArticulos()...");
  google.script.run
    .withSuccessHandler(function(articulos) {
      console.log("[Client] Estadísticas recibidas con éxito. Cantidad de artículos:", articulos ? articulos.length : null);
      if (!articulos) {
        console.warn("[Client] No se recibieron artículos para estadísticas.");

let mediaStream = null;

// Función para iniciar la cámara con validación de Permissions API e instrucciones en español
function startScanner() {
  try {
    // Verificar si el navegador soporta getUserMedia
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      updateStatus('❌ Tu navegador no soporta el acceso directo a la cámara', 'error');
      showManualInputFallback();
      return;
    }

    // Mostrar mensaje de espera
    updateStatus('📷 Solicitando permisos de cámara...', 'info');

    // Activar tarjeta contenedora
    const card = document.getElementById('scanner-container-card');
    if (card) {
      card.style.display = 'block';
    }

    // Verificar permisos mediante Permissions API primero si está disponible
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'camera' })
        .then(permissionStatus => {
          console.log('Estado de permiso de cámara:', permissionStatus.state);

          if (permissionStatus.state === 'denied') {
            updateStatus('⚠️ Permiso de cámara denegado. Por favor, usa la entrada manual.', 'error');
            showManualInputFallback();
            return;
          }

          // Proceder a solicitar acceso real de cámara
          requestCameraAccess();
        })
        .catch(error => {
          console.warn('Permissions API no soportada, intentando acceso directo:', error);
          requestCameraAccess();
        });
    } else {
      // Acceso directo directo en navegadores antiguos
      requestCameraAccess();
    }
  } catch (error) {
    console.error('Error en startScanner:', error);
    updateStatus('❌ Error al iniciar: ' + error.message, 'error');
    showManualInputFallback();
  }
}

// Función para solicitar acceso físico a la cámara
function requestCameraAccess() {
  const videoElement = document.getElementById('video');
  const container = document.getElementById('cameraContainer');

  if (!videoElement || !container) {
    updateStatus('❌ Elementos de cámara no encontrados en el DOM', 'error');
    return;
  }

  // Limpiar stream anterior
  if (mediaStream) {
    mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
  }

  // Configuración ideal para captura de código de barras / QR de patrimonio
  const constraints = {
    video: {
      facingMode: 'environment',
      width: { ideal: 640 },
      height: { ideal: 480 }
    },
    audio: false
  };

  // Obtener stream
  navigator.mediaDevices.getUserMedia(constraints)
    .then(stream => {
      mediaStream = stream;
      window.currentStream = stream; // Guardar también en variable window para redundancia requerida
      videoElement.srcObject = stream;

      videoElement.onloadedmetadata = () => {
        videoElement.play()
          .then(() => {
            container.style.display = 'block';
            window.scannerActive = true;
            updateStatus('✅ Cámara activa - Listo para capturar', 'success');

            // Mostrar y activar botón de captura de foto
            const captureBtn = document.getElementById('btnCapturar');
            if (captureBtn) {
              captureBtn.style.display = 'inline-block';
              captureBtn.disabled = false;
            }
          })
          .catch(error => {
            console.error('Error al reproducir video:', error);
            updateStatus('⚠️ Error al reproducir video: ' + error.message, 'error');
          });
      };
    })
    .catch(error => {
      console.error('Error al acceder a la cámara:', error);
      handleCameraError(error);
    });
}

// Manejo robusto de errores de cámara mapeados en español
function handleCameraError(error) {
  let message = '';
  let solution = '';

  switch (error.name) {
    case 'NotAllowedError':
      message = '⚠️ Permiso denegado por el navegador o bloqueado por iframe de Google';
      solution = '🔹 Por favor, concede permisos de cámara haciendo clic en el icono del candado en la barra de direcciones.\n🔹 Alternativamente, usa el buscador manual de inventario.';
      break;
    case 'NotFoundError':
      message = '❌ No se encontró cámara instalada en el dispositivo';
      solution = '🔹 Conecta un dispositivo de cámara o usa el campo de entrada manual.';
      break;
    case 'NotReadableError':
      message = '❌ No se puede acceder a la cámara física';
      solution = '🔹 Asegúrate de que otra pestaña, navegador o aplicación no esté utilizando la cámara actualmente.';
      break;
    case 'OverconstrainedError':
      message = '❌ Configuración de resolución de cámara no compatible';
      solution = '🔹 Usa la entrada manual de inventario como fallback.';
      break;
    case 'SecurityError':
      message = '🔒 Error de seguridad al acceder';
      solution = '🔹 Concede permisos en tu barra de direcciones del navegador o usa entrada manual.';
      break;
    default:
      message = '❌ Error al abrir la cámara: ' + error.message;
      solution = '🔹 Por favor ingresa el No. de Inventario manualmente.';
  }

  updateStatus(message, 'error');
  showManualInputFallback();
  console.log('Solución recomendada:', solution);
  mostrarAlerta(message + ". Solución: " + solution, "warning");
}

// Capturar frame de cámara y procesar OCR simulado/real
function captureAndProcess() {
  try {
    const videoElement = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    if (!videoElement || !canvas) {
      updateStatus('❌ Elementos de captura no disponibles', 'error');
      return;
    }

    if (!window.scannerActive || !mediaStream) {
      updateStatus('⚠️ Cámara no activa. Inicia la cámara primero.', 'warning');
      return;
    }

    // Mostrar estado de captura
    updateStatus('📸 Capturando imagen...', 'info');

    // Configurar canvas
    const context = canvas.getContext('2d');
    canvas.width = videoElement.videoWidth || 640;
    canvas.height = videoElement.videoHeight || 480;

    // Capturar frame de video actual
    context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

    // Convertir a jpeg base64 con compresión optimizada
    const imageData = canvas.toDataURL('image/jpeg', 0.85);
    currentImageData = imageData;

    // Mostrar previsualización local
    showImagePreview(imageData);

    // Iniciar procesamiento OCR en el servidor
    updateStatus('🔄 Procesando imagen...', 'info');
    showLoadingIndicator(true);

    // Enviar a Google Apps Script para procesamiento OCR
    google.script.run
      .withSuccessHandler(function(result) {
        showLoadingIndicator(false);
        handleOCRResult(result);
      })
      .withFailureHandler(function(error) {
        showLoadingIndicator(false);
        console.error('Error en OCR:', error);
        updateStatus('❌ Error al procesar: ' + error.message, 'error');
        showManualInputFallback();
      })
      .processImageForOCR(imageData);

  } catch (error) {
    console.error('Error en captureAndProcess:', error);
    updateStatus('❌ Error al capturar: ' + error.message, 'error');
    showLoadingIndicator(false);
  }
}

// Manejar resultado del OCR
function handleOCRResult(result) {
  if (result.success) {
    const inventoryNumber = result.inventoryNumber || result.number || '';

    if (inventoryNumber) {
      updateStatus('✅ Número detectado: ' + inventoryNumber, 'success');

      // Llenar el input principal de inventario
      const inventoryInput = document.getElementById('inventory-number');
      if (inventoryInput) {
        inventoryInput.value = inventoryNumber;
      }

      // Iniciar búsqueda automática del activo en la base de datos
      updateStatus('🔍 Buscando información en Google Sheets...', 'info');
      searchInventoryNumber(inventoryNumber);
    } else {
      updateStatus('⚠️ No se pudo extraer un número de inventario legible de la foto', 'warning');
      showManualInputFallback();
    }
  } else {
    updateStatus('❌ Error en OCR: ' + (result.error || 'Error desconocido'), 'error');
    showManualInputFallback();
  }
}

// Detener la cámara local auxiliar y apagar video
function stopCamera() {
  try {
    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
    }
    if (window.currentStream) {
      window.currentStream.getTracks().forEach(track => track.stop());
      window.currentStream = null;
    }

    const videoElement = document.getElementById('video');
    if (videoElement) {
      videoElement.srcObject = null;
      videoElement.pause();
    }

    const container = document.getElementById('cameraContainer');
    if (container) {
      container.style.display = 'none';
    }
    const card = document.getElementById('scanner-container-card');
    if (card) {
      card.style.display = 'none';
    }

    window.scannerActive = false;
    updateStatus('✅ Cámara detenida', 'info');

    const captureBtn = document.getElementById('btnCapturar');
    if (captureBtn) {
      captureBtn.style.display = 'none';
      captureBtn.disabled = true;
    }

    const previewContainer = document.getElementById('preview-container');
    if (previewContainer) {
      previewContainer.innerHTML = '';
    }

  } catch (error) {
    console.error('Error en stopCamera:', error);
  }
}

// Configurar elementos con verificación de existencia

// Función c() corregida defensivamente para evitar fallos de lectura de classList en elementos null (producidos por extensiones/content.js)
function c(element) {
  try {
    if (!element) {
      console.warn('Función c(): Elemento no encontrado o es nulo.');
      return null;
    }
    if (element.classList) {
      element.classList.add('some-class');
    } else {
      console.warn('Función c(): El elemento no posee la propiedad classList.');
    }
    return element;
  } catch (error) {
    console.error('Error defensivo en función c():', error.message);
    return null;
  }
}

// Función manejarElemento() para manipulación robusta contra elementos null/undefined (producidos por extensiones/content.js)
function manejarElemento(elemento) {
  if (!elemento) {
    console.warn('Función manejarElemento(): Elemento no disponible.');
    return null;
  }
  try {
    if (elemento.classList) {
      elemento.classList.add('active');

    return elemento;
  } catch (error) {

}

// Inicializador específico del Escáner Local
function inicializarSistemaOCR() {
  console.log('Inicializando controles y listeners del sistema de Escaneo Local QR/Barcode...');

  // Registrar listeners para botones de control del Escáner
  const btnIniciar = document.getElementById('btnIniciarCamara');
  const btnDetener = document.getElementById('btnDetenerCamara');

  if (btnIniciar) {
    btnIniciar.onclick = iniciarEscaneoLocal;
  }
  if (btnDetener) {
    btnDetener.onclick = detenerEscaneoLocal;
  }

  // Cargar historial local
  cargarHistorialOCR();

  // Registrar listeners preventivos para cierre/ocultamiento de ventana
  window.addEventListener('pagehide', function() {
    detenerEscaneoLocal();
    guardarHistorialOCR();
  });

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') {
      detenerEscaneoLocal();
      guardarHistorialOCR();
    }
  });
}

// Iniciar cámara local para Escaneo Real
async function iniciarEscaneoLocal() {
  try {
    if (localScannerActive) {
      await detenerEscaneoLocal();
    }

    mostrarEstadoOCR('📷 Solicitando acceso a la cámara...', 'loading');

    if (!localQrScannerInstance) {
      localQrScannerInstance = new Html5Qrcode("local-qr-reader");
    }

    // Configuración del escáner
    const config = {
      fps: 15,
      qrbox: function(width, height) {
        // Cuadro de escaneo adaptativo de 250px o el 70% del ancho
        const minSize = Math.min(width, height);
        const size = Math.floor(minSize * 0.7);
        return { width: size, height: size };
      },
      aspectRatio: 1.333333
    };

    actualizarUIIniciadoOCR();

    await localQrScannerInstance.start(
      { facingMode: "environment" },
      config,
      onScanSuccess,
      onScanError
    );

    localScannerActive = true;
    mostrarEstadoOCR('📷 Escáner activo - Enfoque el código de barras o QR', 'success');

  } catch (error) {
    console.error('Error al iniciar escáner local:', error);
    let mensaje = '❌ Error al iniciar la cámara: ';
    if (error.name === 'NotAllowedError' || error.toString().includes('NotAllowedError') || error.toString().includes('Permission')) {
      mensaje += 'Permiso denegado. Permita el acceso a la cámara en su navegador.';
    } else {
      mensaje += error.message || error;
    }
    mostrarEstadoOCR(mensaje, 'error');
    actualizarUIDetenerOCR();
  }
}

// Detener escáner local
async function detenerEscaneoLocal() {
  try {
    if (localQrScannerInstance && localScannerActive) {
      await localQrScannerInstance.stop();
    }
    localScannerActive = false;
    actualizarUIDetenerOCR();
    mostrarEstadoOCR('⏹ Escáner detenido', 'info');
  } catch (error) {
    console.error('Error al detener escáner local:', error);
    localScannerActive = false;
    actualizarUIDetenerOCR();
  }
}

// Éxito al escanear código
async function onScanSuccess(decodedText, decodedResult) {
  try {
    console.log(`Código detectado con éxito: ${decodedText}`);

    // Detener automáticamente el escaneo para no generar ráfagas
    await detenerEscaneoLocal();

    // Reproducir un pitido o mostrar feedback visual rápido
    const numTxt = document.getElementById('numeroTexto');
    if (numTxt) numTxt.textContent = decodedText;

    mostrarEstadoOCR(`✅ Código detectado: ${decodedText}`, 'success');

    // Buscar en el inventario real de Sheets
    await buscarEnInventarioOCR(decodedText);

  } catch (err) {
    console.error("Error procesando lectura exitosa:", err);
  }
}

function onScanError(errorMessage) {
  // Ignorar errores continuos de falta de lectura o desenfoque en cada cuadro de video

}

// Buscar el código extraído en Google Sheets
async function buscarEnInventarioOCR(numero) {
  try {
    mostrarEstadoOCR(`🔍 Buscando número ${numero} en Google Sheets...`, 'loading');

    google.script.run
      .withSuccessHandler(function(resultado) {
        if (resultado) {
          mostrarResultadoExitoOCR(resultado);
          agregarAlHistorialOCR(numero, resultado);
          // Sincronizar con el formulario de levantamiento
          procesarCodigoEtiqueta(numero);
        } else {
          mostrarResultadoErrorOCR(`El código ${numero} no se encuentra en la base de datos de Patrimonio`);
          agregarAlHistorialOCR(numero, null);
          // Permitir dar de alta el artículo no existente
          procesarCodigoEtiqueta(numero);
        }
      })
      .withFailureHandler(function(error) {
        console.error('Error en búsqueda de escáner:', error);
        mostrarResultadoErrorOCR(`Error del servidor: ${error.message}`);
      })
      .buscarPorNumeroInventario(numero);
  } catch (error) {
    console.error('Error en buscarEnInventarioOCR:', error);
  }
}
