<script>
/**
 * SISTEMA DE INVENTARIO FÍSICO - SUBDIRECCIÓN DE MEJORA REGULATORIA
 * Frontend: JavaScript.html
 *
 * Lógica interactiva de la Single Page Application (SPA).
 */

// Caché y estado en el cliente
let dbInventario = [];
let dbUbicacionesUnicas = [];
let dbResguardantesUnicos = [];
let usuarioActivoEmail = "Usuario Desconocido";

// Configuración de paginación
const REGISTROS_POR_PAGINA = 20;
let paginaActual = 1;
let totalRegistrosFiltrados = 0;
let registrosFiltrados = [];

// Instancia global de Bootstrap Modales
let modalEditar = null;
let modalVerDetalle = null;
let modalTrasladar = null;
let modalFotos = null;
let modalQR = null;

// Inicialización de la aplicación
document.addEventListener('DOMContentLoaded', function() {
  try {
    // 1. Obtener la sesión del usuario activo desde el servidor
    google.script.run.withSuccessHandler(function(email) {
      if (email) {
        usuarioActivoEmail = email;
        const nombreGuardado = localStorage.getItem('smr_responsable_nombre');
        const inputNombre = document.getElementById('responsable-nombre');
        if (inputNombre) {
          if (nombreGuardado) {
            inputNombre.value = nombreGuardado;
          } else {
            inputNombre.placeholder = email;
          }
        }
      }
    }).obtenerUsuarioActivo();

    // 2. Inicializar modales de Bootstrap
    modalEditar = new bootstrap.Modal(document.getElementById('modal-editar-articulo'));
    modalVerDetalle = new bootstrap.Modal(document.getElementById('modal-ver-detalle'));
    modalTrasladar = new bootstrap.Modal(document.getElementById('modal-trasladar'));
    modalFotos = new bootstrap.Modal(document.getElementById('modal-fotos'));
    modalQR = new bootstrap.Modal(document.getElementById('modal-qr'));

    // 3. Cargar datos iniciales del servidor de forma asíncrona
    mostrarCarga("Conectando con el servidor...");
    actualizarDatosBaseCompleta(function() {
      ocultarCarga();

      // 4. Procesar consulta inicial por doGet si existe (Módulo 2)
      procesarConsultaInicialDoGet();
    });

    // 5. Configurar lector de archivos QR
    configurarLectorArchivoQR();

  } catch (err) {
    ocultarCarga();
    mostrarAlerta("Error al inicializar la aplicación: " + err.toString(), "danger");
  }
});

/**
 * Muestra el overlay de carga con un mensaje específico.
 * Expuesto globalmente en `window` para evitar colisiones.
 */
window.mostrarCarga = function(mensaje) {
  const overlay = document.getElementById('loading-overlay');
  const text = document.getElementById('loading-text');
  if (overlay) overlay.style.display = 'flex';
  if (text) text.innerText = mensaje || 'Procesando...';
};

/**
 * Oculta el overlay de carga.
 * Expuesto globalmente en `window`.
 */
window.ocultarCarga = function() {
  const overlay = document.getElementById('loading-overlay');
  if (overlay) overlay.style.display = 'none';
};

/**
 * Muestra una alerta (Toast) no bloqueante e institucional.
 * Expuesto globalmente en `window`.
 */
window.mostrarAlerta = function(mensaje, tipo) {
  const container = document.getElementById('toast-container');
  if (!container) return;

  const toastId = 'toast-' + Date.now();
  const bgClass = tipo === 'success' ? 'bg-success text-white' :
                  tipo === 'warning' ? 'bg-warning text-dark' :
                  tipo === 'danger' ? 'bg-danger text-white' : 'bg-dark text-white';

  const html = `
    <div id="${toastId}" class="toast align-items-center ${bgClass} border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="4000">
      <div class="d-flex">
        <div class="toast-body">
          <i class="fa-solid fa-bell me-2" aria-hidden="true"></i>${mensaje}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  `;

  container.insertAdjacentHTML('beforeend', html);
  const element = document.getElementById(toastId);
  const toast = new bootstrap.Toast(element);
  toast.show();

  // Limpiar elemento del DOM después de ocultarse
  element.addEventListener('hidden.bs.toast', function() {
    element.remove();
  });
};

/**
 * Retorna el nombre o correo del operador actual para guardarlo de forma local/remota.
 */
window.obtenerOperadorActual = function() {
  const input = document.getElementById('responsable-nombre');
  if (input && input.value.trim() !== "") {
    return input.value.trim();
  }
  return usuarioActivoEmail || "Anónimo";
};

/**
 * Evento al cambiar manualmente el nombre del operador responsable (Opcional - Instrucción 1).
 */
window.registrarCambioResponsable = function() {
  const val = document.getElementById('responsable-nombre').value.trim();
  if (val) {
    localStorage.setItem('smr_responsable_nombre', val);
    mostrarAlerta("Operador asignado: " + val, "success");
  } else {
    localStorage.removeItem('smr_responsable_nombre');
    mostrarAlerta("Operador por defecto: " + (usuarioActivoEmail || "Anónimo"), "warning");
  }
};

/**
 * Gestiona el enrutamiento y visibilidad de secciones de la SPA (RF1).
 * Expuesto globalmente en `window`.
 */
window.showSection = function(seccionId) {
  try {
    // Apagar la clase activa de las secciones
    const secciones = document.querySelectorAll('.seccion-app');
    secciones.forEach(function(sec) {
      sec.classList.remove('activa');
    });

    // Encender la sección objetivo
    const target = document.getElementById('sec-' + seccionId);
    if (target) {
      target.classList.add('activa');
    }

    // Sincronizar clases activas en la barra de navegación superior
    const links = document.querySelectorAll('.navbar-nav .nav-link');
    links.forEach(function(lnk) {
      lnk.classList.remove('active');
    });

    // Marcar el menú correcto
    links.forEach(function(lnk) {
      if (lnk.getAttribute('onclick') && lnk.getAttribute('onclick').indexOf(seccionId) !== -1) {
        lnk.classList.add('active');
      }
    });

    // Colapsar el navbar de bootstrap en móviles si está desplegado
    const navbarCollapse = document.getElementById('navbarContent');
    if (navbarCollapse && navbarCollapse.classList.contains('show')) {
      const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
      if (bsCollapse) bsCollapse.hide();
    }
  } catch (err) {
    console.error("Error en showSection:", err);
  }
};

/**
 * Recupera toda la base de datos de manera optimizada de una sola vez
 * y almacena localmente las ubicaciones y resguardantes únicos para autocompletar.
 */
function actualizarDatosBaseCompleta(callback) {
  google.script.run
    .withSuccessHandler(function(response) {
      if (response && response.success) {
        dbInventario = response.registros || [];

        // Cargar autocompletados
        google.script.run
          .withSuccessHandler(function(autoData) {
            dbUbicacionesUnicas = autoData.ubicaciones || [];
            dbResguardantesUnicos = autoData.resguardantes || [];

            poblarDatalists();
            cargarEstadisticas();
            aplicarFiltrosTabla(); // Renderiza la tabla por primera vez

            if (callback) callback();
          })
          .withFailureHandler(function(err) {
            console.error("Fallo al obtener campos de autocompletado: ", err);
            if (callback) callback();
          })
          .obtenerCamposAutocompletar();

      } else {
        mostrarAlerta("Error al cargar registros del servidor: " + (response.error || "Fallo desconocido"), "danger");
        if (callback) callback();
      }
    })
    .withFailureHandler(function(err) {
      mostrarAlerta("Error de comunicación: " + err.toString(), "danger");
      if (callback) callback();
    })
    .obtenerInventarioFiltrado(null);
}

/**
 * Puebla los datalists dinámicos en base a los valores existentes en Sheets.
 */
function poblarDatalists() {
  const ubiList = document.getElementById('list-ubicaciones');
  const resList = document.getElementById('list-resguardantes');

  if (ubiList) {
    ubiList.innerHTML = dbUbicacionesUnicas.map(function(u) { return `<option value="${u}">`; }).join('');
  }

  if (resList) {
    resList.innerHTML = dbResguardantesUnicos.map(function(r) { return `<option value="${r}">`; }).join('');
  }

  // También poblar el select de ubicaciones reales en el filtro del listado general
  const filtroUbi = document.getElementById('filtro-ubicacion');
  if (filtroUbi) {
    let html = '<option value="">Todas las Ubicaciones</option>';
    dbUbicacionesUnicas.forEach(function(u) {
      html += `<option value="${u.toLowerCase()}">${u}</option>`;
    });
    filtroUbi.innerHTML = html;
  }
}

/**
 * Calcula y renderiza el resumen de estadísticas del Dashboard (RF1).
 */
function cargarEstadisticas() {
  google.script.run
    .withSuccessHandler(function(stats) {
      document.getElementById('stat-total').innerText = stats.total || 0;
      document.getElementById('stat-levantados').innerText = stats.levantados || 0;
      document.getElementById('stat-pendientes').innerText = stats.pendientes || 0;
    })
    .withFailureHandler(function(err) {
      console.error("Error al cargar estadísticas:", err);
    })
    .obtenerEstadisticas();
}

/**
 * Procesa el parámetro de búsqueda inicial enviado en doGet si existe (Instrucción 3).
 */
function procesarConsultaInicialDoGet() {
  const container = document.getElementById('initial-query-data');
  if (container) {
    const q = container.getAttribute('data-query');
    if (q && q.trim() !== "") {
      showSection('busqueda');
      document.getElementById('buscar-input').value = q.trim();
      buscarBienFisico();
    }
  }
}

/**
 * Configura la decodificación de códigos QR cargados localmente como foto de archivo (Módulo 2).
 */
function configurarLectorArchivoQR() {
  const fileInput = document.getElementById('qr-file-input');
  if (!fileInput) return;

  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const status = document.getElementById('qr-scan-status');
    if (status) status.innerHTML = `<span class="text-primary"><i class="fa-solid fa-spinner fa-spin me-1"></i>Analizando imagen...</span>`;

    const html5QrCode = new Html5Qrcode("initial-query-data"); // Instancia temporal

    html5QrCode.scanFile(file, true)
      .then(function(decodedText) {
        if (status) status.innerHTML = `<span class="text-success fw-bold"><i class="fa-solid fa-check-circle me-1"></i>Código detectado: ${decodedText}</span>`;
        document.getElementById('buscar-input').value = decodedText;
        // Lanzar búsqueda automática
        buscarBienFisico();
      })
      .catch(function(err) {
        if (status) status.innerHTML = `<span class="text-danger"><i class="fa-solid fa-triangle-exclamation me-1"></i>No se encontró ningún QR legible. Intente con otra foto.</span>`;
        console.warn("Fallo de decodificación QR local: ", err);
      });
  });
}

/**
 * Limpia el formulario y estado de búsqueda de artículos.
 * Expuesto globalmente en `window`.
 */
window.limpiarBuscador = function() {
  document.getElementById('buscar-input').value = "";
  document.getElementById('buscar-serie-toggle').checked = false;
  document.getElementById('detalle-vacio').style.display = 'block';
  document.getElementById('detalle-articulo').style.display = 'none';

  const status = document.getElementById('qr-scan-status');
  if (status) status.innerHTML = "";

  const fileInput = document.getElementById('qr-file-input');
  if (fileInput) fileInput.value = "";
};

/**
 * Busca un artículo en el servidor y renderiza su ficha de levantamiento o vista read-only (RF2).
 * Expuesto globalmente en `window`.
 */
window.buscarBienFisico = function() {
  const inputVal = document.getElementById('buscar-input').value.trim();
  const buscarPorSerieToggle = document.getElementById('buscar-serie-toggle').checked;

  if (!inputVal) {
    mostrarAlerta("Por favor, introduzca un criterio de búsqueda.", "warning");
    return;
  }

  mostrarCarga("Buscando artículo...");

  if (buscarPorSerieToggle) {
    // Búsqueda por número de serie
    google.script.run
      .withSuccessHandler(function(matches) {
        ocultarCarga();
        if (matches && matches.length > 0) {
          if (matches.length === 1) {
            cargarFichaArticulo(matches[0]);
          } else {
            // Múltiples coincidencias, obligar a seleccionar desde la tabla
            mostrarAlerta("Se encontraron " + matches.length + " artículos con la misma serie. Se ha filtrado el listado general.", "info");
            showSection('listado');
            document.getElementById('filtro-texto').value = matches[0].serie;
            aplicarFiltrosTabla();
          }
        } else {
          mostrarAlerta("No se encontró ningún bien con número de serie: '" + inputVal + "'", "danger");
        }
      })
      .withFailureHandler(function(err) {
        ocultarCarga();
        mostrarAlerta("Error al buscar por serie: " + err.toString(), "danger");
      })
      .buscarPorSerie(inputVal);
  } else {
    // Búsqueda exacta por No. INV. (Módulo 2)
    google.script.run
      .withSuccessHandler(function(item) {
        ocultarCarga();
        if (item) {
          cargarFichaArticulo(item);
        } else {
          mostrarAlerta("No se encontró ningún bien con No. INV.: '" + inputVal + "'", "danger");
        }
      })
      .withFailureHandler(function(err) {
        ocultarCarga();
        mostrarAlerta("Error al buscar por inventario: " + err.toString(), "danger");
      })
      .buscarPorNoInv(inputVal);
  }
};

/**
 * Puebla la ficha de detalle y levantamiento de un artículo en pantalla (RF2).
 */
function cargarFichaArticulo(item) {
  document.getElementById('detalle-vacio').style.display = 'none';
  document.getElementById('detalle-articulo').style.display = 'block';

  // Asignar cabecera de badge
  document.getElementById('det-no-inv-badge').innerText = "No. INV: " + item.noInv;

  // Rellenar campos patrimoniales históricos (Read-only)
  document.getElementById('det-descripcion').value = item.descripcion || "Sin Descripción";
  document.getElementById('det-serie').value = item.serie || "SIN SERIE";
  document.getElementById('det-marca').value = item.marca || "S/M";
  document.getElementById('det-modelo').value = item.modelo || "S/M";
  document.getElementById('det-importe').value = parseFloat(item.importe).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  document.getElementById('det-resguardado').value = item.resguardado || "Sin resguardante patrimonial";
  document.getElementById('det-ubicacion').value = item.ubicacion || "Sin ubicación patrimonial";

  // Rellenar campos editables de levantamiento real
  document.getElementById('levantamiento-no-inv').value = item.noInv;
  document.getElementById('lev-ubicacion-real').value = item.ubicacionReal || "";
  document.getElementById('lev-resguardante-real').value = item.resguardanteReal || "";
  document.getElementById('lev-estado-real').value = item.estadoReal || "";

  // Limpiar input de fotos
  document.getElementById('lev-fotos').value = "";
  document.getElementById('fotos-preview-container').innerHTML = "";

  // Mostrar fotos existentes si tiene (usar Drive API o link directo)
  const containerExistentes = document.getElementById('fotos-existentes-container');
  const divExistentes = document.getElementById('fotos-existentes');
  divExistentes.innerHTML = "";

  if (item.fotoId && item.fotoId.trim() !== "") {
    containerExistentes.style.display = 'block';
    const listaIds = item.fotoId.split(",");

    listaIds.forEach(function(id) {
      if (!id) return;
      const html = `
        <div class="thumbnail-container" id="thumb-${id}">
          <img src="https://docs.google.com/uc?export=view&id=${id}" class="thumbnail-preview" alt="Evidencia">
          <button type="button" class="btn-delete-thumb" onclick="eliminarFotoServidor('${item.noInv}', '${id}');" title="Eliminar foto">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      `;
      divExistentes.insertAdjacentHTML('beforeend', html);
    });
  } else {
    containerExistentes.style.display = 'none';
  }
}

/**
 * Previsualiza localmente las fotos de levantamiento seleccionadas en el input file.
 * Expuesto globalmente en `window`.
 */
window.previsualizarFotosSeleccionadas = function() {
  const input = document.getElementById('lev-fotos');
  const preview = document.getElementById('fotos-preview-container');
  preview.innerHTML = "";

  if (input.files.length > 3) {
    mostrarAlerta("Solo se permite un máximo de 3 fotografías como evidencia.", "warning");
    input.value = "";
    return;
  }

  Array.from(input.files).forEach(function(file, index) {
    if (file.size > 5 * 1024 * 1024) {
      mostrarAlerta("La imagen " + file.name + " supera el límite de 5MB.", "danger");
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const html = `
        <div class="thumbnail-container">
          <img src="${e.target.result}" class="thumbnail-preview" alt="Previsualización">
          <span class="badge bg-dark position-absolute bottom-0 start-0 m-1">Temp ${index + 1}</span>
        </div>
      `;
      preview.insertAdjacentHTML('beforeend', html);
    };
    reader.readAsDataURL(file);
  });
};

/**
 * Guarda los datos del formulario de levantamiento real en el servidor (RF2).
 * Expuesto globalmente en `window`.
 */
window.guardarFormularioLevantamiento = function() {
  const noInv = document.getElementById('levantamiento-no-inv').value;
  const ubiReal = document.getElementById('lev-ubicacion-real').value.trim();
  const resgReal = document.getElementById('lev-resguardante-real').value.trim();
  const estReal = document.getElementById('lev-estado-real').value;

  if (!ubiReal || !resgReal || !estReal) {
    mostrarAlerta("Todos los campos marcados con (*) son obligatorios.", "warning");
    return;
  }

  mostrarCarga("Guardando levantamiento...");

  const payload = {
    resguardanteReal: resgReal,
    ubicacionReal: ubiReal,
    estadoReal: estReal
  };

  google.script.run
    .withSuccessHandler(function(response) {
      if (response && response.success) {
        // Proceder a subir fotos si se seleccionaron
        const fotosInput = document.getElementById('lev-fotos');
        if (fotosInput && fotosInput.files.length > 0) {
          subirFotosEnCola(noInv, fotosInput.files, 0, function() {
            ocultarCarga();
            mostrarAlerta("Levantamiento y fotos guardadas de manera exitosa.", "success");
            actualizarDatosBaseCompleta(function() {
              // Recargar ficha con datos frescos
              google.script.run.withSuccessHandler(function(item) {
                if (item) cargarFichaArticulo(item);
              }).buscarPorNoInv(noInv);
            });
          });
        } else {
          ocultarCarga();
          mostrarAlerta("Levantamiento guardado de manera exitosa.", "success");
          actualizarDatosBaseCompleta();
        }
      } else {
        ocultarCarga();
        mostrarAlerta("Error al guardar levantamiento: " + (response.message || "Fallo desconocido"), "danger");
      }
    })
    .withFailureHandler(function(err) {
      ocultarCarga();
      mostrarAlerta("Error del servidor: " + err.toString(), "danger");
    })
    .guardarLevantamiento(noInv, payload);
};

/**
 * Sube fotos de manera secuencial para evitar timeouts de red.
 */
function subirFotosEnCola(noInv, files, index, onComplete) {
  if (index >= files.length) {
    if (onComplete) onComplete();
    return;
  }

  mostrarCarga("Subiendo foto de evidencia " + (index + 1) + " de " + files.length + "...");

  const file = files[index];
  const reader = new FileReader();

  reader.onload = function(e) {
    const base64Data = e.target.result;
    google.script.run
      .withSuccessHandler(function(uploadRes) {
        if (uploadRes && uploadRes.success) {
          // Continuar con la siguiente
          subirFotosEnCola(noInv, files, index + 1, onComplete);
        } else {
          mostrarAlerta("La foto " + file.name + " no pudo ser guardada: " + (uploadRes.message || "Error desconocido"), "warning");
          subirFotosEnCola(noInv, files, index + 1, onComplete);
        }
      })
      .withFailureHandler(function(err) {
        mostrarAlerta("Error al subir foto " + file.name + ": " + err.toString(), "danger");
        subirFotosEnCola(noInv, files, index + 1, onComplete);
      })
      .subirFotoArticulo(noInv, base64Data, file.name, index);
  };

  reader.readAsDataURL(file);
}

/**
 * Elimina una foto física de Google Drive y actualiza la fila de la hoja de cálculo.
 * Expuesto globalmente en `window`.
 */
window.eliminarFotoServidor = function(noInv, fotoId) {
  if (!confirm("¿Está seguro que desea eliminar esta fotografía de evidencia de forma permanente?")) {
    return;
  }

  mostrarCarga("Eliminando fotografía...");
  google.script.run
    .withSuccessHandler(function(res) {
      ocultarCarga();
      if (res && res.success) {
        const elem = document.getElementById("thumb-" + fotoId);
        if (elem) elem.remove();
        mostrarAlerta("Fotografía eliminada correctamente.", "success");
        actualizarDatosBaseCompleta();
      } else {
        mostrarAlerta("No se pudo eliminar la fotografía: " + (res.message || "Fallo desconocido"), "danger");
      }
    })
    .withFailureHandler(function(err) {
      ocultarCarga();
      mostrarAlerta("Error al eliminar foto: " + err.toString(), "danger");
    })
    .eliminarFotoArticulo(noInv, fotoId);
};

/**
 * Alta de un nuevo bien físico en el inventario de la SMR (RF3).
 * Expuesto globalmente en `window`.
 */
window.enviarAltaBien = function() {
  const noInv = document.getElementById('alta-no-inv').value.trim();
  const serie = document.getElementById('alta-serie').value.trim();
  const descripcion = document.getElementById('alta-descripcion').value.trim();
  const marca = document.getElementById('alta-marca').value.trim();
  const modelo = document.getElementById('alta-modelo').value.trim();
  const importe = document.getElementById('alta-importe').value.trim();
  const estado = document.getElementById('alta-estado').value.trim();
  const ubicacion = document.getElementById('alta-ubicacion').value.trim();
  const resguardado = document.getElementById('alta-resguardado').value.trim();

  const estadoReal = document.getElementById('alta-estado-real').value;
  const ubicacionReal = document.getElementById('alta-ubicacion-real').value.trim();
  const resguardanteReal = document.getElementById('alta-resguardante-real').value.trim();

  if (!noInv || !serie || !descripcion || !marca || !modelo || !importe || !estadoReal || !ubicacionReal || !resguardanteReal) {
    mostrarAlerta("Todos los campos marcados con (*) son obligatorios.", "warning");
    return;
  }

  mostrarCarga("Dando de alta artículo nuevo...");

  const payload = {
    noInv: noInv,
    serie: serie,
    descripcion: descripcion,
    marca: marca,
    modelo: modelo,
    importe: parseFloat(importe),
    estado: estado,
    ubicacion: ubicacion,
    resguardado: resguardado,
    estadoReal: estadoReal,
    ubicacionReal: ubicacionReal,
    resguardanteReal: resguardanteReal
  };

  google.script.run
    .withSuccessHandler(function(response) {
      if (response && response.success) {
        // Subir fotos adjuntas si existen
        const inputFotos = document.getElementById('alta-fotos');
        if (inputFotos && inputFotos.files.length > 0) {
          subirFotosEnCola(noInv, inputFotos.files, 0, function() {
            ocultarCarga();
            mostrarAlerta("Alta exitosa y fotos adjuntadas.", "success");
            document.getElementById('form-alta-bien').reset();
            document.getElementById('alta-fotos-preview').innerHTML = "";
            actualizarDatosBaseCompleta();
            showSection('listado');
          });
        } else {
          ocultarCarga();
          mostrarAlerta("Bien dado de alta de forma correcta.", "success");

/**
 * Procesa la carga masiva desde archivos de Excel o CSV usando SheetJS en el cliente (RF4).
 * Expuesto globalmente en `window`.
 */
window.procesarArchivoCarga = function() {
  const fileInput = document.getElementById('carga-archivo-input');
  const file = fileInput.files[0];

  if (!file) {
    mostrarAlerta("Por favor, seleccione un archivo válido para iniciar la carga.", "warning");
    return;
  }

  const ext = file.name.split('.').pop().toLowerCase();
  if (ext !== 'xlsx' && ext !== 'csv') {
    mostrarAlerta("Únicamente se soportan formatos .xlsx y .csv de Excel.", "warning");
    return;
  }

  // Obtener opción de duplicados elegida (Omitir o Actualizar)
  let opcionDuplicados = "omitir";
  if (document.getElementById('duplicados-actualizar').checked) {
    opcionDuplicados = "actualizar";
  }

  mostrarCarga("Analizando archivo local...");

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });

      // Tomar primera pestaña
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];

      // Parsear a JSON usando cabeceras en fila 1
      const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
      if (rawRows.length < 2) {
        ocultarCarga();
        mostrarAlerta("El archivo cargado no contiene registros o está vacío.", "danger");
        return;
      }

      const rawHeaders = rawRows[0];
      const rows = [];

      // Mapeo Inteligente de Cabeceras (Módulo 2)
      // Diccionario de equivalencias tolerantes
      const mapeoDiccionario = {
        "no.": ["no.", "no", "numero", "número", "id"],
        "No. INV.": ["no. inv.", "no. inventario", "numero inventario", "etiqueta", "no inv", "inventario"],
        "DESCRIPCION": ["descripcion", "descripción", "articulo", "descripcion", "desc"],
        "SERIE": ["serie", "no. serie", "serie", "numero de serie", "ser"],
        "MODELO": ["modelo", "modelo"],
        "MARCA": ["marca", "marca"],
        "ESTADO": ["estado", "estado patrimonio"],
        "IMPORTE": ["importe", "valor", "costo"],
        "UBICACION": ["ubicacion", "ubicación"],
        "RESGUARDADO": ["resguardado", "resguardo"],
        "RESGUARDANTE_REAL": ["resguardante real", "resguardante_real", "resguardante"],
        "UBICACION_REAL": ["ubicación real", "ubicacion_real", "ubicacion real"],
        "ESTADO_REAL": ["estado real", "estado_real", "estado real"]
      };

      // Encontrar los índices de cada columna de manera inteligente e insensible a acentos/casing
      const mapIndices = {};
      Object.keys(mapeoDiccionario).forEach(function(colObjetivo) {
        const sinonimos = mapeoDiccionario[colObjetivo];
        let indexEncontrado = -1;

        for (let i = 0; i < rawHeaders.length; i++) {
          const headerActualNorm = String(rawHeaders[i] || "").toLowerCase()
                                      .normalize("NFD")
                                      .replace(/[\u0300-\u036f]/g, "")
                                      .trim();

          for (let s = 0; s < sinonimos.length; s++) {
            const sinonimoNorm = sinonimos[s].toLowerCase()
                                    .normalize("NFD")
                                    .replace(/[\u0300-\u036f]/g, "")
                                    .trim();
            if (headerActualNorm === sinonimoNorm) {
              indexEncontrado = i;
              break;
            }
          }
          if (indexEncontrado !== -1) break;
        }

        mapIndices[colObjetivo] = indexEncontrado;
      });

      // Procesar filas de datos
      for (let r = 1; r < rawRows.length; r++) {
        const row = rawRows[r];
        if (row.length === 0) continue;

        const objMapeado = {};
        let tieneDatos = false;

        Object.keys(mapIndices).forEach(function(colKey) {
          const idx = mapIndices[colKey];
          let val = idx !== -1 ? row[idx] : "";
          if (val === undefined || val === null) val = "";

          objMapeado[colKey] = String(val).trim();
          if (objMapeado[colKey] !== "") {
            tieneDatos = true;
          }
        });

        if (tieneDatos) {
          rows.push(objMapeado);
        }
      }

      if (rows.length === 0) {
        ocultarCarga();
        mostrarAlerta("No se encontraron registros válidos tras mapear las cabeceras.", "danger");
        return;
      }

      mostrarCarga("Procesando y subiendo " + rows.length + " registros al servidor...");

      // Enviar lote de datos mapeados al servidor (Módulo 1 - Batch insert)
      google.script.run
        .withSuccessHandler(function(resultado) {
          ocultarCarga();
          if (resultado && resultado.success) {
            document.getElementById('resultado-carga').style.display = 'block';
            document.getElementById('res-nuevos').innerText = resultado.nuevos || 0;
            document.getElementById('res-actualizados').innerText = resultado.actualizados || 0;
            document.getElementById('res-omitidos').innerText = resultado.omitidos || 0;
            document.getElementById('res-errores').innerText = resultado.errores || 0;

            mostrarAlerta("Carga masiva procesada correctamente.", "success");
            fileInput.value = "";
            actualizarDatosBaseCompleta();
          } else {
            mostrarAlerta("La importación falló: " + (resultado.message || "Fallo desconocido"), "danger");
          }
        })
        .withFailureHandler(function(err) {
          ocultarCarga();
          mostrarAlerta("Error al subir lote al servidor: " + err.toString(), "danger");
        })
        .importarDatosExcel(rows, opcionDuplicados);

    } catch (parseErr) {
      ocultarCarga();
      mostrarAlerta("Error al interpretar archivo de Excel: " + parseErr.toString(), "danger");
    }
  };

  reader.readAsArrayBuffer(file);
};

/**
 * Aplica los filtros seleccionados localmente en pantalla y renderiza la tabla con paginación (RF5).
 * Expuesto globalmente en `window`.
 */
window.aplicarFiltrosTabla = function() {
  const texto = document.getElementById('filtro-texto').value.trim().toLowerCase();
  const estado = document.getElementById('filtro-estado').value;
  const ubicacion = document.getElementById('filtro-ubicacion').value;

  // Realizar el filtrado de forma reactiva local
  registrosFiltrados = dbInventario.filter(function(item) {
    let coincide = true;

    // Filtro por Texto Global (en No. INV, descripción y resguardante)
    if (texto) {
      const bDesc = String(item.descripcion || "").toLowerCase();
      const bInv = String(item.noInv || "").toLowerCase();
      const bResg = String(item.resguardanteReal || item.resguardado || "").toLowerCase();
      const bSerie = String(item.serie || "").toLowerCase();

      if (bDesc.indexOf(texto) === -1 && bInv.indexOf(texto) === -1 && bResg.indexOf(texto) === -1 && bSerie.indexOf(texto) === -1) {
        coincide = false;
      }
    }

    // Filtro por Estado Real
    if (estado) {
      if (estado === "pendiente") {
        if (String(item.estadoReal || "").trim() !== "") coincide = false;
      } else {
        if (String(item.estadoReal || "").trim().toLowerCase() !== estado.toLowerCase()) coincide = false;
      }
    }

    // Filtro por Ubicación Real
    if (ubicacion) {
      const uActual = String(item.ubicacionReal || item.ubicacion || "").trim().toLowerCase();
      if (uActual !== ubicacion.toLowerCase()) coincide = false;
    }

    return coincide;
  });

  totalRegistrosFiltrados = registrosFiltrados.length;
  paginaActual = 1; // Resetear a página 1 tras cambiar filtros

  renderizarPaginador();
  renderizarListadoTabla();
};

/**
 * Renderiza la paginación del listado general.
 */
function renderizarPaginador() {
  const paginadorUl = document.getElementById('paginador-ul');
  if (!paginadorUl) return;

  const totalPaginas = Math.ceil(totalRegistrosFiltrados / REGISTROS_POR_PAGINA);
  paginadorUl.innerHTML = "";

  if (totalPaginas <= 1) {
    return; // No es necesario pintar paginación
  }

  // Botón Anterior
  let html = `
    <li class="page-item ${paginaActual === 1 ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="cambiarPagina(${paginaActual - 1}); return false;" aria-label="Anterior">
        <span aria-hidden="true">&laquo;</span>
      </a>
    </li>
  `;

  // Pintar números de páginas (simplificado para móviles)
  const rango = 2; // Páginas a mostrar a cada lado de la actual
  for (let i = 1; i <= totalPaginas; i++) {
    if (i === 1 || i === totalPaginas || (i >= paginaActual - rango && i <= paginaActual + rango)) {
      html += `
        <li class="page-item ${paginaActual === i ? 'active' : ''}">
          <a class="page-link" href="#" onclick="cambiarPagina(${i}); return false;">${i}</a>
        </li>
      `;
    } else if (i === paginaActual - rango - 1 || i === paginaActual + rango + 1) {
      html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
    }
  }

  // Botón Siguiente
  html += `
    <li class="page-item ${paginaActual === totalPaginas ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="cambiarPagina(${paginaActual + 1}); return false;" aria-label="Siguiente">
        <span aria-hidden="true">&raquo;</span>
      </a>
    </li>
  `;

  paginadorUl.innerHTML = html;
}

/**
 * Cambia la página actual del listado general.
 * Expuesto globalmente en `window`.
 */
window.cambiarPagina = function(numPagina) {
  const totalPaginas = Math.ceil(totalRegistrosFiltrados / REGISTROS_POR_PAGINA);
  if (numPagina < 1 || numPagina > totalPaginas) return;

  paginaActual = numPagina;
  renderizarPaginador();
  renderizarListadoTabla();
};

/**
 * Renderiza la tabla física de inventario para la página actual (RF5).
 */
function renderizarListadoTabla() {
  const body = document.getElementById('tabla-bienes-body');
  const info = document.getElementById('tabla-info-registro');
  if (!body) return;

  if (totalRegistrosFiltrados === 0) {
    body.innerHTML = `
      <tr>
        <td colspan="10" class="text-center text-secondary py-5">
          <i class="fa-solid fa-triangle-exclamation fs-3 mb-2" aria-hidden="true"></i>
          <p class="mb-0 fw-bold">No se encontraron artículos con los criterios seleccionados.</p>
        </td>
      </tr>
    `;
    if (info) info.innerText = "Mostrando 0 registros de 0";
    return;
  }

  const start = (paginaActual - 1) * REGISTROS_POR_PAGINA;
  const end = Math.min(start + REGISTROS_POR_PAGINA, totalRegistrosFiltrados);
  const itemsPagina = registrosFiltrados.slice(start, end);

  if (info) {
    info.innerText = "Mostrando registros " + (start + 1) + " - " + end + " de " + totalRegistrosFiltrados;
  }

  let html = "";
  itemsPagina.forEach(function(item) {
    // Definir color del badge de estado real (RF5)
    const est = item.estadoReal || "";
    let badgeClass = "bg-secondary";
    if (est.toLowerCase() === "bueno") badgeClass = "badge-bueno";
    else if (est.toLowerCase() === "regular") badgeClass = "badge-regular";
    else if (est.toLowerCase() === "malo") badgeClass = "badge-malo";
    else if (est.toLowerCase() === "baja") badgeClass = "badge-baja";

    const estadoDisplay = est || '<span class="text-secondary small fw-normal">Pendiente</span>';

    // Obtener nombre del operador sin la fecha
    let usrDisplay = "Sin registrar";
    if (item.usuarioOperador) {
      usrDisplay = item.usuarioOperador.split(" - ")[0];
    }

    html += `
      <tr>
        <td class="fw-bold text-secondary">${item.no}</td>
        <td class="fw-bold text-success">${item.noInv}</td>
        <td class="text-truncate" style="max-width: 250px;" title="${item.descripcion}">${item.descripcion}</td>
        <td>${item.serie || "SIN SERIE"}</td>
        <td>${item.marca || "S/M"}</td>
        <td>${item.ubicacionReal || '<span class="text-secondary small">Pendiente</span>'}</td>
        <td><span class="badge ${badgeClass} py-1 px-2">${estadoDisplay}</span></td>
        <td>${usrDisplay}</td>
        <td>${item.resguardanteReal || '<span class="text-secondary small">Pendiente</span>'}</td>
        <td class="text-center">
          <div class="btn-group btn-group-sm" role="group" aria-label="Acciones del Bien">
            <button type="button" class="btn btn-outline-success" onclick="abrirModalLevantamientoFila('${item.noInv}');" title="Ver Detalle / Registrar">
              <i class="fa-solid fa-clipboard-check"></i>
            </button>
            <button type="button" class="btn btn-outline-dark" onclick="abrirModalEdicionCompleta('${item.noInv}');" title="Edición Completa">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button type="button" class="btn btn-outline-warning text-dark" onclick="abrirModalTraslado('${item.noInv}');" title="Trasladar / Mover">
              <i class="fa-solid fa-truck-ramp-box"></i>
            </button>
            <button type="button" class="btn btn-outline-info" onclick="abrirModalFotos('${item.noInv}');" title="Gestionar Fotos">
              <i class="fa-solid fa-camera"></i>
            </button>
            <button type="button" class="btn btn-outline-dark" onclick="abrirModalQR('${item.noInv}');" title="Exportar QR">
              <i class="fa-solid fa-qrcode"></i>
            </button>
          </div>
        </td>
      </tr>
    `;
  });

  body.innerHTML = html;
}

window.eliminarFotoModal = function(noInv, fotoId) {
  if (!confirm("¿Está seguro de eliminar esta fotografía de Google Drive?")) return;

  mostrarCarga("Eliminando...");
  google.script.run
    .withSuccessHandler(function(res) {
      ocultarCarga();
      if (res && res.success) {
        mostrarAlerta("Foto eliminada.", "success");
        actualizarDatosBaseCompleta(function() {
          const refreshedItem = dbInventario.find(function(x) { return x.noInv === noInv; });
          if (refreshedItem) {
            poblarGaleriaFotosModal(refreshedItem);
          }
        });
      } else {
        mostrarAlerta("Error: " + res.message, "danger");
      }
    })
    .withFailureHandler(function(err) {
      ocultarCarga();
      mostrarAlerta("Error al eliminar: " + err.toString(), "danger");
    })
    .eliminarFotoArticulo(noInv, fotoId);
};

/**
 * Abre el modal para ver y descargar el código QR del bien (RF5).
 * Expuesto globalmente en `window`.
 */
window.abrirModalQR = function(noInv) {
  document.getElementById('qr-info-no-inv').innerText = "No. INV: " + noInv;

  // Usamos Google Charts API para generar un código QR codificando ÚNICAMENTE el No. INV.
  const chartUrl = `https://chart.googleapis.com/chart?cht=qr&chs=300x300&chl=${encodeURIComponent(noInv)}`;
  document.getElementById('qr-image').src = chartUrl;

  modalQR.show();
};

/**
 * Exporta la bitácora o historial de la sesión activa en un archivo JSON para el operador.
 * Expuesto globalmente en `window` (Módulo de auditoría/Bitácora - RF6).
 */
window.exportarBitacoraSesion = function() {
  try {
    const activeOperator = window.obtenerOperadorActual();
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
      operador: activeOperator,
      fechaExportacion: new Date().toISOString(),
      inventarioLocalCount: dbInventario.length
    }, null, 2));

    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `bitacora_sesion_${activeOperator.replace(/\s+/g, '_')}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();

    mostrarAlerta("Historial de la sesión exportado correctamente.", "success");
  } catch (err) {
    mostrarAlerta("Error al exportar la bitácora de sesión: " + err.toString(), "danger");
  }
};
