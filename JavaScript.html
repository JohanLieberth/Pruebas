// Historial de búsquedas de escáner
function agregarAlHistorialOCR(numero, datos) {
  const entrada = {
    numero: numero,
    fecha: new Date().toLocaleString(),
    encontrado: !!datos,
    descripcion: datos ? datos.descripcion : 'No registrado'
  };

  historialBusquedas.unshift(entrada);
  if (historialBusquedas.length > 8) {
    historialBusquedas.pop();
  }

  actualizarHistorialUI_OCR();
  guardarHistorialOCR();
}

function actualizarHistorialUI_OCR() {
  const container = document.getElementById('historialLista');
  if (!container) return;

  if (historialBusquedas.length === 0) {
    container.innerHTML = '<p class="info-message text-muted mb-0">No hay búsquedas recientes</p>';
    return;
  }

  let html = '<ul class="list-group list-group-flush p-0 m-0">';
  historialBusquedas.forEach(item => {
    const icono = item.encontrado ? '✅' : '❌';
    html += `
      <li class="list-group-item d-flex align-items-center justify-content-between p-2">
        <div class="d-flex align-items-center gap-2 overflow-hidden">
          <span class="small">${icono}</span>
          <strong class="text-primary small" style="cursor: pointer;" onclick="procesarCodigoEtiqueta('${item.numero}')">${item.numero}</strong>
          <span class="text-muted text-truncate small ms-1" style="max-width: 150px;">${item.descripcion}</span>
        </div>
        <span class="text-secondary small text-nowrap" style="font-size: 10px;">${item.fecha.split(',')[1] || item.fecha}</span>
      </li>
    `;
  });
  html += '</ul>';
  container.innerHTML = html;
}

function guardarHistorialOCR() {
  try {
    localStorage.setItem('historialInventario', JSON.stringify(historialBusquedas));
  } catch (e) {
    console.warn(e);
  }
}

function cargarHistorialOCR() {
  try {
    const saved = localStorage.getItem('historialInventario');
    if (saved) {
      historialBusquedas = JSON.parse(saved);
      actualizarHistorialUI_OCR();
    }
  } catch (e) {
    console.warn(e);

}

function validarYPrevisualizarFotoAlta() {
  const fileInput = document.getElementById("alta-foto-input");
  const previewDiv = document.getElementById("alta-foto-preview-container");
  const previewImg = document.getElementById("alta-foto-preview-img");
  const previewInfo = document.getElementById("alta-foto-preview-info");

  altaFotoBase64 = ""; altaFotoExt = ""; altaFotoNombre = "";
  previewDiv.classList.add("d-none");
  if (fileInput.files.length === 0) return;
  const file = fileInput.files[0];
  const sizeMB = file.size / (1024 * 1024);
  const ext = file.name.split(".").pop().toLowerCase();

  if (["png", "jpg", "jpeg", "gif", "webp"].indexOf(ext) === -1) {
    alert("Formato no permitido. Solo se aceptan imágenes JPG, PNG, GIF o WEBP.");
    fileInput.value = ""; return;

  if (sizeMB > 5) {
    alert("El archivo excede los 5MB máximos permitidos.");

  }
  const reader = new FileReader();
  reader.onload = function(e) {
    altaFotoBase64 = e.target.result; altaFotoExt = ext; altaFotoNombre = file.name;
    previewImg.src = e.target.result;
    previewInfo.textContent = `${file.name} (${sizeMB.toFixed(2)} MB)`;
    previewDiv.classList.remove("d-none");
  };
  reader.readAsDataURL(file);
}

// Interceptor defensivo global contra fallas no controladas en promesas de extensiones de navegador (content.js)
// Previene de raíz que errores como "Cannot read properties of null (reading 'classList')" rompan el hilo principal.
window.addEventListener('unhandledrejection', function(event) {
  try {
    const errorMsg = event.reason ? String(event.reason.message || event.reason) : "";
    const errorStack = event.reason && event.reason.stack ? String(event.reason.stack) : "";

    if (errorStack.includes("content.js") || errorMsg.includes("classList") || errorStack.includes("extension")) {
      event.preventDefault(); // Detener propagación
      console.warn("SMR Inventario - Capturado de forma segura un error no controlado de extensión (content.js):", errorMsg);
    }
  } catch (err) {
    console.error("Error en interceptor de promesas:", err);
  }
});
