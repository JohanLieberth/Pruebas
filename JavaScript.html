<script>
/**
 * SISTEMA DE INVENTARIO FÍSICO - SUBDIRECCIÓN DE MEJORA REGULATORIA
 * Frontend: JavaScript.html
 *
 * Lógica cliente del SPA de inventario físico.
 * Implementa de raíz las correcciones y módulos adicionales requeridos:
 * - Módulo de Escáner QR por Imagen/Archivo (Módulo 1).
 * - Bitácora de Actividad en la Interfaz (Módulo 2).
 * - Registro del Nombre del Responsable al Inicio (Módulo 3).
 * - Estado de Carga con Try-Catch global ante White Pages (Módulo 6).
 */

// --- VARIABLES GLOBALES DE ESTADO DEL CLIENTE ---
window.cacheInventario = [];     // Almacén local de artículos cargados
window.cacheUbicaciones = [];   // Para autocompletar
window.cacheResguardantes = [];  // Para autocompletar
window.usuarioActivo = "";       // Email del usuario logueado o Responsable
window.bitacoraSesion = [];      // Registro histórico de la sesión actual (Módulo 2)

// Variables de Paginación
window.paginaActual = 1;
const REGISTROS_POR_PAGINA = 20;

// Bloqueo de Navegación doble clic
window.isNavigating = false;

// Evitar bloqueos por extensiones de navegador de terceros
const c = function(element) {
  return element && typeof element === 'object' && 'classList' in element ? element : null;
};

const manejarElemento = function(elemento) {
  if (!elemento) return;
  try {
    elemento.classList.add('smr-valid');
  } catch(e) {}
};

// Capturador de promesas rechazadas global para silenciar extensiones ruidosas
window.addEventListener('unhandledrejection', function(event) {
  if (event.reason && event.reason.stack && event.reason.stack.indexOf('content.js') !== -1) {
    event.preventDefault(); // Evitar ruido en consola
  }
});

// --- MÓDULO 6: INICIALIZACIÓN Y ESTADO DE CARGA (Módulo 6) ---

/**
 * Inicialización completa del cliente al cargar.
 * Envuelto en try/catch global para evitar estado en blanco ante fallos de la plataforma (Módulo 6).
 */
document.addEventListener("DOMContentLoaded", function() {
  try {
    // Verificar si el responsable ya se encuentra registrado en esta sesión (Módulo 3)
    const nombreGuardado = sessionStorage.getItem("smr_responsable_nombre");

    if (nombreGuardado && nombreGuardado.trim().length > 0) {
      // El usuario ya se había logueado, desbloquear interfaz directamente
      document.getElementById("modal-bienvenida").style.display = "none";
      window.usuarioActivo = nombreGuardado;
      const userEl = document.getElementById("navbar-user");
      if (userEl) {
        userEl.innerHTML = `<i class="fa-solid fa-user-tie me-1"></i> Responsable: ${window.usuarioActivo}`;
      }
      inicializarApp();
    } else {
      // Bloquear pantalla y esperar que el usuario ingrese su identidad en el modal
      document.getElementById("modal-bienvenida").style.display = "flex";
      console.log("[SMR] Bloqueando pantalla. Esperando identidad del Responsable.");
    }
  } catch (error) {
    console.error("[SMR] Error crítico de inicialización:", error);
    document.body.innerHTML = `
      <div style="padding: 40px; text-align: center; font-family: sans-serif; background-color: #f0f4f8; color: #c0392b; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <div style="background: white; padding: 30px; border-radius: 12px; border: 4px solid #4a90a4; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);">
          <h3 style="font-weight: bold; margin-bottom: 15px; color: #1e3a5f;"><i class="fa-solid fa-triangle-exclamation"></i> Error al cargar la aplicación</h3>
          <p style="margin-bottom: 20px; color: #2c3e50;">Se produjo un error crítico de ejecución en su navegador durante el arranque inicial:</p>
          <pre style="background: #f0f4f8; padding: 15px; border: 1px solid #d5dbdb; text-align: left; overflow-x: auto; font-family: monospace; font-size: 0.85rem; color: #c0392b;">${error.stack || error.toString()}</pre>
          <p style="margin-top: 20px; font-size: 0.9rem; color: #5d6d7e;">Por favor, recargue la página o intente utilizar otro navegador compatible.</p>
        </div>
      </div>
    `;
  }
});

/**
 * Guarda la identidad del responsable al inicio del levantamiento y desbloquea el sistema (Módulo 3).
 * El modal tiene exactamente UN solo campo: nombre.
 */
window.confirmarResponsable = function(event) {
  if (event) event.preventDefault();

  const nombre = document.getElementById("responsable-nombre").value.trim();

  if (!nombre) {
    alert("Por favor ingrese su Nombre Completo para continuar.");
    return;
  }

  // Guardar en sessionStorage para persistencia de pestaña activa (Módulo 3)
  sessionStorage.setItem("smr_responsable_nombre", nombre);

  // Desbloquear modal de bienvenida
  document.getElementById("modal-bienvenida").style.display = "none";
  window.usuarioActivo = nombre;

  const userEl = document.getElementById("navbar-user");
  if (userEl) {
    userEl.innerHTML = `<i class="fa-solid fa-user-tie me-1"></i> Responsable: ${window.usuarioActivo}`;
  }

  // Inicializar aplicación
  inicializarApp();

  // Registrar inicio en la bitácora
  registrarEnBitacora("SISTEMA", "Responsable '" + nombre + "' ingresó al sistema.");
};

/**
 * Función central de inicialización (Módulo 6).
 */
function inicializarApp() {
  mostrarCarga("Cargando base de datos inicial...");

  // Timeout defensivo para evitar cuelgues estáticos si GAS tiene alta latencia (6 segundos)
  const safeTimeout = setTimeout(function() {
    ocultarCarga();
    mostrarNotificacion("La conexión con el servidor demoró más de lo esperado. Algunas funciones podrían inicializar de forma asíncrona.", "bg-warning");
  }, 6000);

  // Cargar datos base del servidor
  cargarEstadisticasInicio();
  cargarListadoInventario(function() {
    clearTimeout(safeTimeout);
    ocultarCarga();

    // Verificar si hay búsqueda inicial solicitada por URL (?noinv=XXXX)
    if (window.initialNoInvQuery && window.initialNoInvQuery.trim() !== "") {
      window.showSection('busqueda');
      const input = document.getElementById("buscar-input");
      if (input) {
        input.value = window.initialNoInvQuery;
      }
      ejecutarBusquedaAutomatica(window.initialNoInvQuery);
    } else {
      window.showSection('inicio');
    }
  });
}

/**
 * Muestra el spinner de carga con un mensaje específico (Módulo 6).
 */
window.mostrarCarga = function(mensaje) {
  const msgEl = document.getElementById("loader-message");
  if (msgEl) {
    msgEl.innerText = mensaje || "Procesando operación...";
  }
  const loader = document.getElementById("global-loader");
  if (loader) {
    loader.style.display = "flex";
  }
};

/**
 * Oculta el spinner de carga (Módulo 6).
 */
window.ocultarCarga = function() {
  const loader = document.getElementById("global-loader");
  if (loader) {
    loader.style.display = "none";
  }
};

/**
 * Toast de notificaciones ligera e instantánea.
 */
function mostrarNotificacion(mensaje, claseColor) {
  const toastEl = document.getElementById('liveToast');
  const toastBody = document.getElementById('toast-body-text');
  if (!toastEl || !toastBody) return;

  toastEl.className = "toast align-items-center text-white border-0 " + (claseColor || "bg-success");
  toastBody.innerText = mensaje;

  const toast = new bootstrap.Toast(toastEl);
  toast.show();
}

/**
 * Enrutador SPA dinámico y seguro de secciones.
 */
window.showSection = function(sectionId) {
  if (window.isNavigating) return;
  window.isNavigating = true;

  // Detener escaneo si se sale de la sección de búsqueda (Módulo 5)
  if (sectionId !== 'busqueda') {
    window.limpiarVistaQR();
  }

  // Ocultar todas las secciones
  document.querySelectorAll('.app-section').forEach(function(sec) {
    sec.style.display = 'none';
  });

  // Desmarcar todos los navlinks
  document.querySelectorAll('.navbar-nav .nav-link').forEach(function(link) {
    link.classList.remove('active');
  });

  // Mostrar sección activa
  const targetSec = document.getElementById('section-' + sectionId);
  if (targetSec) {
    targetSec.style.display = 'block';
  }

  // Activar navlink correspondiente
  const targetLink = document.getElementById('nav-' + sectionId);
  if (targetLink) {
    targetLink.classList.add('active');
  }

  // Cerrar colapso de menú bootstrap en móviles defensivamente
  const navbarCollapse = document.getElementById('navbarContent');
  if (navbarCollapse && navbarCollapse.classList.contains('show')) {
    try {
      const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
      if (bsCollapse) bsCollapse.hide();
    } catch(err) {
      navbarCollapse.classList.remove('show');
    }
  }

  // Registrar cambio de sección en bitácora (Módulo 2)
  registrarEnBitacora("VISTA", "Cargada sección: " + sectionId.toUpperCase());

  // Scroll hacia arriba
  window.scrollTo({ top: 0, behavior: 'smooth' });

  // Desbloquear navegación
  setTimeout(function() {
    window.isNavigating = false;
  }, 250);
};

// --- MÓDULO 2: BITÁCORA DE ACTIVIDAD DE SESIÓN EN INTERFAZ (Módulo 2) ---

/**
 * Registra un evento en tiempo real en la bitácora de sesión del cliente (Módulo 2).
 * Formato: [HH:MM:SS] [TIPO] Descripción (con Nombre del Responsable).
 * Mantiene un máximo de 50 registros en memoria y renderiza en modo prepend.
 */
window.registrarEnBitacora = function(tipo, mensaje) {
  const d = new Date();
  const pad = function(n) { return n < 10 ? '0' + n : n; };
  const horaStr = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());

  // Formato: [HH:MM:SS] [TIPO] Responsable: Nombre - Descripción.
  const responsable = window.usuarioActivo || "Desconocido";
  const formatoEntrada = `[${horaStr}] [${tipo.toUpperCase()}] Responsable: ${responsable} - ${mensaje}`;

  // Agregar al inicio del array en memoria
  window.bitacoraSesion.unshift(formatoEntrada);

  // Mantener un máximo de 50 entradas
  if (window.bitacoraSesion.length > 50) {
    window.bitacoraSesion = window.bitacoraSesion.slice(0, 50);
  }

  // Renderizar en el panel de bitácora
  const container = document.getElementById("bitacora-list-container");
  if (!container) return;

  let html = "";
  window.bitacoraSesion.forEach(function(entrada) {
    // Obtener tipo específico para badge de color
    const matchTipo = entrada.match(/\[([A-ZÁÉÍÓÚ]+)\]/g);
    let badgeHtml = "";
    if (matchTipo && matchTipo.length > 1) {
      const limpioTipo = matchTipo[1].replace(/[\[\]]/g, "");
      badgeHtml = `<span class="bitacora-tag tag-${limpioTipo.toLowerCase()}">${limpioTipo}</span>`;
    }

    // Obtener texto limpio sin las marcas de tipo
    const textoMostrar = entrada.replace(/\[[A-ZÁÉÍÓÚ]+\]/g, "").replace("  ", " ");

    html += `
      <div class="bitacora-item">
        ${badgeHtml} <span class="text-secondary small">${textoMostrar}</span>
      </div>
    `;
  });

  container.innerHTML = html;
};

/**
 * Limpia el panel de bitácora de la interfaz del usuario (Módulo 2).
 */
window.limpiarBitacoraSesion = function() {
  if (confirm("¿Está seguro de que desea limpiar el historial de bitácora de la sesión actual?")) {
    window.bitacoraSesion = [];
    const container = document.getElementById("bitacora-list-container");
    if (container) {
      container.innerHTML = `<div class="text-muted text-center py-2">Bitácora limpia. Esperando eventos...</div>`;
    }
    mostrarNotificacion("Bitácora de sesión limpiada.", "bg-secondary");
  }
};

/**
 * Descarga un archivo .txt con el contenido de la bitácora de sesión (Módulo 2).
 */
window.exportarBitacoraSesion = function() {
  if (window.bitacoraSesion.length === 0) {
    alert("No hay registros en la bitácora para exportar.");
    return;
  }

  const contenido = window.bitacoraSesion.join("\r\n");
  const blob = new Blob([contenido], { type: "text/plain;charset=utf-8" });

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `SMR_Bitacora_Sesion_${new Date().toISOString().slice(0,10)}.txt`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  mostrarNotificacion("Bitácora exportada correctamente.", "bg-success");
};


// --- CARGA DE DATOS DESDE EL SERVIDOR ---

function cargarEstadisticasInicio() {
  google.script.run
    .withSuccessHandler(function(stats) {
      const t = document.getElementById("stats-total");
      const l = document.getElementById("stats-levantados");
      const p = document.getElementById("stats-pendientes");
      if (t) t.innerText = stats.total;
      if (l) l.innerText = stats.levantados;
      if (p) p.innerText = stats.pendientes;
    })
    .withFailureHandler(function(err) {
      console.error("Error al cargar estadísticas:", err);
    })
    .obtenerEstadisticas();
}

/**
 * Recupera el inventario filtrado desde el servidor de Google Sheets (Módulo 3).
 * Soporta timeouts clientes y oculta el spinner de carga ante cualquier resultado.
 */
function cargarListadoInventario(callback) {
  const elGlobal = document.getElementById("filtro-global-listado");
  const elUbi = document.getElementById("filtro-ubicacion-sel");
  const elEst = document.getElementById("filtro-estado-sel");

  const filtros = {
    texto: elGlobal ? elGlobal.value.trim() : "",
    ubicacion: elUbi ? elUbi.value : "",
    estado: elEst ? elEst.value : ""
  };

  console.log("[SMR] Solicitando listado filtrado al servidor:", filtros);
  mostrarCarga("Buscando artículo...");

  // Registrar aplicación de filtros en bitácora (Módulo 2)
  const descFiltros = `Filtros Aplicados: Texto="${filtros.texto}", Ubicación="${filtros.ubicacion}", Estado="${filtros.estado}"`;
  registrarEnBitacora("FILTRO", descFiltros);

  // Configurar un timeout de 15 segundos en el cliente para evitar bloqueos del loader (Módulo 3)
  let respondido = false;
  const timeoutId = setTimeout(function() {
    if (!respondido) {
      ocultarCarga();
      alert("El servidor está tardando demasiado en responder. Intente de nuevo o reduzca los filtros.");
      mostrarNotificacion("Tiempo de espera agotado.", "bg-danger");
      registrarEnBitacora("ERROR", "Tiempo de espera de 15s agotado al obtener inventario.");
    }
  }, 15000);

  google.script.run
    .withSuccessHandler(function(res) {
      respondido = true;
      clearTimeout(timeoutId);
      ocultarCarga(); // Ocultar "Buscando artículo..." (Módulo 3)

      console.log("[SMR] Respuesta de filtrado servidor recibida:", res);

      if (!res || res.success === false) {
        var errMsg = res && res.error ? res.error : "Error desconocido al procesar filtros.";
        console.error("[SMR] Error devuelto por servidor:", errMsg);
        alert(errMsg);
        registrarEnBitacora("ERROR", "Error de servidor al cargar: " + errMsg);
        return;
      }

      window.cacheInventario = res.registros || [];

      // Actualizar selectores de autocompletar si es la carga inicial
      if (elUbi && elUbi.options.length <= 1) {
        actualizarCacheAutocompletar();
      }

      // Renderizar listado de la tabla general
      aplicarFiltrosYListar(true);

      // Registrar éxito en bitácora (Módulo 2)
      registrarEnBitacora("SISTEMA", "Listado cargado con éxito. Encontrados: " + window.cacheInventario.length + " artículos.");

      if (callback) callback();
    })
    .withFailureHandler(function(err) {
      respondido = true;
      clearTimeout(timeoutId);
      ocultarCarga(); // Ocultar "Buscando artículo..." (Módulo 3)
      console.error("[SMR] Error en llamada google.script.run a listar:", err);
      mostrarNotificacion("Fallo de red al conectar con Google Sheets: " + err.message, "bg-danger");
      alert("Fallo de red: No se pudo conectar con el servidor de Google Sheets.");
      registrarEnBitacora("ERROR", "Fallo de red crítico: " + err.message);
      if (callback) callback();
    })
    .obtenerInventarioFiltrado(filtros);
}

function actualizarCacheAutocompletar() {
  google.script.run
    .withSuccessHandler(function(data) {
      window.cacheUbicaciones = data.ubicaciones || [];
      window.cacheResguardantes = data.resguardantes || [];

      // Rellenar selectores de filtros del listado general
      llenarSelectFiltro("filtro-ubicacion-sel", window.cacheUbicaciones);
      llenarSelectFiltro("filtro-marca-sel", obtenerMarcasUnicas(window.cacheInventario));

      // Inicializar autocompletar en los inputs reales
      setupAutocomplete("real-ubicacion", window.cacheUbicaciones, "real-ubicacion-suggestions");
      setupAutocomplete("real-resguardante", window.cacheResguardantes, "real-resguardante-suggestions");
    })
    .withFailureHandler(function(err) {
      console.error("Error cargando autocompletar:", err);
    })
    .obtenerCamposAutocompletar();
}

function obtenerMarcasUnicas(articulos) {
  const marcas = {};
  articulos.forEach(function(item) {
    const m = String(item.marca || "").trim();
    if (m) marcas[m] = true;
  });
  return Object.keys(marcas).sort();
}

function llenarSelectFiltro(elementId, listado) {
  const select = document.getElementById(elementId);
  if (!select) return;

  // Limpiar opciones anteriores pero mantener la primera (Todas)
  select.innerHTML = select.options[0].outerHTML;

  listado.forEach(function(val) {
    const opt = document.createElement("option");
    opt.value = val;
    opt.innerText = val;
    select.appendChild(opt);
  });
}

// --- SISTEMA DE AUTOCOMPLETADO PERSONALIZADO ---

function setupAutocomplete(inputId, arrayValores, suggestionsContainerId) {
  const input = document.getElementById(inputId);
  const container = document.getElementById(suggestionsContainerId);
  if (!input || !container) return;

  input.addEventListener("input", function() {
    const val = this.value.trim().toLowerCase();
    container.innerHTML = "";
    if (!val) return;

    const filtrados = arrayValores.filter(function(v) {
      return v.toLowerCase().indexOf(val) !== -1;
    }).slice(0, 5); // Limitar a 5 sugerencias

    filtrados.forEach(function(sug) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "list-group-item list-group-item-action py-1 small";
      btn.innerText = sug;
      btn.addEventListener("click", function() {
        input.value = sug;
        container.innerHTML = "";
      });
      container.appendChild(btn);
    });
  });

  // Ocultar si se hace clic fuera
  document.addEventListener("click", function(e) {
    if (e.target !== input) {
      container.innerHTML = "";
    }
  });
}

// --- MÓDULO 2: BÚSQUEDA POR No. INV. (Módulo 2) ---

window.ejecutarBusquedaManual = function(event) {
  if (event) event.preventDefault();
  const q = document.getElementById("buscar-input").value.trim();
  if (!q) return;

  const buscarPorSerie = document.getElementById("buscar-serie-chk").checked;
  ejecutarBusquedaAutomatica(q, buscarPorSerie);
};

window.limpiarBuscador = function() {
  const inp = document.getElementById("buscar-input");
  if (inp) inp.value = "";
  const chk = document.getElementById("buscar-serie-chk");
  if (chk) chk.checked = false;
  const res = document.getElementById("resultado-busqueda-container");
  if (res) res.classList.add("d-none");
};

/**
 * Lógica unificada de búsqueda con respuestas robustas camelCase (Módulo 2).
 * Utiliza withSuccessHandler y withFailureHandler ocultando siempre el loader.
 */
function ejecutarBusquedaAutomatica(query, buscarPorSerie) {
  mostrarCarga("Buscando artículo...");
  const q = query.trim().toLowerCase();

  if (buscarPorSerie) {
    // Buscar por serie en caché local primero
    const matches = window.cacheInventario.filter(function(item) {
      const s = String(item.serie || "").trim().toLowerCase();
      return s === q && s !== "s/s" && s !== "s/s." && s !== "sin serie" && s !== "";
    });

    if (matches.length > 0) {
      mostrarResultadoBusqueda(matches[0]);
      ocultarCarga();
      registrarEnBitacora("BÚSQUEDA", "Buscada serie '" + query + "' en caché. Encontrado: " + matches[0].descripcion);
    } else {
      // Intentar en servidor
      google.script.run
        .withSuccessHandler(function(srvMatches) {
          ocultarCarga(); // Ocultar carga (Módulo 2)
          if (srvMatches && srvMatches.length > 0) {
            mostrarResultadoBusqueda(srvMatches[0]);
            registrarEnBitacora("BÚSQUEDA", "Buscada serie '" + query + "' en servidor. Encontrado: " + srvMatches[0].descripcion);
          } else {
            mostrarNotificacion("No se encontró ningún artículo con la serie '" + query + "'", "bg-danger");
            alert("No se encontró coincidencia para la serie '" + query + "'. Verifique el número o use la búsqueda manual.");
            document.getElementById("resultado-busqueda-container").classList.add("d-none");
            registrarEnBitacora("BÚSQUEDA", "Buscada serie '" + query + "' en servidor — Sin resultados.");
          }
        })
        .withFailureHandler(function(err) {
          ocultarCarga(); // Ocultar carga (Módulo 2)
          console.error("[SMR] Error en buscarPorSerie:", err);
          mostrarNotificacion("Error de conexión con el servidor", "bg-danger");
          alert("Error de conexión con el servidor: " + err.message);
          registrarEnBitacora("ERROR", "Fallo al buscar serie '" + query + "' en servidor.");
        })
        .buscarPorSerie(query);
    }
  } else {
    // Buscar por No. INV
    const found = window.cacheInventario.find(function(item) {
      return String(item.noInv || "").trim().toLowerCase() === q;
    });

    if (found) {
      mostrarResultadoBusqueda(found);
      ocultarCarga();
      registrarEnBitacora("BÚSQUEDA", "Buscado No. INV '" + query + "' en caché. Encontrado: " + found.descripcion);
    } else {
      // Intentar en servidor (Módulo 2)
      google.script.run
        .withSuccessHandler(function(res) {
          ocultarCarga(); // Ocultar carga (Módulo 2)
          if (res && res.encontrado && res.data) {
            mostrarResultadoBusqueda(res.data);
            registrarEnBitacora("BÚSQUEDA", "Buscado No. INV '" + query + "' en servidor. Encontrado: " + res.data.descripcion);
          } else {
            // Mostrar mensaje detallado del servidor (Módulo 2)
            var msg = res && res.mensaje ? res.mensaje : "No se encontró ningún bien con No. INV. '" + query + "'";
            mostrarNotificacion(msg, "bg-danger");
            alert(msg + "\n\nCódigo QR detectado: " + query + ". No se encontró coincidencia. Verifique el número o use la búsqueda manual.");
            document.getElementById("resultado-busqueda-container").classList.add("d-none");
            registrarEnBitacora("BÚSQUEDA", "Buscado No. INV '" + query + "' en servidor — Sin resultados.");
          }
        })
        .withFailureHandler(function(err) {
          ocultarCarga(); // Ocultar carga (Módulo 2)
          console.error("[SMR] Error en buscarPorInventario:", err);
          mostrarNotificacion("Error de conexión con el servidor", "bg-danger");
          alert("Error de conexión con el servidor: " + err.message);

}

/**
 * Renderiza miniaturas de imágenes públicas en Drive desde FOTO_ID.
 */
function renderizarFotosExistentes(fotoIdsString, noInv, containerId, mainWrapperId) {
  const listEl = document.getElementById(containerId);
  const wrapperEl = document.getElementById(mainWrapperId);
  if (!listEl) return;

  listEl.innerHTML = "";

  const ids = fotoIdsString ? String(fotoIdsString).split(",") : [];

    if (wrapperEl) wrapperEl.classList.add("d-none");
    return;

  if (wrapperEl) wrapperEl.classList.remove("d-none");

  ids.forEach(function(id) {

    if (!cleanId) return;

    // Contenedor miniatura
    const thumbDiv = document.createElement("div");
    thumbDiv.className = "photo-thumbnail-container";

    // Imagen usando la API directa de Drive para vistas de miniaturas
    const img = document.createElement("img");

    img.src = "https://lh3.googleusercontent.com/u/0/d/" + cleanId + "=w150-h150-p";
    img.alt = "Foto de evidencia";
    img.onerror = function() {
      // Fallback si no tiene permisos públicos todavía
      this.src = "https://placehold.co/80x80/e0e0e0/666666?text=FOTO_DRIVE";
    };

    // Botón de eliminar foto
    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "photo-delete-btn";
    delBtn.innerHTML = "&times;";
    delBtn.title = "Eliminar foto";
    delBtn.onclick = function() {
      if (confirm("¿Está seguro de que desea eliminar esta fotografía del servidor?")) {
        mostrarCarga("Eliminando fotografía...");
        google.script.run
          .withSuccessHandler(function(res) {
            ocultarCarga();
            if (res.success) {
              mostrarNotificacion("Fotografía eliminada correctamente.", "bg-success");
              // Recargar listados y estadísticas
              cargarListadoInventario(function() {
                cargarEstadisticasInicio();

              mostrarNotificacion("Error al eliminar foto: " + res.message, "bg-danger");

          })
          .withFailureHandler(function(err) {
            ocultarCarga();
            mostrarNotificacion("Fallo de red al eliminar foto.", "bg-danger");
          })
          .eliminarFotoArticulo(noInv, cleanId);

/**
 * Previsualización en tiempo real de fotos seleccionadas localmente antes de subirlas.
 */
window.renderizarPrevisualizacionFotos = function(inputEl, previewContainerId) {
  const container = document.getElementById(previewContainerId);
  if (!container) return;
  container.innerHTML = "";

  const files = inputEl.files;
  if (!files || files.length === 0) return;

  if (files.length > 3) {
    alert("Se permiten como máximo 3 fotos por artículo. Se seleccionarán las primeras 3.");
  }

  const limiteMax = Math.min(files.length, 3);

  for (let i = 0; i < limiteMax; i++) {
    const file = files[i];

    // Validar formato (PNG, JPG, GIF, WEBP)
    const validExtensions = ["image/jpeg", "image/png", "image/gif", "image/webp"];
    if (validExtensions.indexOf(file.type) === -1) {
      alert("El archivo '" + file.name + "' no es una imagen válida. Formatos aceptados: JPG, PNG, GIF, WEBP.");
      continue;
    }

    // Validar peso (menor a 5MB)
    if (file.size > 5 * 1024 * 1024) {
      alert("La imagen '" + file.name + "' excede el límite de peso permitido (5MB). Reduzca la resolución.");
      continue;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const imgDiv = document.createElement("div");
      imgDiv.className = "photo-thumbnail-container";

      const img = document.createElement("img");
      img.className = "photo-thumbnail";
      img.src = e.target.result;
      img.alt = "Previsualización";

      imgDiv.appendChild(img);
      container.appendChild(imgDiv);
    };
    reader.readAsDataURL(file);
  }
};

/**
 * Sube una cola de imágenes seleccionadas en serie al backend de Apps Script.
 */
function subirFotosDeFrente(noInv, files, callback) {
  let indexCarga = 0;
  const limiteMax = Math.min(files.length, 3);

  function procesarSiguienteFoto() {
    if (indexCarga >= limiteMax) {
      if (callback) callback();
      return;
    }

    mostrarCarga("Subiendo fotografía " + (indexCarga + 1) + " de " + limiteMax + "...");
    const file = files[indexCarga];

    const reader = new FileReader();
    reader.onload = function(e) {
      const base64Data = e.target.result;
      google.script.run
        .withSuccessHandler(function(resUpload) {
          indexCarga++;
          procesarSiguienteFoto();
        })
        .withFailureHandler(function(errUpload) {
          console.error("Fallo al subir foto:", errUpload);
          indexCarga++;
          procesarSiguienteFoto();
        })
        .subirFotoArticulo(noInv, base64Data, file.name, indexCarga);
    };
    reader.readAsDataURL(file);
  }

  procesarSiguienteFoto();
}

/**
 * Decodifica de forma estática una imagen/foto seleccionada o capturada por el usuario (Módulo 1).
 * Esto evita el uso de getUserMedia y es 100% compatible con la política de sandbox de Google Apps Script.
 */
window.procesarCodigoQR = function(inputEl) {
  const fileInput = inputEl;
  const statusEl = document.getElementById("scanner-status");
  if (!fileInput.files || fileInput.files.length === 0) return;

  const file = fileInput.files[0];
  if (statusEl) {
    statusEl.innerHTML = `<span class="text-primary"><i class="fa-solid fa-spinner fa-spin"></i> Decodificando código...</span>`;
  }

  mostrarCarga("Decodificando código QR...");

  // Registrar inicio de escaneo en bitácora (Módulo 2)
  registrarEnBitacora("ESCANER", "Iniciada decodificación estática del archivo '" + file.name + "'");

  // Crear instancia local de html5-qrcode para decodificación estática
  const html5QrCode = new Html5Qrcode("reader");

  html5QrCode.scanFile(file, true)
    .then(function(decodedText) {
      ocultarCarga();
      const limpioVal = String(decodedText || "").trim();

      if (statusEl) {
        statusEl.innerHTML = `<span class="text-success"><i class="fa-solid fa-check"></i> Código detectado: <strong>${limpioVal}</strong></span>`;
      }

      const buscarInput = document.getElementById("buscar-input");
      if (buscarInput) {
        buscarInput.value = limpioVal;
      }

      mostrarNotificacion("Código decodificado: " + limpioVal, "bg-success");

      // Registrar éxito de escaneo en bitácora (Módulo 2)
      registrarEnBitacora("ESCANER", "Código decodificado con éxito: " + limpioVal);

      // Lanzar búsqueda automática inmediatamente (Módulo 1)
      ejecutarBusquedaAutomatica(limpioVal);

      // Limpiar input file para permitir cargas consecutivas
      fileInput.value = "";
    })
    .catch(function(err) {
      ocultarCarga();
      console.error("Fallo al decodificar código por archivo estático:", err);
      if (statusEl) {
        statusEl.innerHTML = `<span class="text-danger"><i class="fa-solid fa-xmark"></i> No se pudo leer el código.</span>`;
      }
      alert("No se pudo leer el código. Intente con mejor iluminación o ingrese el dato manualmente.");
      registrarEnBitacora("ERROR", "No se detectó un código legible en la imagen.");
      fileInput.value = "";
    });
};

/**
 * Implementa asistencia manual de búsqueda mediante sugerencias de coincidencias parciales (Módulo 1).
 * Rellena de forma dinámica el datalist con registros que coincidan con la entrada del usuario.

  const query = String(inputEl.value || "").trim().toLowerCase();

  datalist.innerHTML = "";

  // Buscar coincidencias parciales en No. INV o Serie del caché de inventario
  const filtrados = window.cacheInventario.filter(function(item) {
    var invMatch = String(item.noInv || "").toLowerCase().indexOf(query) !== -1;
    var serieMatch = String(item.serie || "").toLowerCase().indexOf(query) !== -1;
    return invMatch || serieMatch;

  filtrados.forEach(function(item) {
    const optionNoInv = document.createElement("option");
    optionNoInv.value = item.noInv;
    optionNoInv.innerText = item.descripcion + " (No. INV)";

      optionSerie.value = item.serie;
      optionSerie.innerText = item.descripcion + " (Serie)";

  });

// --- MÓDULO DE CARGA MASIVA (Excel / SheetJS) ---

window.procesarCargaMasiva = function(event) {
  if (event) event.preventDefault();

  const fileInput = document.getElementById("archivo-excel-file");
  const files = fileInput.files;
  if (!files || files.length === 0) {
    alert("Por favor seleccione un archivo.");
    return;
  }

  const file = files[0];
  const opcionDuplicados = document.querySelector('input[name="duplicado-opcion"]:checked').value;

  mostrarCarga("Analizando archivo localmente...");

  const reader = new FileReader();

  if (file.name.endsWith(".csv")) {
    reader.onload = function(e) {
      const text = e.target.result;
      const rows = parsearCSVLocal(text);
      procesarRegistrosMapeados(rows, opcionDuplicados);
    };
    reader.readAsText(file, "UTF-8");
  } else {
    // Es Excel .xlsx
    reader.onload = function(e) {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];

      // Convertir a JSON crudo (todas las filas)
      const rawJson = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
      const rows = mapearColumnasInteligentes(rawJson);

      procesarRegistrosMapeados(rows, opcionDuplicados);
    };
    reader.readAsArrayBuffer(file);
  }
};

/**
 * Parsea un CSV de forma simple respetando comillas.
 */
function parsearCSVLocal(text) {
  const lines = text.split(/\r\n|\n/);
  const result = [];
  if (lines.length === 0) return [];

  // Separar primera fila como cabeceras
  const headers = parsearLineaCSV(lines[0]);

  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const values = parsearLineaCSV(lines[i]);
    const rowObj = {};
    for (let j = 0; j < headers.length; j++) {
      rowObj[headers[j]] = values[j] || "";
    }
    result.push(rowObj);
  }

  // Convertir las cabeceras a la matriz mapeable
  const matrix = [headers];
  result.forEach(function(r) {
    const arr = headers.map(function(h) { return r[h]; });
    matrix.push(arr);
  });

  return mapearColumnasInteligentes(matrix);
}

function parsearLineaCSV(line) {
  const result = [];
  let current = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === ',' && !inQuotes) {
      result.push(current.trim());
      current = "";
    } else {
      current += char;
    }
  }
  result.push(current.trim());
  return result;
}

/**
 * Normaliza textos para comparación flexible de cabeceras de Excel/CSV.
 */
function limpiarLlaveColumna(txt) {
  if (!txt) return "";
  return String(txt).toLowerCase()
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/[^a-z0-9]/g, "")
                    .trim();
}

/**
 * Algoritmo de mapeo inteligente de cabeceras requerido por RF4.
 */
function mapearColumnasInteligentes(matrix) {
  if (matrix.length < 2) return [];

  const cabecerasOriginales = matrix[0];
  const listadoFilasMapeadas = [];

  // Índices mapeados a columnas estándar
  let colIdxNo = -1;
  let colIdxNoInv = -1;
  let colIdxDesc = -1;
  let colIdxSerie = -1;
  let colIdxModelo = -1;
  let colIdxMarca = -1;
  let colIdxEstado = -1;
  let colIdxImporte = -1;
  let colIdxUbicacion = -1;
  let colIdxResguardado = -1;
  let colIdxResguardanteReal = -1;
  let colIdxUbicacionReal = -1;
  let colIdxEstadoReal = -1;
  let colIdxFotoId = -1;

  cabecerasOriginales.forEach(function(header, idx) {
    const norm = limpiarLlaveColumna(header);

    // Validar variantes
    if (norm === "no" || norm === "numero" || norm === "id") {
      colIdxNo = idx;
    } else if (norm === "noinv" || norm === "noinventario" || norm === "numeroinventario" || norm === "etiqueta") {
      colIdxNoInv = idx;
    } else if (norm === "descripcion" || norm === "articulo") {
      colIdxDesc = idx;
    } else if (norm === "serie" || norm === "noserie" || norm === "numerodeserie") {
      colIdxSerie = idx;
    } else if (norm === "modelo") {
      colIdxModelo = idx;
    } else if (norm === "marca") {
      colIdxMarca = idx;
    } else if (norm === "estado" || norm === "estadopatrimonio") {
      colIdxEstado = idx;
    } else if (norm === "importe" || norm === "valor" || norm === "costo") {
      colIdxImporte = idx;
    } else if (norm === "ubicacion") {
      colIdxUbicacion = idx;
    } else if (norm === "resguardado" || norm === "resguardo") {
      colIdxResguardado = idx;
    } else if (norm === "resguardantereal" || norm === "resguardante") {
      colIdxResguardanteReal = idx;
    } else if (norm === "ubicacionreal") {
      colIdxUbicacionReal = idx;
    } else if (norm === "estadoreal") {
      colIdxEstadoReal = idx;
    } else if (norm === "fotoid" || norm === "fotos") {
      colIdxFotoId = idx;
    }
  });

  // Procesar cada fila de datos (partiendo desde index 1)
  for (let r = 1; r < matrix.length; r++) {
    const fila = matrix[r];
    // Evitar procesar filas totalmente vacías
    if (!fila || fila.length === 0 || (fila.length === 1 && !fila[0])) continue;

    const objMapeado = {
      "No.": colIdxNo !== -1 ? fila[colIdxNo] : "",
      "No. INV.": colIdxNoInv !== -1 ? String(fila[colIdxNoInv] || "").trim() : "",
      "DESCRIPCION": colIdxDesc !== -1 ? fila[colIdxDesc] : "",
      "SERIE": colIdxSerie !== -1 ? fila[colIdxSerie] : "SIN SERIE",
      "MODELO": colIdxModelo !== -1 ? fila[colIdxModelo] : "",
      "MARCA": colIdxMarca !== -1 ? fila[colIdxMarca] : "",
      "ESTADO": colIdxEstado !== -1 ? fila[colIdxEstado] : "BUENO",
      "IMPORTE": colIdxImporte !== -1 ? fila[colIdxImporte] : 0,
      "UBICACION": colIdxUbicacion !== -1 ? fila[colIdxUbicacion] : "",
      "RESGUARDADO": colIdxResguardado !== -1 ? fila[colIdxResguardado] : "",
      "RESGUARDANTE_REAL": colIdxResguardanteReal !== -1 ? fila[colIdxResguardanteReal] : "",
      "UBICACION_REAL": colIdxUbicacionReal !== -1 ? fila[colIdxUbicacionReal] : "",
      "ESTADO_REAL": colIdxEstadoReal !== -1 ? fila[colIdxEstadoReal] : "",
      "FOTO_ID": colIdxFotoId !== -1 ? fila[colIdxFotoId] : ""
    };

    listadoFilasMapeadas.push(objMapeado);
  }

  return listadoFilasMapeadas;
}

/**
 * Envía el lote estructurado al servidor para guardado optimizado en GAS.
 */
function procesarRegistrosMapeados(rows, opcionDuplicados) {
  if (rows.length === 0) {
    ocultarCarga();
    alert("No se encontraron registros válidos o mapeables en el archivo.");
    return;
  }

  mostrarCarga("Subiendo lote al servidor de Google Sheets...");

  google.script.run
    .withSuccessHandler(function(res) {
      ocultarCarga();
      if (res.success) {
        mostrarNotificacion("¡Carga masiva completada exitosamente!", "bg-success");

        // Renderizar resumen en el cliente
        document.getElementById("resultado-carga-container").classList.remove("d-none");
        document.getElementById("res-carga-nuevos").innerText = res.nuevos;
        document.getElementById("res-carga-actualizados").innerText = res.actualizados;
        document.getElementById("res-carga-omitidos").innerText = res.omitidos;
        document.getElementById("res-carga-errores").innerText = res.errores;

        // Limpiar formulario de archivo
        document.getElementById("archivo-excel-file").value = "";

        // Recargar listado completo y estadísticas
        cargarListadoInventario();
        cargarEstadisticasInicio();
      } else {
        alert("Fallo al procesar lote: " + res.message);
      }
    })
    .withFailureHandler(function(err) {
      ocultarCarga();
      alert("Error en el servidor de Google Sheets: " + err.message);
    })
    .importarDatosExcel(rows, opcionDuplicados);
}

/**
 * Realiza el filtrado de inventario de forma de alto rendimiento en el servidor (Módulo 3).
 * Si no se salta la petición, solicita la lista filtrada a Google Sheets, de lo contrario renderiza.
 */
window.aplicarFiltrosYListar = function(skipServerQuery) {
  if (!skipServerQuery) {
    cargarListadoInventario();
    return;
  }

  const totalRegistros = window.cacheInventario.length;
  const totalPaginas = Math.ceil(totalRegistros / REGISTROS_POR_PAGINA) || 1;

  if (window.paginaActual > totalPaginas) {
    window.paginaActual = totalPaginas;
  }

  const inicioIdx = (window.paginaActual - 1) * REGISTROS_POR_PAGINA;
  const finIdx = Math.min(inicioIdx + REGISTROS_POR_PAGINA, totalRegistros);

  const paginaItems = window.cacheInventario.slice(inicioIdx, finIdx);

  console.log("[SMR] aplicando filtros en cliente. Registros en página:", paginaItems.length, "Total:", totalRegistros);

  // Renderizar filas de la tabla primero
  renderizarTablaListado(paginaItems);

  // Renderizar barra de control del paginador después (garantizando DOM listo)
  renderizarPaginadorUI(window.cacheInventario, window.paginaActual, REGISTROS_POR_PAGINA);
};

        <td class="text-muted">${item.serie || "SIN SERIE"}</td>
        <td>${item.marca || ""}</td>
        <td>${item.ubicacionReal || "<span class='text-muted small'>Pendiente</span>"}</td>
        <td><span class="badge ${badgeClass}">${est || "Pendiente"}</span></td>
        <td class="small text-truncate" style="max-width: 140px;" title="${item.usuarioOperador || ""}">${opTxt}</td>
        <td>${item.resguardanteReal || "<span class='text-muted small'>Pendiente</span>"}</td>

            <button class="btn btn-sm btn-outline-primary rounded-circle" onclick="window.abrirModalFotos('${item.noInv}')" title="Gestionar fotos"><i class="fa-solid fa-images"></i></button>
            <button class="btn btn-sm btn-outline-secondary rounded-circle" onclick="window.abrirGeneradorQR('${item.noInv}')" title="Generar QR"><i class="fa-solid fa-qrcode"></i></button>
          </div>

/**
 * Genera el paginador de la grilla de listado (Módulo 4).
 * Evita asignaciones de innerHTML a elementos nulos y agrega guards robustos.
 */
function renderizarPaginadorUI(datos, paginaActual, itemsPorPagina) {
  // b) Verificar estructura de datos
  if (!Array.isArray(datos) || datos.length === 0) {
    console.warn("Paginador: sin datos para paginar (Módulo 4)");
    return;
  }

  // c) Buscar el contenedor del paginador
  var ul = document.getElementById("paginador-ul");
  var infoText = document.getElementById("paginacion-info-text");

  // d) Si !ul, buscar contenedor raíz y crearlo dinámicamente si no existe (Módulo 4)
  if (!ul) {
    console.warn("Paginador: elemento <ul> con id 'paginador-ul' no encontrado en el DOM. Creando dinámicamente...");
    const tabla = document.getElementById("tabla-listado-bienes");
    if (tabla && tabla.parentNode) {
      const containerDiv = document.createElement("div");
      containerDiv.className = "card-footer d-flex flex-column flex-sm-row justify-content-between align-items-center bg-white border-top p-3";
      containerDiv.innerHTML = `
        <div class="text-muted small mb-2 mb-sm-0" id="paginacion-info-text"></div>
        <nav aria-label="Navegación de listado">
          <ul class="pagination pagination-sm mb-0" id="paginador-ul"></ul>
        </nav>
      `;
      tabla.parentNode.appendChild(containerDiv);
      ul = document.getElementById("paginador-ul");
      infoText = document.getElementById("paginacion-info-text");
    }
  }

  // e) Guard defensivo para evitar innerHTML de null
  if (!ul) {
    console.error("Paginador: Imposible inyectar paginador en el DOM. Contenedores no disponibles.");
    return;
  }

  const totalRegistros = datos.length;
  const totalPaginas = Math.ceil(totalRegistros / itemsPorPagina) || 1;
  const inicioIdx = (paginaActual - 1) * itemsPorPagina;
  const finIdx = Math.min(inicioIdx + itemsPorPagina, totalRegistros);

  if (infoText) {
    infoText.innerText = `Mostrando ${totalRegistros === 0 ? 0 : inicioIdx + 1} a ${finIdx} de ${totalRegistros} registros`;
  }

  ul.innerHTML = "";

  // Botón Anterior
  const liPrev = document.createElement("li");
  liPrev.className = "page-item " + (paginaActual === 1 ? "disabled" : "");
  liPrev.innerHTML = `<a class="page-link" onclick="window.cambiarPagina(${paginaActual - 1})">Anterior</a>`;
  ul.appendChild(liPrev);

  // Limitar número de páginas visibles (máximo 5 páginas)
  let startPage = Math.max(1, paginaActual - 2);
  let endPage = Math.min(totalPaginas, startPage + 4);
  if (endPage - startPage < 4) {
    startPage = Math.max(1, endPage - 4);
  }

  for (let p = startPage; p <= endPage; p++) {
    const liPage = document.createElement("li");
    liPage.className = "page-item " + (p === paginaActual ? "active" : "");
    liPage.innerHTML = `<a class="page-link" onclick="window.cambiarPagina(${p})">${p}</a>`;
    ul.appendChild(liPage);
  }

  // Botón Siguiente
  const liNext = document.createElement("li");
  liNext.className = "page-item " + (paginaActual === totalPaginas ? "disabled" : "");
  liNext.innerHTML = `<a class="page-link" onclick="window.cambiarPagina(${paginaActual + 1})">Siguiente</a>`;
  ul.appendChild(liNext);
}

window.cambiarPagina = function(p) {
  window.paginaActual = p;
  window.aplicarFiltrosYListar(true);
};

function formatearFecha(fechaSerial) {
  if (!fechaSerial) return "";
  try {
    const d = new Date(fechaSerial);
    if (isNaN(d.getTime())) return String(fechaSerial);
    const pad = function(n) { return n < 10 ? '0' + n : n; };
    return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() + " " +
           pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  } catch(e) {
    return String(fechaSerial);
  }
}

  const container = document.getElementById("qr-code-img-container");

    new QRCode(container, {
      text: String(item.noInv || "").trim(),
      width: 180,
      height: 180,
      colorDark : "#000000",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });
  } catch(e) {
    console.error("Fallo al generar QR con qrcode.js, recurriendo a Google Charts API:", e);
    const imgFallback = document.createElement("img");
    imgFallback.src = "https://chart.googleapis.com/chart?cht=qr&chs=180x180&chl=" + encodeURIComponent(item.noInv);
    imgFallback.alt = "Código QR de bien";
    container.appendChild(imgFallback);
  }

  const modal = new bootstrap.Modal(document.getElementById("modal-qr"));
  modal.show();
};
</script>
