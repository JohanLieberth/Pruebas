<script>
/**
 * SISTEMA DE INVENTARIO FÍSICO - SUBDIRECCIÓN DE MEJORA REGULATORIA
 * Frontend: JavaScript.html
 */

// --- VARIABLES GLOBALES DE ESTADO DEL CLIENTE ---
window.cacheInventario = [];     // Almacén local de artículos cargados
window.cacheUbicaciones = [];   // Para autocompletar
window.cacheResguardantes = [];  // Para autocompletar
window.usuarioActivo = "";       // Email del usuario logueado

// Variables de Paginación
window.paginaActual = 1;
const REGISTROS_POR_PAGINA = 20;

// Instancia de Scanner Local (html5-qrcode)
window.html5QrcodeScanner = null;

// Bloqueo de Navegación doble clic
window.isNavigating = false;

// Evitar bloqueos por extensiones de navegador de terceros
const c = function(element) {
  return element && typeof element === 'object' && 'classList' in element ? element : null;
};

const manejarElemento = function(elemento) {
  if (!elemento) return;
  try {
    elemento.classList.add('smr-valid');
  } catch(e) {}
};

// Capturador de promesas rechazadas global para silenciar extensiones ruidosas
window.addEventListener('unhandledrejection', function(event) {
  if (event.reason && event.reason.stack && event.reason.stack.indexOf('content.js') !== -1) {
    event.preventDefault(); // Evitar ruido en consola
  }
});

/**
 * Inicialización completa del cliente al cargar.
 */
document.addEventListener("DOMContentLoaded", function() {
  inicializarAppCompleta();
});

/**
 * Función central para arrancar el aplicativo de forma segura y evitar cuelgues estáticos.
 * Envuelto en try/catch global para evitar estado en blanco en el sandbox de GAS (Error 2).
 */
function inicializarAppCompleta() {
  try {
    // 1. Mostrar loader de arranque
    showLoader("Obteniendo información del servidor...");

    // 2. Timeout defensivo para evitar cuelgues estáticos si GAS tiene alta latencia (6 segundos)
    const safeTimeout = setTimeout(function() {
      hideLoader();
      mostrarNotificacion("La conexión con el servidor demoró más de lo esperado. Algunas funciones podrían inicializar de forma asíncrona.", "bg-warning");
    }, 6000);

    // 3. Inicializar identidad del usuario
    inicializarIdentidadUsuario();

    // 4. Cargar datos base del servidor
    cargarEstadisticasInicio();
    cargarListadoInventario(function() {
      clearTimeout(safeTimeout);
      hideLoader();

      // 5. Verificar si hay búsqueda inicial solicitada por URL (?noinv=XXXX)
      if (window.initialNoInvQuery && window.initialNoInvQuery.trim() !== "") {
        window.showSection('busqueda');
        const input = document.getElementById("buscar-input");
        if (input) {
          input.value = window.initialNoInvQuery;
        }
        ejecutarBusquedaAutomatica(window.initialNoInvQuery);
      } else {
        window.showSection('inicio');
      }
    });
  } catch (error) {
    console.error("[SMR] Error catastrófico en inicialización de la app:", error);
    hideLoader();

    // Mostrar error visiblemente en pantalla para evitar pantalla en blanco ante fallos de GAS
    const errorContainer = document.createElement("div");
    errorContainer.className = "alert alert-danger m-5 p-4 text-center";
    errorContainer.style.zIndex = "10000";
    errorContainer.innerHTML = `
      <h4 class="fw-bold mb-3"><i class="fa-solid fa-triangle-exclamation"></i> Error Crítico de Inicialización</h4>
      <p class="mb-3">La aplicación no pudo cargarse debido a un error de ejecución en su navegador:</p>
      <pre class="bg-white p-3 border rounded text-start text-danger" style="white-space: pre-wrap; font-family: monospace;">${error.stack || error.toString()}</pre>
      <p class="small text-muted mb-0">Por favor, recargue la página o intente utilizar un navegador compatible.</p>
    `;
    document.body.prepend(errorContainer);
  }
}

/**
 * Obtiene y muestra la identidad del usuario activo de forma asíncrona mediante google.script.run.
 * Se eliminó el uso directo de Session.getActiveUser() en el cliente para resolver el Error 1.
 */
function inicializarIdentidadUsuario() {
  google.script.run
    .withSuccessHandler(function(email) {
      window.usuarioActivo = email || "Operador SMR";
      const userEl = document.getElementById("navbar-user");
      if (userEl) {
        userEl.innerHTML = `<i class="fa-solid fa-user me-1"></i> ${window.usuarioActivo}`;
      }
    })
    .withFailureHandler(function(err) {
      console.error("No se pudo recuperar identidad de usuario:", err);
      const userEl = document.getElementById("navbar-user");
      if (userEl) {
        userEl.innerHTML = `<i class="fa-solid fa-user me-1"></i> Operador SMR`;
      }
    })
    .obtenerUsuarioActivo();
}

/**
 * Loader Visual de Operación asíncrona.
 */
function showLoader(mensaje) {
  document.getElementById("loader-message").innerText = mensaje || "Procesando operación...";
  document.getElementById("global-loader").style.display = "flex";
}

function hideLoader() {
  document.getElementById("global-loader").style.display = "none";
}

/**
 * Toast de notificaciones ligera e instantánea.
 */
function mostrarNotificacion(mensaje, claseColor) {
  const toastEl = document.getElementById('liveToast');
  const toastBody = document.getElementById('toast-body-text');

  // Limpiar clases de color anteriores
  toastEl.className = "toast align-items-center text-white border-0 " + (claseColor || "bg-success");
  toastBody.innerText = mensaje;

  const toast = new bootstrap.Toast(toastEl);
  toast.show();
}

/**
 * Limpia y restablece el contenedor y estado del escáner QR de forma segura (Error 1).
 */
window.limpiarEscaneoQR = function() {
  const fileInput = document.getElementById("qr-input-file");
  if (fileInput) fileInput.value = "";

  const statusEl = document.getElementById("scanner-status");
  if (statusEl) statusEl.innerHTML = "Esperando archivo...";
};

// Mantener compatibilidad con showSection y otras pantallas (Error 1)
window.detenerEscaneoLocal = function() {
  window.limpiarEscaneoQR();
};

/**
 * Enrutador SPA dinámico y seguro de secciones.
 */
window.showSection = function(sectionId) {
  if (window.isNavigating) return;
  window.isNavigating = true;

  // Detener escaneo si se sale de la sección de búsqueda (Error 1)
  if (sectionId !== 'busqueda') {
    if (typeof window.detenerEscaneoLocal === 'function') {
      window.detenerEscaneoLocal();
    }
  }

  // Ocultar todas las secciones
  document.querySelectorAll('.app-section').forEach(function(sec) {
    sec.style.display = 'none';
  });

  // Desmarcar todos los navlinks
  document.querySelectorAll('.navbar-nav .nav-link').forEach(function(link) {
    link.classList.remove('active');
  });

  // Mostrar sección activa
  const targetSec = document.getElementById('section-' + sectionId);
  if (targetSec) {
    targetSec.style.display = 'block';
  }

  // Activar navlink correspondiente
  const targetLink = document.getElementById('nav-' + sectionId);
  if (targetLink) {
    targetLink.classList.add('active');
  }

  // Cerrar colapso de menú bootstrap en móviles defensivamente
  const navbarCollapse = document.getElementById('navbarContent');
  if (navbarCollapse && navbarCollapse.classList.contains('show')) {
    try {
      const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
      if (bsCollapse) bsCollapse.hide();
    } catch(err) {
      navbarCollapse.classList.remove('show');
    }
  }

  // Scroll hacia arriba
  window.scrollTo({ top: 0, behavior: 'smooth' });

  // Desbloquear navegación
  setTimeout(function() {
    window.isNavigating = false;
  }, 250);
};

// --- CARGA DE DATOS DESDE EL SERVIDOR ---

function cargarEstadisticasInicio() {
  google.script.run
    .withSuccessHandler(function(stats) {
      document.getElementById("stats-total").innerText = stats.total;
      document.getElementById("stats-levantados").innerText = stats.levantados;
      document.getElementById("stats-pendientes").innerText = stats.pendientes;
    })
    .withFailureHandler(function(err) {
      console.error("Error al cargar estadísticas:", err);
    })
    .obtenerEstadisticas();
}

function cargarListadoInventario(callback) {
  google.script.run
    .withSuccessHandler(function(data) {
      console.log("[SMR] Datos recibidos del servidor para inventario:", data);
      console.log("[SMR] Total de registros iniciales:", data ? data.length : 0);
      window.cacheInventario = data || [];

      // Cargar campos de autocompletar ubicaciones y resguardantes
      actualizarCacheAutocompletar();

      // Renderizar listado de la tabla general
      window.paginaActual = 1;
      aplicarFiltrosYListar();

      if (callback) callback();
    })
    .withFailureHandler(function(err) {
      console.error("Error al cargar inventario:", err);
      mostrarNotificacion("Fallo al conectar con Google Sheets: " + err.message, "bg-danger");
      if (callback) callback();
    })
    .listarArticulos();
}

function actualizarCacheAutocompletar() {
  google.script.run
    .withSuccessHandler(function(data) {
      window.cacheUbicaciones = data.ubicaciones || [];
      window.cacheResguardantes = data.resguardantes || [];

      // Rellenar selectores de filtros del listado general
      llenarSelectFiltro("filtro-ubicacion-sel", window.cacheUbicaciones);
      llenarSelectFiltro("filtro-marca-sel", obtenerMarcasUnicas(window.cacheInventario));

      // Inicializar autocompletar en los inputs reales
      setupAutocomplete("real-ubicacion", window.cacheUbicaciones, "real-ubicacion-suggestions");
      setupAutocomplete("real-resguardante", window.cacheResguardantes, "real-resguardante-suggestions");
    })
    .withFailureHandler(function(err) {
      console.error("Error cargando autocompletar:", err);
    })
    .obtenerCamposAutocompletar();
}

function obtenerMarcasUnicas(articulos) {
  const marcas = {};
  articulos.forEach(function(item) {
    const m = String(item.marca || "").trim();
    if (m) marcas[m] = true;
  });
  return Object.keys(marcas).sort();
}

function llenarSelectFiltro(elementId, listado) {
  const select = document.getElementById(elementId);
  if (!select) return;

  // Limpiar opciones anteriores pero mantener la primera (Todas)
  select.innerHTML = select.options[0].outerHTML;

  listado.forEach(function(val) {
    const opt = document.createElement("option");
    opt.value = val;
    opt.innerText = val;
    select.appendChild(opt);
  });
}

// --- SISTEMA DE AUTOCOMPLETADO PERSONALIZADO ---

function setupAutocomplete(inputId, arrayValores, suggestionsContainerId) {
  const input = document.getElementById(inputId);
  const container = document.getElementById(suggestionsContainerId);
  if (!input || !container) return;

  input.addEventListener("input", function() {
    const val = this.value.trim().toLowerCase();
    container.innerHTML = "";
    if (!val) return;

    const filtrados = arrayValores.filter(function(v) {
      return v.toLowerCase().indexOf(val) !== -1;
    }).slice(0, 5); // Limitar a 5 sugerencias

    filtrados.forEach(function(sug) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "list-group-item list-group-item-action py-1 small";
      btn.innerText = sug;
      btn.addEventListener("click", function() {
        input.value = sug;
        container.innerHTML = "";
      });
      container.appendChild(btn);
    });
  });

  // Ocultar si se hace clic fuera
  document.addEventListener("click", function(e) {
    if (e.target !== input) {
      container.innerHTML = "";
    }
  });
}

// --- MÓDULO DE BÚSQUEDA Y ESCANEO ---

window.ejecutarBusquedaManual = function(event) {
  if (event) event.preventDefault();
  const q = document.getElementById("buscar-input").value.trim();
  if (!q) return;

  const buscarPorSerie = document.getElementById("buscar-serie-chk").checked;
  ejecutarBusquedaAutomatica(q, buscarPorSerie);
};

window.limpiarBuscador = function() {
  document.getElementById("buscar-input").value = "";
  document.getElementById("buscar-serie-chk").checked = false;
  document.getElementById("resultado-busqueda-container").classList.add("d-none");
};

/**
 * Lógica unificada de búsqueda local en el caché de la app para máxima velocidad.
 * Cae al servidor solo si no se encuentra localmente.
 */
function ejecutarBusquedaAutomatica(query, buscarPorSerie) {
  showLoader("Buscando artículo...");
  const q = query.trim().toLowerCase();

  if (buscarPorSerie) {
    // Buscar por serie en caché local primero
    const matches = window.cacheInventario.filter(function(item) {
      const s = String(item["SERIE"] || "").trim().toLowerCase();
      return s === q && s !== "s/s" && s !== "s/s." && s !== "sin serie" && s !== "";
    });

    if (matches.length > 0) {
      mostrarResultadoBusqueda(matches[0]);
      hideLoader();
    } else {
      // Intentar en servidor
      google.script.run
        .withSuccessHandler(function(srvMatches) {
          hideLoader();
          if (srvMatches && srvMatches.length > 0) {
            mostrarResultadoBusqueda(srvMatches[0]);
          } else {
            mostrarNotificacion("No se encontró ningún artículo con la serie '" + query + "'", "bg-danger");
            document.getElementById("resultado-busqueda-container").classList.add("d-none");
          }
        })
        .withFailureHandler(function(err) {
          hideLoader();
          mostrarNotificacion("Error al buscar en servidor: " + err.message, "bg-danger");
        })
        .buscarPorSerie(query);
    }
  } else {
    // Buscar por No. INV (Con conversión explícita y fallback de string para evitar falsos negativos)
    const found = window.cacheInventario.find(function(item) {
      return String(item["No. INV."] || "").trim().toLowerCase() === q;
    });

    if (found) {
      mostrarResultadoBusqueda(found);
      hideLoader();
    } else {
      // Intentar en servidor por si hay actualizaciones recientes
      google.script.run
        .withSuccessHandler(function(srvItem) {
          hideLoader();
          if (srvItem) {
            mostrarResultadoBusqueda(srvItem);
          } else {
            mostrarNotificacion("No se encontró ningún bien con No. INV. '" + query + "'", "bg-danger");
            document.getElementById("resultado-busqueda-container").classList.add("d-none");
          }
        })
        .withFailureHandler(function(err) {
          hideLoader();
          mostrarNotificacion("Error de red: " + err.message, "bg-danger");
        })
        .buscarPorNoInv(query);
    }
  }
}

/**
 * Renderiza los detalles informativos y el formulario de levantamiento.
 */
function mostrarResultadoBusqueda(item) {
  const container = document.getElementById("resultado-busqueda-container");
  container.classList.remove("d-none");

  // Cargar datos patrimonio (Read-only)
  document.getElementById("pat-descripcion").value = item["DESCRIPCION"] || "";
  document.getElementById("pat-marca").value = item["MARCA"] || "";
  document.getElementById("pat-modelo").value = item["MODELO"] || "";
  document.getElementById("pat-serie").value = item["SERIE"] || "";
  document.getElementById("pat-importe").value = item["IMPORTE"] ? "$" + parseFloat(item["IMPORTE"]).toFixed(2) : "$0.00";
  document.getElementById("pat-estado").value = item["ESTADO"] || "BUENO";
  document.getElementById("pat-resguardado").value = item["RESGUARDADO"] || "";
  document.getElementById("pat-ubicacion").value = item["UBICACION"] || "";

  // Cargar datos reales editables
  document.getElementById("edit-no-inv-id").value = item["No. INV."];
  document.getElementById("real-ubicacion").value = item["UBICACION_REAL"] || item["UBICACION"] || "";
  document.getElementById("real-resguardante").value = item["RESGUARDANTE_REAL"] || item["RESGUARDADO"] || "";
  document.getElementById("real-estado").value = item["ESTADO_REAL"] || "Bueno";

  // Limpiar inputs de fotos
  document.getElementById("real-fotos-files").value = "";
  document.getElementById("real-fotos-preview").innerHTML = "";

  // Renderizar fotos cargadas anteriormente si existen
  renderizarFotosExistentes(item["FOTO_ID"], item["No. INV."], "real-fotos-existentes", "fotos-existentes-container");

  // Scroll automático suave al resultado
  container.scrollIntoView({ behavior: 'smooth' });
}

/**
 * Renderiza miniaturas de imágenes públicas en Drive desde FOTO_ID.
 */
function renderizarFotosExistentes(fotoIdsString, noInv, containerId, mainWrapperId) {
  const listEl = document.getElementById(containerId);
  const wrapperEl = document.getElementById(mainWrapperId);
  if (!listEl) return;

  listEl.innerHTML = "";

  const ids = fotoIdsString ? String(fotoIdsString).split(",") : [];
  if (ids.length === 0) {
    if (wrapperEl) wrapperEl.classList.add("d-none");
    return;
  }

  if (wrapperEl) wrapperEl.classList.remove("d-none");

  ids.forEach(function(id) {
    const cleanId = id.trim();
    if (!cleanId) return;

    // Contenedor miniatura
    const thumbDiv = document.createElement("div");
    thumbDiv.className = "photo-thumbnail-container";

    // Imagen usando la API directa de Drive para vistas de miniaturas
    const img = document.createElement("img");
    img.className = "photo-thumbnail";
    img.src = "https://lh3.googleusercontent.com/u/0/d/" + cleanId + "=w150-h150-p";
    img.alt = "Foto de evidencia";
    img.onerror = function() {
      // Fallback si no tiene permisos públicos todavía
      this.src = "https://placehold.co/80x80/e0e0e0/666666?text=FOTO_DRIVE";
    };

    // Botón de eliminar foto
    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "photo-delete-btn";
    delBtn.innerHTML = "&times;";
    delBtn.title = "Eliminar foto";
    delBtn.onclick = function() {
      if (confirm("¿Está seguro de que desea eliminar esta fotografía del servidor?")) {
        showLoader("Eliminando fotografía...");
        google.script.run
          .withSuccessHandler(function(res) {
            hideLoader();
            if (res.success) {
              mostrarNotificacion("Fotografía eliminada correctamente.", "bg-success");
              // Recargar listados y estadísticas
              cargarListadoInventario(function() {
                cargarEstadisticasInicio();
                // Actualizar vista actual
                const actualItem = window.cacheInventario.find(function(i) {
                  return String(i["No. INV."]).trim().toLowerCase() === String(noInv).trim().toLowerCase();
                });
                if (actualItem) mostrarResultadoBusqueda(actualItem);
              });
            } else {
              mostrarNotificacion("Error al eliminar foto: " + res.message, "bg-danger");
            }
          })
          .withFailureHandler(function(err) {
            hideLoader();
            mostrarNotificacion("Fallo de red al eliminar foto.", "bg-danger");
          })
          .eliminarFotoArticulo(noInv, cleanId);
      }
    };

    thumbDiv.appendChild(img);
    thumbDiv.appendChild(delBtn);
    listEl.appendChild(thumbDiv);
  });
}

/**
 * Previsualización en tiempo real de fotos seleccionadas localmente antes de subirlas.
 */
window.renderizarPrevisualizacionFotos = function(inputEl, previewContainerId) {
  const container = document.getElementById(previewContainerId);
  if (!container) return;
  container.innerHTML = "";

  const files = inputEl.files;
  if (!files || files.length === 0) return;

  if (files.length > 3) {
    alert("Se permiten como máximo 3 fotos por artículo. Se seleccionarán las primeras 3.");
  }

  const limiteMax = Math.min(files.length, 3);

  for (let i = 0; i < limiteMax; i++) {
    const file = files[i];

    // Validar formato (PNG, JPG, GIF, WEBP)
    const validExtensions = ["image/jpeg", "image/png", "image/gif", "image/webp"];
    if (validExtensions.indexOf(file.type) === -1) {
      alert("El archivo '" + file.name + "' no es una imagen válida. Formatos aceptados: JPG, PNG, GIF, WEBP.");
      continue;
    }

    // Validar peso (menor a 5MB)
    if (file.size > 5 * 1024 * 1024) {
      alert("La imagen '" + file.name + "' excede el límite de peso permitido (5MB). Reduzca la resolución.");
      continue;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const imgDiv = document.createElement("div");
      imgDiv.className = "photo-thumbnail-container";

      const img = document.createElement("img");
      img.className = "photo-thumbnail";
      img.src = e.target.result;
      img.alt = "Previsualización";

      imgDiv.appendChild(img);
      container.appendChild(imgDiv);
    };
    reader.readAsDataURL(file);
  }
};

/**
 * Guarda el formulario de levantamiento (Edición simple de campos reales + Fotos)
 */
window.guardarDetalleLevantamiento = function(event) {
  if (event) event.preventDefault();

  const noInv = document.getElementById("edit-no-inv-id").value;
  const ubicacion = document.getElementById("real-ubicacion").value.trim();
  const resguardante = document.getElementById("real-resguardante").value.trim();
  const estado = document.getElementById("real-estado").value;

  if (!ubicacion || !resguardante || !estado) {
    alert("Por favor complete todos los campos obligatorios (*)");
    return;
  }

  showLoader("Guardando datos de levantamiento...");

  const datos = {
    ubicacionReal: ubicacion,
    resguardanteReal: resguardante,
    estadoReal: estado
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        // Subir fotos si se seleccionaron
        const fileInput = document.getElementById("real-fotos-files");
        if (fileInput.files && fileInput.files.length > 0) {
          subirFotosDeFrente(noInv, fileInput.files, function() {
            completarExitoGuardado(noInv);
          });
        } else {
          completarExitoGuardado(noInv);
        }
      } else {
        hideLoader();
        mostrarNotificacion("Error al guardar: " + res.message, "bg-danger");
      }
    })
    .withFailureHandler(function(err) {
      hideLoader();
      mostrarNotificacion("Error al conectar con servidor: " + err.message, "bg-danger");
    })
    .guardarLevantamiento(noInv, datos);
};

function completarExitoGuardado(noInv) {
  mostrarNotificacion("¡Levantamiento guardado exitosamente!", "bg-success");

  // Recargar base de datos local
  cargarListadoInventario(function() {
    cargarEstadisticasInicio();
    hideLoader();

    // Actualizar previsualización para mostrar nuevas miniaturas
    const actualItem = window.cacheInventario.find(function(i) {
      return String(i["No. INV."]).trim().toLowerCase() === String(noInv).trim().toLowerCase();
    });
    if (actualItem) mostrarResultadoBusqueda(actualItem);
  });
}

/**
 * Sube una cola de imágenes seleccionadas en serie al backend de Apps Script.
 */
function subirFotosDeFrente(noInv, files, callback) {
  let indexCarga = 0;
  const limiteMax = Math.min(files.length, 3);

  function procesarSiguienteFoto() {
    if (indexCarga >= limiteMax) {
      if (callback) callback();
      return;
    }

    showLoader("Subiendo fotografía " + (indexCarga + 1) + " de " + limiteMax + "...");
    const file = files[indexCarga];

    const reader = new FileReader();
    reader.onload = function(e) {
      const base64Data = e.target.result;
      google.script.run
        .withSuccessHandler(function(resUpload) {
          indexCarga++;
          procesarSiguienteFoto();
        })
        .withFailureHandler(function(errUpload) {
          console.error("Fallo al subir foto:", errUpload);
          indexCarga++;
          procesarSiguienteFoto();
        })
        .subirFotoArticulo(noInv, base64Data, file.name, indexCarga);
    };
    reader.readAsDataURL(file);
  }

  procesarSiguienteFoto();
}

// --- MÓDULO DE ESCANEO POR ARCHIVO DE IMAGEN (Error 1) ---

/**
 * Decodifica de forma estática una imagen/foto seleccionada o capturada por el usuario (Error 1).
 * Esto evita el uso de getUserMedia y es 100% compatible con la política de sandbox de Google Apps Script.
 */
window.procesarCodigoQR = function(inputEl) {
  const fileInput = inputEl;
  const statusEl = document.getElementById("scanner-status");
  if (!fileInput.files || fileInput.files.length === 0) return;

  const file = fileInput.files[0];
  if (statusEl) {
    statusEl.innerHTML = `<span class="text-primary"><i class="fa-solid fa-spinner fa-spin"></i> Decodificando código...</span>`;
  }

  showLoader("Procesando y decodificando código...");

  // Crear instancia local de html5-qrcode para decodificación estática
  const html5QrCode = new Html5Qrcode("reader");

  html5QrCode.scanFile(file, true)
    .then(function(decodedText) {
      hideLoader();
      if (statusEl) {
        statusEl.innerHTML = `<span class="text-success"><i class="fa-solid fa-check"></i> Código detectado: <strong>${decodedText}</strong></span>`;
      }

      const buscarInput = document.getElementById("buscar-input");
      if (buscarInput) {
        buscarInput.value = decodedText;
      }

      mostrarNotificacion("Código decodificado: " + decodedText, "bg-success");

      // Lanzar búsqueda automática inmediatamente
      ejecutarBusquedaAutomatica(decodedText);

      // Limpiar input file para permitir cargas consecutivas
      fileInput.value = "";
    })
    .catch(function(err) {
      hideLoader();
      console.error("Fallo al decodificar código por archivo estático:", err);
      if (statusEl) {
        statusEl.innerHTML = `<span class="text-danger"><i class="fa-solid fa-xmark"></i> No se detectó código. Intente de nuevo.</span>`;
      }
      alert("No se pudo detectar un código QR o de barras válido en la imagen. Asegúrese de que la foto esté tomada de frente, enfocada y bien iluminada.");
      fileInput.value = "";
    });
};

/**
 * Implementa asistencia manual de búsqueda mediante sugerencias de coincidencias parciales (Error 1).
 * Rellena de forma dinámica el datalist con registros que coincidan con la entrada del usuario.
 */
window.asistirBusquedaManual = function(inputEl) {
  const query = String(inputEl.value || "").trim().toLowerCase();
  const datalist = document.getElementById("buscar-datalist");
  if (!datalist) return;

  datalist.innerHTML = "";
  if (query.length < 2) return; // Mínimo 2 letras

  // Buscar coincidencias parciales en No. INV o Serie del caché de inventario
  const filtrados = window.cacheInventario.filter(function(item) {
    var invMatch = String(item.noInv || "").toLowerCase().indexOf(query) !== -1;
    var serieMatch = String(item.serie || "").toLowerCase().indexOf(query) !== -1;
    return invMatch || serieMatch;
  }).slice(0, 10); // Limitar a las 10 mejores sugerencias

  filtrados.forEach(function(item) {
    const optionNoInv = document.createElement("option");
    optionNoInv.value = item.noInv;
    optionNoInv.innerText = item.descripcion + " (No. INV)";
    datalist.appendChild(optionNoInv);

    if (item.serie && item.serie !== "SIN SERIE" && item.serie !== "S/S") {
      const optionSerie = document.createElement("option");
      optionSerie.value = item.serie;
      optionSerie.innerText = item.descripcion + " (Serie)";
      datalist.appendChild(optionSerie);
    }
  });
};

window.procesarCargaMasiva = function(event) {
  if (event) event.preventDefault();

  const fileInput = document.getElementById("archivo-excel-file");
  const files = fileInput.files;
  if (!files || files.length === 0) {
    alert("Por favor seleccione un archivo.");
    return;
  }

  const file = files[0];
  const opcionDuplicados = document.querySelector('input[name="duplicado-opcion"]:checked').value;

  showLoader("Analizando archivo localmente...");

  const reader = new FileReader();

  if (file.name.endsWith(".csv")) {
    reader.onload = function(e) {
      const text = e.target.result;
      const rows = parsearCSVLocal(text);
      procesarRegistrosMapeados(rows, opcionDuplicados);
    };
    reader.readAsText(file, "UTF-8");
  } else {
    // Es Excel .xlsx
    reader.onload = function(e) {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];

      // Convertir a JSON crudo (todas las filas)
      const rawJson = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
      const rows = mapearColumnasInteligentes(rawJson);

      procesarRegistrosMapeados(rows, opcionDuplicados);
    };
    reader.readAsArrayBuffer(file);
  }
};

/**
 * Parsea un CSV de forma simple respetando comillas.
 */
function parsearCSVLocal(text) {
  const lines = text.split(/\r\n|\n/);
  const result = [];
  if (lines.length === 0) return [];

  // Separar primera fila como cabeceras
  const headers = parsearLineaCSV(lines[0]);

  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const values = parsearLineaCSV(lines[i]);
    const rowObj = {};
    for (let j = 0; j < headers.length; j++) {
      rowObj[headers[j]] = values[j] || "";
    }
    result.push(rowObj);
  }

  // Convertir las cabeceras a la matriz mapeable
  const matrix = [headers];
  result.forEach(function(r) {
    const arr = headers.map(function(h) { return r[h]; });
    matrix.push(arr);
  });

  return mapearColumnasInteligentes(matrix);
}

function parsearLineaCSV(line) {
  const result = [];
  let current = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === ',' && !inQuotes) {
      result.push(current.trim());
      current = "";
    } else {
      current += char;
    }
  }
  result.push(current.trim());
  return result;
}

/**
 * Normaliza textos para comparación flexible de cabeceras de Excel/CSV.
 */
function limpiarLlaveColumna(txt) {
  if (!txt) return "";
  return String(txt).toLowerCase()
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/[^a-z0-9]/g, "")
                    .trim();
}

/**
 * Algoritmo de mapeo inteligente de cabeceras requerido por RF4.
 */
function mapearColumnasInteligentes(matrix) {
  if (matrix.length < 2) return [];

  const cabecerasOriginales = matrix[0];
  const listadoFilasMapeadas = [];

  // Índices mapeados a columnas estándar
  let colIdxNo = -1;
  let colIdxNoInv = -1;
  let colIdxDesc = -1;
  let colIdxSerie = -1;
  let colIdxModelo = -1;
  let colIdxMarca = -1;
  let colIdxEstado = -1;
  let colIdxImporte = -1;
  let colIdxUbicacion = -1;
  let colIdxResguardado = -1;
  let colIdxResguardanteReal = -1;
  let colIdxUbicacionReal = -1;
  let colIdxEstadoReal = -1;
  let colIdxFotoId = -1;

  cabecerasOriginales.forEach(function(header, idx) {
    const norm = limpiarLlaveColumna(header);

    // Validar variantes
    if (norm === "no" || norm === "numero" || norm === "id") {
      colIdxNo = idx;
    } else if (norm === "noinv" || norm === "noinventario" || norm === "numeroinventario" || norm === "etiqueta") {
      colIdxNoInv = idx;
    } else if (norm === "descripcion" || norm === "articulo") {
      colIdxDesc = idx;
    } else if (norm === "serie" || norm === "noserie" || norm === "numerodeserie") {
      colIdxSerie = idx;
    } else if (norm === "modelo") {
      colIdxModelo = idx;
    } else if (norm === "marca") {
      colIdxMarca = idx;
    } else if (norm === "estado" || norm === "estadopatrimonio") {
      colIdxEstado = idx;
    } else if (norm === "importe" || norm === "valor" || norm === "costo") {
      colIdxImporte = idx;
    } else if (norm === "ubicacion") {
      colIdxUbicacion = idx;
    } else if (norm === "resguardado" || norm === "resguardo") {
      colIdxResguardado = idx;
    } else if (norm === "resguardantereal" || norm === "resguardante") {
      colIdxResguardanteReal = idx;
    } else if (norm === "ubicacionreal") {
      colIdxUbicacionReal = idx;
    } else if (norm === "estadoreal") {
      colIdxEstadoReal = idx;
    } else if (norm === "fotoid" || norm === "fotos") {
      colIdxFotoId = idx;
    }
  });

  // Procesar cada fila de datos (partiendo desde index 1)
  for (let r = 1; r < matrix.length; r++) {
    const fila = matrix[r];
    // Evitar procesar filas totalmente vacías
    if (!fila || fila.length === 0 || (fila.length === 1 && !fila[0])) continue;

    const objMapeado = {
      "No.": colIdxNo !== -1 ? fila[colIdxNo] : "",
      "No. INV.": colIdxNoInv !== -1 ? String(fila[colIdxNoInv] || "").trim() : "",
      "DESCRIPCION": colIdxDesc !== -1 ? fila[colIdxDesc] : "",
      "SERIE": colIdxSerie !== -1 ? fila[colIdxSerie] : "SIN SERIE",
      "MODELO": colIdxModelo !== -1 ? fila[colIdxModelo] : "",
      "MARCA": colIdxMarca !== -1 ? fila[colIdxMarca] : "",
      "ESTADO": colIdxEstado !== -1 ? fila[colIdxEstado] : "BUENO",
      "IMPORTE": colIdxImporte !== -1 ? fila[colIdxImporte] : 0,
      "UBICACION": colIdxUbicacion !== -1 ? fila[colIdxUbicacion] : "",
      "RESGUARDADO": colIdxResguardado !== -1 ? fila[colIdxResguardado] : "",
      "RESGUARDANTE_REAL": colIdxResguardanteReal !== -1 ? fila[colIdxResguardanteReal] : "",
      "UBICACION_REAL": colIdxUbicacionReal !== -1 ? fila[colIdxUbicacionReal] : "",
      "ESTADO_REAL": colIdxEstadoReal !== -1 ? fila[colIdxEstadoReal] : "",
      "FOTO_ID": colIdxFotoId !== -1 ? fila[colIdxFotoId] : ""
    };

    listadoFilasMapeadas.push(objMapeado);
  }

  return listadoFilasMapeadas;
}

/**
 * Envía el lote estructurado al servidor para guardado optimizado en GAS.
 */
function procesarRegistrosMapeados(rows, opcionDuplicados) {
  if (rows.length === 0) {
    hideLoader();
    alert("No se encontraron registros válidos o mapeables en el archivo.");
    return;
  }

  showLoader("Subiendo lote al servidor de Google Sheets...");

  google.script.run
    .withSuccessHandler(function(res) {
      hideLoader();
      if (res.success) {
        mostrarNotificacion("¡Carga masiva completada exitosamente!", "bg-success");

        // Renderizar resumen en el cliente
        document.getElementById("resultado-carga-container").classList.remove("d-none");
        document.getElementById("res-carga-nuevos").innerText = res.nuevos;
        document.getElementById("res-carga-actualizados").innerText = res.actualizados;
        document.getElementById("res-carga-omitidos").innerText = res.omitidos;
        document.getElementById("res-carga-errores").innerText = res.errores;

        // Limpiar formulario de archivo
        document.getElementById("archivo-excel-file").value = "";

        // Recargar listado completo y estadísticas
        cargarListadoInventario();
        cargarEstadisticasInicio();
      } else {
        alert("Fallo al procesar lote: " + res.message);
      }
    })
    .withFailureHandler(function(err) {
      hideLoader();
      alert("Error en el servidor de Google Sheets: " + err.message);
    })
    .importarDatosExcel(rows, opcionDuplicados);
}

/**
 * Realiza el filtrado de inventario de forma de alto rendimiento en el servidor (Error 4).
 * Si no se salta la petición, solicita la lista filtrada a Google Sheets, de lo contrario renderiza.
 */
window.aplicarFiltrosYListar = function(skipServerQuery) {
  if (!skipServerQuery) {
    cargarListadoInventario();
    return;
  }

  const totalRegistros = window.cacheInventario.length;
  const totalPaginas = Math.ceil(totalRegistros / REGISTROS_POR_PAGINA) || 1;

  if (window.paginaActual > totalPaginas) {
    window.paginaActual = totalPaginas;
  }

  const inicioIdx = (window.paginaActual - 1) * REGISTROS_POR_PAGINA;
  const finIdx = Math.min(inicioIdx + REGISTROS_POR_PAGINA, totalRegistros);

  const paginaItems = window.cacheInventario.slice(inicioIdx, finIdx);

  console.log("[SMR] aplicando filtros en cliente. Registros en página:", paginaItems.length, "Total:", totalRegistros);

  // Renderizar filas de la tabla primero
  renderizarTablaListado(paginaItems);

  // Renderizar barra de control del paginador después (garantizando DOM listo)
  renderizarPaginadorUI(totalRegistros, totalPaginas, inicioIdx, finIdx);
};

function renderizarPaginadorUI(totalRegistros, totalPaginas, inicioIdx, finIdx) {
  const infoText = document.getElementById("paginacion-info-text");
  if (infoText) {
    infoText.innerText = `Mostrando ${totalRegistros === 0 ? 0 : inicioIdx + 1} a ${finIdx} de ${totalRegistros} registros`;
  } else {
    console.warn("Paginador info text: elemento no encontrado");
  }

  // Corregido: ID exacto 'paginador-ul' de Index.html en vez de 'pagador-ul' (Error 1)
  const ul = document.getElementById("paginador-ul");
  if (!ul) {
    console.warn("Paginador: elemento <ul> con id 'paginador-ul' no encontrado en el DOM, omitiendo renderizado (Error 1)");
    return;
  }
  ul.innerHTML = "";

  // Botón Anterior
  const liPrev = document.createElement("li");
  liPrev.className = "page-item " + (window.paginaActual === 1 ? "disabled" : "");
  liPrev.innerHTML = `<a class="page-link" onclick="window.cambiarPagina(${window.paginaActual - 1})">Anterior</a>`;
  ul.appendChild(liPrev);

  // Limitar número de páginas visibles (máximo 5 páginas)
  let startPage = Math.max(1, window.paginaActual - 2);
  let endPage = Math.min(totalPaginas, startPage + 4);
  if (endPage - startPage < 4) {
    startPage = Math.max(1, endPage - 4);
  }

  for (let p = startPage; p <= endPage; p++) {
    const liPage = document.createElement("li");
    liPage.className = "page-item " + (p === window.paginaActual ? "active" : "");
    liPage.innerHTML = `<a class="page-link" onclick="window.cambiarPagina(${p})">${p}</a>`;
    ul.appendChild(liPage);
  }

  // Botón Siguiente
  const liNext = document.createElement("li");
  liNext.className = "page-item " + (window.paginaActual === totalPaginas ? "disabled" : "");
  liNext.innerHTML = `<a class="page-link" onclick="window.cambiarPagina(${window.paginaActual + 1})">Siguiente</a>`;
  ul.appendChild(liNext);
}

window.cambiarPagina = function(p) {
  window.paginaActual = p;
  window.aplicarFiltrosYListar();
};

        <p class="mb-2"><strong>Serie:</strong> ${item.serie || "SIN SERIE"}</p>
        <p class="mb-2"><strong>Modelo:</strong> ${item.modelo || ""}</p>
        <p class="mb-2"><strong>Marca:</strong> ${item.marca || ""}</p>
        <p class="mb-2"><strong>Importe:</strong> ${item.importe ? "$" + parseFloat(item.importe).toFixed(2) : "$0.00"}</p>
        <p class="mb-2"><strong>Estado original:</strong> ${item.estado || "BUENO"}</p>
        <p class="mb-2"><strong>Ubicación original:</strong> ${item.ubicacion || ""}</p>
        <p class="mb-0"><strong>Resguardante original:</strong> ${item.resguardado || ""}</p>
      </div>
      <div class="col-12 col-md-6">
        <h6 class="fw-bold text-success mb-3"><i class="fa-solid fa-check-double me-1"></i> Información del Levantamiento</h6>
        <p class="mb-2"><strong>Estado Físico Actual:</strong> <span class="badge ${item.estadoReal === 'Bueno' ? 'badge-bueno' : (item.estadoReal === 'Regular' ? 'badge-regular' : (item.estadoReal === 'Malo' ? 'badge-malo' : 'badge-baja'))}">${item.estadoReal || "Pendiente"}</span></p>
        <p class="mb-2"><strong>Ubicación Real:</strong> ${item.ubicacionReal || "<span class='text-muted'>Pendiente de levantamiento</span>"}</p>
        <p class="mb-2"><strong>Resguardante Real:</strong> ${item.resguardanteReal || "<span class='text-muted'>Pendiente de levantamiento</span>"}</p>
        <p class="mb-2"><strong>Última Actualización:</strong> ${item.ultimaActualizacion ? formatearFecha(item.ultimaActualizacion) : "Sin registros"}</p>
        <p class="mb-4"><strong>Último Operador:</strong> ${item.usuarioOperador || "Sin registrar"}</p>

        <h6 class="fw-bold text-success border-top pt-3 mb-3"><i class="fa-solid fa-camera me-1"></i> Evidencia Fotográfica</h6>
        <div class="row g-2">
          ${fotosHtml}
        </div>
      </div>
    </div>
  `;

  const modal = new bootstrap.Modal(modalEl);
  modal.show();
};

function formatearFecha(fechaSerial) {
  if (!fechaSerial) return "";
  try {
    const d = new Date(fechaSerial);
    if (isNaN(d.getTime())) return String(fechaSerial);
    const pad = function(n) { return n < 10 ? '0' + n : n; };
    return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() + " " +
           pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  } catch(e) {
    return String(fechaSerial);
  }
}

window.guardarEdicionCompleta = function(event) {
  if (event) event.preventDefault();

  const noInv = document.getElementById("modal-edit-no-inv-hidden").value;
  showLoader("Actualizando artículo en lote...");

  // Agrupamos todos los campos para enviarlos de golpe
  const datos = {
    noInv: noInv,
    descripcion: document.getElementById("modal-edit-descripcion").value.trim(),
    resguardado: document.getElementById("modal-edit-resguardado").value.trim(),
    serie: document.getElementById("modal-edit-serie").value.trim(),
    modelo: document.getElementById("modal-edit-modelo").value.trim(),
    marca: document.getElementById("modal-edit-marca").value.trim(),
    estado: document.getElementById("modal-edit-estado").value.trim(),
    importe: parseFloat(document.getElementById("modal-edit-importe").value) || 0,
    ubicacion: document.getElementById("modal-edit-ubicacion").value.trim(),
    estadoReal: document.getElementById("modal-edit-estado-real").value,
    ubicacionReal: document.getElementById("modal-edit-ubicacion-real").value.trim(),
    resguardanteReal: document.getElementById("modal-edit-resguardante-real").value.trim()
  };

  // Usamos el importador en modo sobrescribir como DRY helper seguro para actualizar campos
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        // Subir fotos adicionales si existen
        const fileInput = document.getElementById("modal-edit-fotos-files");
        if (fileInput.files && fileInput.files.length > 0) {
          subirFotosDeFrente(noInv, fileInput.files, function() {
            completarExitoEdicion();
          });
        } else {
          completarExitoEdicion();
        }
      } else {
        hideLoader();
        alert("Fallo al actualizar: " + res.message);
      }
    })
    .withFailureHandler(function(err) {
      hideLoader();
      mostrarNotificacion("Fallo de red al conectar.", "bg-danger");
    })
    .importarDatosExcel([datos], "actualizar");
};

function completarExitoEdicion() {
  mostrarNotificacion("Artículo actualizado correctamente.", "bg-success");

  // Cerrar modal
  const modalEl = document.getElementById("modal-editar-articulo");
  const modal = bootstrap.Modal.getInstance(modalEl);
  if (modal) modal.hide();

  cargarListadoInventario(function() {
    cargarEstadisticasInicio();
    hideLoader();
  });
}

window.guardarTrasladoArticulo = function(event) {
  if (event) event.preventDefault();

  const noInv = document.getElementById("modal-traslado-no-inv").value;
  const ubicacion = document.getElementById("modal-traslado-ubicacion").value.trim();
  const resguardante = document.getElementById("modal-traslado-resguardante").value.trim();
  const motivo = document.getElementById("modal-traslado-motivo").value.trim();

  if (!ubicacion || !resguardante || !motivo) {
    alert("Por favor complete todos los campos obligatorios (*)");
    return;
  }

  showLoader("Registrando traslado...");

  const datos = {
    ubicacionReal: ubicacion,
    resguardanteReal: resguardante,
    motivo: motivo
  };

  google.script.run
    .withSuccessHandler(function(res) {
      hideLoader();
      if (res.success) {
        mostrarNotificacion("¡Traslado registrado y guardado!", "bg-success");

        // Cerrar modal
        const modalEl = document.getElementById("modal-trasladar");
        const modal = bootstrap.Modal.getInstance(modalEl);
        if (modal) modal.hide();

        // Recargar inventario
        cargarListadoInventario();
      } else {
        alert("Fallo al registrar traslado: " + res.message);
      }
    })
    .withFailureHandler(function(err) {
      hideLoader();
      mostrarNotificacion("Fallo de red: " + err.message, "bg-danger");
    })
    .registrarTraslado(noInv, datos);
};

window.subirNuevasFotosModal = function() {
  const noInv = document.getElementById("modal-fotos-no-inv").value;
  const fileInput = document.getElementById("modal-fotos-nuevas-input");

  if (!fileInput.files || fileInput.files.length === 0) {
    alert("Por favor seleccione al menos una foto para subir.");
    return;
  }

  showLoader("Subiendo fotografías...");

  subirFotosDeFrente(noInv, fileInput.files, function() {
    mostrarNotificacion("Fotos agregadas correctamente.", "bg-success");

    // Recargar inventario local para refrescar fotos en el modal
    cargarListadoInventario(function() {
      hideLoader();

      const actualItem = window.cacheInventario.find(function(i) {
        return String(i.noInv).trim().toLowerCase() === String(noInv).trim().toLowerCase();
      });
      if (actualItem) {
        renderizarFotosExistentes(actualItem.fotoId, actualItem.noInv, "modal-fotos-existentes-list", null);
      }

      fileInput.value = "";
      document.getElementById("modal-fotos-nuevas-preview").innerHTML = "";
    });
  });
};

/**
 * Generador de QR imprimible / descargable integrado en cliente (RF5).
 * El QR codifica exclusivamente el No. INV.
 * Con propiedades camelCase normalizadas para resolver Error 3.
 */
window.abrirGeneradorQR = function(noInv) {
  const item = window.cacheInventario.find(function(i) {
    return String(i.noInv).trim().toLowerCase() === String(noInv).trim().toLowerCase();
  });

  if (!item) return;

  document.getElementById("qr-modal-no-inv-title").innerText = "No. INV: " + item.noInv;
  document.getElementById("qr-modal-desc-title").innerText = item.descripcion || "";

  const container = document.getElementById("qr-code-img-container");
  container.innerHTML = "";

  // Instanciar qrcode.js en cliente para generación offline rápida y confiable
  try {
    new QRCode(container, {
      text: String(item.noInv || "").trim(),
      width: 180,
      height: 180,
      colorDark : "#000000",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });
  } catch(e) {
    console.error("Fallo al generar QR con qrcode.js, recurriendo a Google Charts API:", e);
    const imgFallback = document.createElement("img");
    imgFallback.src = "https://chart.googleapis.com/chart?cht=qr&chs=180x180&chl=" + encodeURIComponent(item.noInv);
    imgFallback.alt = "Código QR de bien";
    container.appendChild(imgFallback);
  }

  const modal = new bootstrap.Modal(document.getElementById("modal-qr"));
  modal.show();
};
</script>
