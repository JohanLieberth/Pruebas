<div class="row mb-4">
  <div class="col">
    <h2 class="fw-bold text-navy">Registrar Pago (Anticipo / Abono)</h2>
    <p class="text-muted">Busque una venta para registrar un nuevo ingreso.</p>
  </div>
</div>

<!-- Contenedores OBLIGATORIOS para manejo de estados -->
<div id="mensaje-error" style="display: none;" class="mb-4"></div>

<div class="row">
  <div class="col-lg-12 mb-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <label class="form-label fw-bold">Filtrar Venta (Folio o Cliente)</label>
        <div class="input-group mb-3">
          <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
          <input type="text" id="busqueda" class="form-control border-start-0" placeholder="Escriba para filtrar..." oninput="filtrarVentasLocal()">
        </div>

        <div id="listado-ventas" class="mt-3">
          <div class="text-center p-3">
            <div class="spinner-border spinner-border-sm text-primary"></div>
            <div class="mt-2 small text-muted">Cargando catálogo de ventas...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-lg-6">

    <div id="contenedor-pago" style="display:none;">
      <div class="card shadow-sm border-top border-4 border-navy">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-4">Datos del Pago: <span id="span-folio" class="text-navy"></span></h5>
          <form id="formPago" onsubmit="event.preventDefault(); guardarPago();">
            <input type="hidden" name="folio" id="input-folio">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-bold">Tipo de Pago</label>
                <select class="form-select" name="tipo" required>
                  <option value="Abono">Abono</option>
                  <option value="Anticipo">Anticipo</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">Monto ($)</label>
                <input type="number" step="0.01" class="form-control" name="monto" id="input-monto" required min="0.01">
                <div class="form-text">Saldo pendiente: <span id="saldo-max" class="fw-bold"></span></div>
              </div>
              <div class="col-12">
                <label class="form-label fw-bold">Fecha de Pago</label>
                <input type="date" class="form-control" name="fecha" required id="fecha-hoy">
              </div>
              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-navy text-white px-5 w-100 py-3" id="btnGuardarPago">
                  <i class="fas fa-check-circle me-2"></i>Registrar y Generar Recibo PDF
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="col-lg-6">
    <div id="detalle-venta" style="display:none;">
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-navy text-white">
          <h6 class="mb-0">Resumen de la Venta</h6>
        </div>
        <div class="card-body">
          <table class="table table-sm">
            <tr><th width="40%">Cliente:</th><td id="td-cliente"></td></tr>
            <tr><th>Hotel/Paquete:</th><td id="td-hotel"></td></tr>
            <tr><th>Total Venta:</th><td id="td-total"></td></tr>
            <tr><th>Total Cobrado:</th><td id="td-cobrado" class="text-success fw-bold"></td></tr>
            <tr><th>Saldo:</th><td id="td-saldo" class="text-danger fw-bold"></td></tr>
            <tr><th>Agente:</th><td id="td-agente"></td></tr>
          </table>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-header bg-light">
          <h6 class="mb-0">Historial de Pagos</h6>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
              <thead class="small text-muted">
                <tr>
                  <th>Fecha</th>
                  <th>Monto</th>
                  <th>Tipo</th>
                </tr>
              </thead>
              <tbody id="tbody-historial">
                <!-- Se llena dinámicamente -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let todasLasVentas = [];
  let timeoutFiltrado = null;

  /**
   * Ejecutar al cargar la página para cumplimiento de requerimientos SPA y DOM.
   */
  document.addEventListener('DOMContentLoaded', cargarVentasAlInicio);

  function inicializarRegistrarPago() {
    cargarVentasAlInicio();
  }

  /**
   * PASO 2: Función del Cliente - CARGA INICIAL
   */
  function cargarVentasAlInicio() {
    console.log("Cliente: [LOG] Iniciando cargarVentasAlInicio...");
    const errorCont = document.getElementById('mensaje-error');
    const listCont = document.getElementById('listado-ventas');

    // Resetear estados
    if (errorCont) errorCont.style.display = 'none';
    if (listCont) listCont.innerHTML = '<div class="text-center p-3"><div class="spinner-border spinner-border-sm text-primary"></div><div class="mt-2 small text-muted">Cargando...</div></div>';

    google.script.run
      .withSuccessHandler(function(respuesta) {
        console.log("Cliente: [LOG] Respuesta recibida:", respuesta);

        // VALIDACIÓN 1: ¿La respuesta existe?
        if (!respuesta) {
          console.error("Cliente: [ERROR] La respuesta es null o undefined");
          mostrarError("Error al cargar ventas: Respuesta vacía");
          return;
        }

        // VALIDACIÓN 2: ¿Tiene la propiedad status?
        if (!respuesta.status) {
          console.error("Cliente: [ERROR] La respuesta no tiene propiedad 'status':", respuesta);
          mostrarError("Error al cargar ventas: Formato de respuesta inválido");
          return;
        }

        // Manejar según status retornado por el servidor
        if (respuesta.status === "success") {
          todasLasVentas = respuesta.data || [];
          if (todasLasVentas.length > 0) {
            mostrarListadoVentas(todasLasVentas);
          } else {
            mostrarMensaje("No hay ventas con saldo pendiente.");
          }
        } else if (respuesta.status === "error") {
          mostrarError(respuesta.message || "Error desconocido en el servidor.");
        }
      })
      .withFailureHandler(function(error) {
        console.error("Cliente: [ERROR] Fallo crítico en comunicación:", error);
        mostrarError("Error de comunicación con el servidor: " + (error.message || "Error desconocido"));
      })
      .obtenerVentasConSaldo(""); // Nombre EXACTO de la función en Ventas.gs
  }

  function filtrarVentasLocal() {
    clearTimeout(timeoutFiltrado);
    const q = document.getElementById('busqueda').value.toLowerCase();

    if (!q) {
      mostrarListadoVentas(todasLasVentas);
      return;
    }

    timeoutFiltrado = setTimeout(() => {
      console.log("Cliente: [LOG] Filtrando localmente por: " + q);
      const filtradas = todasLasVentas.filter(v => {
        const folio = (v.folio || "").toLowerCase();
        const cliente = (v.cliente || "").toLowerCase();
        return folio.includes(q) || cliente.includes(q);
      });
      mostrarListadoVentas(filtradas);
    }, 300);
  }

  /**
   * Genera el listado visual de ventas siguiendo el formato exacto solicitado.
   */
  function mostrarListadoVentas(ventas) {
    const container = document.getElementById('listado-ventas');
    if (!container) return;

    const hoy = new Date();
    hoy.setHours(0,0,0,0);
    const tresDias = new Date();
    tresDias.setDate(hoy.getDate() + 3);

    let html = `
      <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
        <table class="table table-sm table-hover border align-middle shadow-sm">
          <thead class="bg-navy text-white sticky-top">
            <tr class="small text-uppercase">
              <th>FOLIO/CONCEPTO</th>
              <th>CLIENTE</th>
              <th>TOTAL</th>
              <th>FECHA LÍMITE</th>
              <th>ANTICIPO</th>
              <th>SALDO</th>
              <th>ESTADO</th>
              <th class="text-center">ACCIÓN</th>
            </tr>
          </thead>
          <tbody class="small">
    `;

    html += ventas.map(v => {
      // Parsear fecha string dd/MM/yyyy para lógica de colores
      let fechaObj = null;
      if (v.fechaLimite && v.fechaLimite.includes('/')) {
        const p = v.fechaLimite.split('/');
        fechaObj = new Date(p[2], p[1] - 1, p[0]);
      }

      let alertaClase = "";
      if (fechaObj) {
        fechaObj.setHours(0,0,0,0);
        if (fechaObj < hoy) alertaClase = "text-danger fw-bold";
        else if (fechaObj <= tresDias) alertaClase = "text-warning fw-bold";
      }

      return `
        <tr>
          <td class="fw-bold text-navy">${v.folio || '-'}</td>
          <td>${v.cliente || '-'}</td>
          <td>${formatCurrency(v.total)}</td>
          <td class="${alertaClase}">${v.fechaLimite || '-'}</td>
          <td>${formatCurrency(v.anticipo)}</td>
          <td class="${alertaClase} fw-bold">${formatCurrency(v.saldo)}</td>
          <td><span class="badge rounded-pill bg-light text-dark border">${v.estado || 'Pendiente'}</span></td>
          <td class="text-center">
            <button class="btn btn-sm btn-navy py-0 px-3" onclick='intentarSeleccionarVenta(${JSON.stringify(v).replace(/'/g, "&apos;")})'>
              Registrar Pago
            </button>
          </td>
        </tr>
      `;
    }).join('');

    html += '</tbody></table></div>';
    container.innerHTML = html;
  }

  function mostrarError(mensaje) {
    const cont = document.getElementById('mensaje-error');
    if (cont) {
      cont.innerHTML = `<div class="alert alert-danger shadow-sm"><i class="fas fa-exclamation-circle me-2"></i><strong>Error:</strong> ${mensaje}</div>`;
      cont.style.display = 'block';
    }
    const listCont = document.getElementById('listado-ventas');
    if (listCont) listCont.innerHTML = "";
  }

  function mostrarMensaje(mensaje) {
    const cont = document.getElementById('listado-ventas');
    if (cont) {
      cont.innerHTML = `<div class="alert alert-info shadow-sm"><i class="fas fa-info-circle me-2"></i>${mensaje}</div>`;
    }
  }

  function intentarSeleccionarVenta(v) {
    try {
      seleccionarVenta(v);
    } catch (e) {
      console.error("Error al seleccionar venta:", e);
      alert("Hubo un problema al cargar los detalles de la venta seleccionada.");
      // Asegurarse de ocultar si falló
      document.getElementById('contenedor-pago').style.display = 'none';
      document.getElementById('detalle-venta').style.display = 'none';
    }
  }

  function seleccionarVenta(v) {
    if (!v) throw new Error("Venta inválida seleccionada");

    document.getElementById('contenedor-pago').style.display = 'block';
    document.getElementById('detalle-venta').style.display = 'block';

    const listCont = document.getElementById('listado-ventas');
    if (listCont) listCont.innerHTML = '';

    // Cargar Historial
    const folio = v['folio/concepto'];
    google.script.run
      .withSuccessHandler(res => {
        const tbody = document.getElementById('tbody-historial');

        if (!res || res.status === "error") {
          tbody.innerHTML = `<tr><td colspan="3" class="text-center py-3 text-danger">Error al cargar historial: ${res ? res.message : "Sin respuesta"}</td></tr>`;
          return;
        }

        const historial = res.data;
        if (!historial || historial.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" class="text-center py-3">Sin pagos registrados</td></tr>';
        } else {
          tbody.innerHTML = historial.map(h => `
            <tr>
              <td>${new Date(h.fecha).toLocaleDateString()}</td>
              <td>${formatCurrency(h.monto_pagado || h.monto)}</td>
              <td><span class="badge bg-light text-dark">${h.metodo || h.tipo}</span></td>
            </tr>
          `).join('');
        }
      })
      .withFailureHandler(err => {
        document.getElementById('tbody-historial').innerHTML = `<tr><td colspan="3" class="text-center py-3 text-danger">Fallo de conexión: ${err.message}</td></tr>`;
      })
      .obtenerHistorialPagos(folio);

    document.getElementById('span-folio').innerText = v['folio/concepto'];
    document.getElementById('input-folio').value = v['folio/concepto'];
    document.getElementById('input-monto').max = v.saldo;
    document.getElementById('saldo-max').innerText = formatCurrency(v.saldo);

    document.getElementById('td-cliente').innerText = v.cliente;
    document.getElementById('td-hotel').innerText = v.hotel;
    document.getElementById('td-total').innerText = formatCurrency(v.total);
    document.getElementById('td-cobrado').innerText = formatCurrency(v.total_cobrado || v.cobrado || 0);
    document.getElementById('td-saldo').innerText = formatCurrency(v.saldo);
    document.getElementById('td-agente').innerText = v.agente;

    document.getElementById('fecha-hoy').valueAsDate = new Date();
  }

  function guardarPago() {
    const btn = document.getElementById('btnGuardarPago');
    const monto = parseFloat(document.getElementById('input-monto').value);
    const max = parseFloat(document.getElementById('input-monto').max);

    if (monto > max) {
      alert('El monto del pago no puede exceder el saldo pendiente de ' + formatCurrency(max));
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Registrando...';
    toggleLoading(true);

    const form = document.getElementById('formPago');
    const formData = {
      folio: form.folio.value,
      tipo: form.tipo.value,
      monto: form.monto.value,
      fecha: form.fecha.value
    };

    google.script.run
      .withSuccessHandler(res => {
        toggleLoading(false);

        if (!res || res.status === "error") {
          alert('Error: ' + (res ? res.message : "El servidor devolvió una respuesta vacía."));
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-check-circle me-2"></i>Registrar y Generar Recibo PDF';
          return;
        }

        if (res.status === "success") {
          alert(res.message || 'Pago registrado correctamente.');
          if (confirm('¿Desea imprimir el recibo?')) {
            imprimirRecibo(res.data);
          }
          if (res.pdfUrl && res.pdfUrl !== "#") {
            window.open(res.pdfUrl, '_blank');
          }
          // Resetear vista y recargar catálogo
          document.getElementById('contenedor-pago').style.display = 'none';
          document.getElementById('detalle-venta').style.display = 'none';
          document.getElementById('busqueda').value = '';
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-check-circle me-2"></i>Registrar y Generar Recibo PDF';
          cargarVentasAlInicio();
        }
      })
      .withFailureHandler(err => {
        toggleLoading(false);
        alert('Fallo de conexión: ' + err.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check-circle me-2"></i>Registrar y Generar Recibo PDF';
      })
      .registrarPago(formData);
  }
</script>
