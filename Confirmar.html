<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <?!= include('CSS'); ?>
  </head>
  <body>
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div class="container py-5 text-center">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card p-5 shadow">
            <i class="fas fa-check-circle fa-5x text-success mb-4"></i>
            <h2 class="mb-3">¡Confirmación Exitosa!</h2>
            <p class="lead mb-4">Gracias por confirmarnos que vendrás a recoger tu equipo con folio <b><?= data.folio ?></b>.</p>
            <p>Te esperamos en nuestro taller en el horario de atención habitual.</p>
            <div id="statusMsg" class="mt-4"></div>
          </div>
        </div>
      </div>
    </div>

    <?!= include('JS'); ?>
    <script>
      window.addEventListener('load', function() {
        inicializarTema();
        confirmar();
      });

      function confirmar() {
        const folio = '<?= data.folio ?>';
        google.script.run
          .withSuccessHandler(function(res) {
            document.getElementById('statusMsg').innerHTML = '<div class="alert alert-info">Tu visita ha sido registrada.</div>';
          })
          .withFailureHandler(function(err) {
            console.error(err);
          })
          .confirmarRecoleccion(folio);
      }
    </script>
  </body>
</html>
