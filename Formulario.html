<div class="card">
  <h2>Nueva Venta</h2>
  <form id="ventaForm">
    <div class="grid">
      <div class="form-group">
        <label for="vendedor">Vendedor *</label>
        <select id="vendedor" name="vendedor" class="form-control" required>
          <option value="">Seleccione...</option>
          <? var vendedores = getVendedores(); ?>
          <? for(var i=0; i<vendedores.length; i++) { ?>
            <option value="<?= vendedores[i] ?>"><?= vendedores[i] ?></option>
          <? } ?>
        </select>
      </div>
      <div class="form-group">
        <label for="folio">Folio / Concepto *</label>
        <input type="text" id="folio" name="folio" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="cliente">Cliente *</label>
        <input type="text" id="cliente" name="cliente" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="hotel">Hotel *</label>
        <input type="text" id="hotel" name="hotel" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="total">Total ($) *</label>
        <input type="number" id="total" name="total" step="0.01" min="0.01" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="fechaLimite">Fecha Límite de Pago *</label>
        <input type="date" id="fechaLimite" name="fechaLimite" class="form-control" required>
      </div>
    </div>

    <hr>
    <h3>Pagos y Abonos (Opcional)</h3>
    <div class="grid">
      <div class="form-group">
        <label for="anticipo">Anticipo</label>
        <input type="number" id="anticipo" name="anticipo" step="0.01" class="form-control">
      </div>
      <div class="form-group">
        <label for="fechaAnticipo">Fecha Anticipo</label>
        <input type="date" id="fechaAnticipo" name="fechaAnticipo" class="form-control">
      </div>
      <div class="form-group">
        <label for="abono1">Abono 1</label>
        <input type="number" id="abono1" name="abono1" step="0.01" class="form-control">
      </div>
      <div class="form-group">
        <label for="fechaAbono1">Fecha Abono 1</label>
        <input type="date" id="fechaAbono1" name="fechaAbono1" class="form-control">
      </div>
      <div class="form-group">
        <label for="abono2">Abono 2</label>
        <input type="number" id="abono2" name="abono2" step="0.01" class="form-control">
      </div>
      <div class="form-group">
        <label for="fechaAbono2">Fecha Abono 2</label>
        <input type="date" id="fechaAbono2" name="fechaAbono2" class="form-control">
      </div>
      <div class="form-group">
        <label for="abono3">Abono 3</label>
        <input type="number" id="abono3" name="abono3" step="0.01" class="form-control">
      </div>
      <div class="form-group">
        <label for="fechaAbono3">Fecha Abono 3</label>
        <input type="date" id="fechaAbono3" name="fechaAbono3" class="form-control">
      </div>
    </div>

    <div style="margin-top: 20px; text-align: right;">
      <button type="submit" class="btn btn-primary" id="btnGuardar">Registrar Venta</button>
    </div>
  </form>
</div>

<script>
  document.getElementById('ventaForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('btnGuardar');
    btn.disabled = true;
    btn.innerText = 'Guardando...';

    var formData = {
      vendedor: document.getElementById('vendedor').value,
      folio: document.getElementById('folio').value,
      cliente: document.getElementById('cliente').value,
      hotel: document.getElementById('hotel').value,
      total: document.getElementById('total').value,
      fechaLimite: document.getElementById('fechaLimite').value,
      anticipo: document.getElementById('anticipo').value,
      fechaAnticipo: document.getElementById('fechaAnticipo').value,
      abono1: document.getElementById('abono1').value,
      fechaAbono1: document.getElementById('fechaAbono1').value,
      abono2: document.getElementById('abono2').value,
      fechaAbono2: document.getElementById('fechaAbono2').value,
      abono3: document.getElementById('abono3').value,
      fechaAbono3: document.getElementById('fechaAbono3').value
    };

    google.script.run
      .withSuccessHandler(function(response) {
        alert(response.message);
        document.getElementById('ventaForm').reset();
        btn.disabled = false;
        btn.innerText = 'Registrar Venta';
      })
      .withFailureHandler(function(err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
        btn.innerText = 'Registrar Venta';
      })
      .registrarVenta(formData);
  });
</script>
