    <script>
      let currentAppConfig = null;

      // Manejador global de errores para depuración
      window.onerror = function(msg, url, line, col, error) {
        console.error("Error Global:", msg, "en", url, ":", line);
        toggleLoading(false);
        return false;
      };

      window.onload = () => {
        console.log("Iniciando aplicación...");
        toggleLoading(true);
        google.script.run
          .withSuccessHandler(config => {
            currentAppConfig = config;
            inicializarSelectsAgentes();
            cargarPagina("<?= page ?>");
            // Nota: toggleLoading(false) se maneja dentro de cargarPagina o sus inicializadores
          })
          .withFailureHandler(err => {
            console.error("Error al cargar config:", err);
            alert("Error de conexión con el servidor. Intente recargar.");
            toggleLoading(false);
          })
          .getAppConfig();
      };

      function cargarPagina(pageId) {
        console.log("Solicitud cargarPagina:", pageId);
        toggleLoading(true);

        // Ocultar todas las páginas
        document.querySelectorAll('.page-container').forEach(el => el.style.display = 'none');
        document.querySelectorAll('#menu .nav-link').forEach(el => el.classList.remove('active-link'));

        // Normalización y mapeo de IDs de página
        const pageMapping = {
          'Dashboard': 'Dashboard',
          'NuevaVenta': 'NuevaVenta',
          'Nueva venta': 'NuevaVenta',
          'RegistrarPago': 'RegistrarPago',
          'Registrar Pago': 'RegistrarPago',
          'Registro de pago': 'RegistrarPago',
          'Estadisticas': 'Estadisticas',
          'Reporte': 'Estadisticas',
          'Reportes': 'Estadisticas'
        };

        const technicalId = pageMapping[pageId] || pageId;
        console.log("ID técnico detectado:", technicalId);

        // Mostrar la seleccionada
        const targetPage = document.getElementById('page-' + technicalId);
        if (targetPage) {
          targetPage.style.display = 'block';

          // Actualizar link de navegación
          const link = document.getElementById('link-' + technicalId);
          if (link) link.classList.add('active-link');

          // Inicializadores específicos
          try {
            if (technicalId === 'Dashboard') {
              if (typeof inicializarDashboard === 'function') {
                inicializarDashboard();
              } else {
                console.warn("inicializarDashboard no definida");
                toggleLoading(false);
              }
            } else if (technicalId === 'Estadisticas') {
              if (typeof inicializarReportes === 'function') {
                inicializarReportes();
              } else {
                console.warn("inicializarReportes no definida");
                toggleLoading(false);
              }
            } else {
              // Páginas estáticas o sin init
              console.log("Página sin inicializador dinámico:", technicalId);
              setTimeout(() => toggleLoading(false), 200);
            }
          } catch (e) {
            console.error("Error ejecutando inicializador de " + technicalId, e);
            toggleLoading(false);
          }
        } else {
          console.error("No existe el contenedor para la página:", technicalId);
          toggleLoading(false);
          // Prevenir bucle infinito si Dashboard no existe
          if (technicalId !== 'Dashboard') {
            cargarPagina('Dashboard');
          }
        }
      }

      function inicializarSelectsAgentes() {
        if (!currentAppConfig) return;
        const selects = document.querySelectorAll('select[name="agente"], #filtro-agente');
        selects.forEach(select => {
          const isFiltro = select.id === 'filtro-agente';
          let html = isFiltro ? '<option value="Global">Vista Global</option>' : '<option value="">Seleccione...</option>';
          currentAppConfig.AGENTES_PERMITIDOS.forEach(agente => {
            html += `<option value="${agente}">${agente}</option>`;
          });
          select.innerHTML = html;
        });
      }

      function formatCurrency(amount) {
        return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(amount || 0);
      }

      function toggleLoading(show) {
        document.getElementById('loading-overlay').style.display = show ? 'block' : 'none';
      }
    </script>
