    <script>
      window.addEventListener('load', function() {
        cargarConfig();
      });

      function cargarConfig() {
        google.script.run
          .withSuccessHandler(function(config) {
            if (config["Logo Principal"]) {
              document.getElementById('mainLogo').src = config["Logo Principal"];
              document.getElementById('mainLogo').style.display = 'inline-block';
              document.getElementById('welcomeText').style.display = 'none';
            }
            if (config["Logo Pequeño"]) {
              document.getElementById('headerLogo').src = config["Logo Pequeño"];
              document.getElementById('headerLogo').style.display = 'inline-block';
              document.getElementById('systemName').style.display = 'none';
            }
            if (config["URL_Video_Promocional"]) {
              const videoUrl = config["URL_Video_Promocional"];
              const videoContainer = document.getElementById('videoContainer');
              const playerDiv = document.getElementById('videoPlayer');

              videoContainer.classList.remove('d-none');

              if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be')) {
                let videoId = '';
                if (videoUrl.includes('v=')) {
                  videoId = videoUrl.split('v=')[1].split('&')[0];
                } else if (videoUrl.includes('youtu.be/')) {
                  videoId = videoUrl.split('youtu.be/')[1].split('?')[0];
                }
                playerDiv.innerHTML = `<iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
              } else {
                videoContainer.style.paddingBottom = '0';
                videoContainer.style.height = 'auto';
                playerDiv.innerHTML = `<video id="promoVideo" width="100%" height="auto" controls muted autoplay loop>
                  <source src="${videoUrl}" type="video/mp4">
                  Tu navegador no soporta el elemento de video.
                </video>`;
              }
            }
          })
          .getConfig();
      }


      function consultarFolio() {
        const folio = document.getElementById('folioInput').value;
        if (folio) {
          window.top.location.href = '<?= getScriptUrl() ?>?page=estatus&folio=' + folio;
        } else {
          showAlert('Por favor ingresa un folio.');
        }
      }
    </script>
  </body>
