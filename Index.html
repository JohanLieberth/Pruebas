  <script>
    // ESTADO DE SESIÓN CLIENTE
    let currentSessionToken = sessionStorage.getItem('CM_SESSION_TOKEN') || null;
    let currentUserObj = null;
    let debounceTimer = null;

    document.addEventListener('DOMContentLoaded', function() {
      if (currentSessionToken) {
        // Validar sesión existente
        verificarSesionExistente();
      } else {
        mostrarPantallaLogin();
      }
    });

    function ejecutarLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-submit');
      const errBox = document.getElementById('login-error-alert');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Validando...';
      errBox.style.display = 'none';

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-key me-2"></i> Ingresar al Sistema';

          if (res.success) {
            currentSessionToken = res.token;
            currentUserObj = res.user;
            sessionStorage.setItem('CM_SESSION_TOKEN', res.token);
            iniciarInterfazApp(res.user);
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-key me-2"></i> Ingresar al Sistema';
          errBox.innerText = err.message || 'Error al iniciar sesión.';
          errBox.style.display = 'block';
        })
        .loginUsuario(email, pass);
    }

    function verificarSesionExistente() {
      google.script.run
        .withSuccessHandler(function(user) {
          currentUserObj = user;
          iniciarInterfazApp(user);
        })
        .withFailureHandler(function(err) {
          sessionStorage.removeItem('CM_SESSION_TOKEN');
          currentSessionToken = null;
          mostrarPantallaLogin();
        })
        .assertAuthenticatedUser(currentSessionToken);
    }

    function cerrarSesionUsuario() {
      if (currentSessionToken) {
        google.script.run.logoutUsuario(currentSessionToken);
      }
      sessionStorage.removeItem('CM_SESSION_TOKEN');
      currentSessionToken = null;
      currentUserObj = null;
      mostrarPantallaLogin();
    }

    function mostrarPantallaLogin() {
      document.getElementById('section-login').style.display = 'block';
      document.getElementById('section-app').style.display = 'none';
      document.getElementById('header-user-info').style.display = 'none';
    }

    function iniciarInterfazApp(user) {
      document.getElementById('section-login').style.display = 'none';
      document.getElementById('section-app').style.display = 'block';

      const headerInfo = document.getElementById('header-user-info');
      const headerEmail = document.getElementById('header-user-email-txt');
      const headerBadge = document.getElementById('header-user-badge');

      headerInfo.style.display = 'block';
      headerEmail.innerText = user.email;

      if (user.role === 'ADMIN') {
        headerBadge.className = 'badge badge-admin';
        headerBadge.innerHTML = '<i class="fa-solid fa-crown me-1"></i> ADMINISTRADOR';
        document.getElementById('admin-app-root').style.display = 'block';
        document.getElementById('user-app-root').style.display = 'none';

        cargarDashboardIndicatorsAdmin();
      } else {
        headerBadge.className = 'badge badge-user';
        headerBadge.innerHTML = '<i class="fa-solid fa-user me-1"></i> OPERATIVO';
        document.getElementById('admin-app-root').style.display = 'none';
        document.getElementById('user-app-root').style.display = 'block';
        document.getElementById('user-subdireccion-lbl').innerText = user.subdireccion || 'Sin Subdirección';

        cargarCuestionarioUsuario(false);
      }
    }

    function manejarErrorSesion(err) {
      if (err.message && (err.message.includes('Sesión expirada') || err.message.includes('ACCESO DENEGADO'))) {
        alert(err.message);
        cerrarSesionUsuario();
      } else {
        alert('Error: ' + err.message);
      }
    }

    function showToast(msg, bgClass) {
      const toastEl = document.getElementById('autosaveToast');
      const toastMsg = document.getElementById('autosaveToastMsg');
      toastMsg.innerText = msg || 'Guardado ✓';
      toastEl.className = 'toast align-items-center text-white border-0 autosave-toast ' + (bgClass || 'bg-success');
      const bsToast = new bootstrap.Toast(toastEl, { delay: 2500 });
      bsToast.show();
    }
  </script>
