    <script>
      let currentAppConfig = null;

      window.onload = () => {
        toggleLoading(true);
        google.script.run
          .withSuccessHandler(config => {
            currentAppConfig = config;
            inicializarSelectsAgentes();
            cargarPagina("<?= page ?>");
            toggleLoading(false);
          })
          .withFailureHandler(err => {
            console.error("Error al cargar config:", err);
            // Si falla la config, intentamos cargar la página de todos modos con valores por defecto
            cargarPagina("<?= page ?>");
            toggleLoading(false);
          })
          .getAppConfig();
      };

      function cargarPagina(pageId) {
        console.log("Cargando página:", pageId);
        toggleLoading(true);

        // Ocultar todas las páginas
        document.querySelectorAll('.page-container').forEach(el => el.style.display = 'none');
        document.querySelectorAll('#menu .nav-link').forEach(el => el.classList.remove('active-link'));

        // Mostrar la seleccionada
        const targetPage = document.getElementById('page-' + pageId);
        if (targetPage) {
          targetPage.style.display = 'block';
          const link = document.getElementById('link-' + pageId);
          if (link) link.classList.add('active-link');

          // Llamar a la función de inicialización específica de cada página si existe
          try {
            if (pageId === 'Dashboard' && typeof inicializarDashboard === 'function') {
              inicializarDashboard();
            } else if (pageId === 'Estadisticas' && typeof inicializarReportes === 'function') {
              inicializarReportes();
            } else {
              toggleLoading(false);
            }
          } catch (e) {
            console.error("Error al inicializar página " + pageId, e);
            toggleLoading(false);
          }
        } else {
          console.warn("Página no encontrada:", pageId);
          toggleLoading(false);
          // Fallback a Dashboard si la página solicitada no existe
          if (pageId !== 'Dashboard') cargarPagina('Dashboard');
        }
      }

      function inicializarSelectsAgentes() {
        if (!currentAppConfig) return;
        const selects = document.querySelectorAll('select[name="agente"], #filtro-agente');
        selects.forEach(select => {
          const isFiltro = select.id === 'filtro-agente';
          let html = isFiltro ? '<option value="Global">Vista Global</option>' : '<option value="">Seleccione...</option>';
          currentAppConfig.AGENTES_PERMITIDOS.forEach(agente => {
            html += `<option value="${agente}">${agente}</option>`;
          });
          select.innerHTML = html;
        });
      }

      function formatCurrency(amount) {
        return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(amount || 0);
      }

      function toggleLoading(show) {
        document.getElementById('loading-overlay').style.display = show ? 'block' : 'none';
      }
    </script>
