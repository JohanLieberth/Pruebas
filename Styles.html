<style>
  :root {
    --primary-color: #1b5e20;
    --primary-light: #4c8c4a;
    --primary-dark: #003300;
    --secondary-color: #0288d1;
    --secondary-light: #5eb8ff;
    --accent-color: #009688;
    --bg-color: #f4f7f6;
    --card-bg: #ffffff;
    --text-color: #2c3e50;
    --text-muted: #6c757d;
    --border-color: #e0e0e0;
    --gold: #fbc02d;
    --silver: #b0bec5;
    --bronze: #b08d57;
    --danger: #d32f2f;
    --warning: #f57c00;
    --success: #2e7d32;
    --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    --border-radius: 12px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    line-height: 1.6;
    padding-bottom: 40px;
  }

  header {
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    color: white;
    padding: 24px 16px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  }

  header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  header p {
    font-size: 0.95rem;
    opacity: 0.9;
  }

  .container {
    max-width: 1000px;
    margin: 20px auto;
    padding: 0 16px;
  }

  .nav-tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 8px;
  }

  .tab-btn {
    background: transparent;
    border: none;
    padding: 10px 20px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 20px;
    transition: all 0.3s ease;
  }

  .tab-btn:hover {
    background-color: rgba(27, 94, 32, 0.08);
    color: var(--primary-color);
  }

  .tab-btn.active {
    background-color: var(--primary-color);
    color: white;
    box-shadow: var(--shadow);
  }

  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
    animation: fadeIn 0.4s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--border-radius);
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(0,0,0,0.05);
  }

  .card-title {
    font-size: 1.25rem;
    color: var(--primary-dark);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 2px solid #f0f0f0;
    padding-bottom: 8px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: linear-gradient(135deg, #ffffff, #f9fbf9);
    border-left: 5px solid var(--primary-color);
    border-radius: var(--border-radius);
    padding: 16px 20px;
    box-shadow: var(--shadow);
  }

  .stat-card h3 {
    font-size: 0.85rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .stat-card .value {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--primary-color);
    margin-top: 4px;
  }

  .winner-banner {
    background: linear-gradient(135deg, #fffde7, #fff8e1);
    border: 2px solid #ffe082;
    border-radius: var(--border-radius);
    padding: 20px;
    text-align: center;
    margin-bottom: 24px;
    box-shadow: 0 6px 16px rgba(251, 192, 45, 0.2);
  }

  .winner-banner h2 {
    color: #f57f17;
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .winner-banner .winner-name {
    font-size: 1.8rem;
    font-weight: 800;
    color: #333;
    margin: 8px 0;
  }

  .winner-banner .winner-score {
    font-size: 1.1rem;
    color: #555;
    font-weight: 600;
  }

  /* Table styling */
  .table-responsive {
    overflow-x: auto;
    border-radius: var(--border-radius);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card-bg);
  }

  th, td {
    padding: 14px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border-color);
  }

  th {
    background-color: #f1f8e9;
    color: var(--primary-dark);
    font-weight: 700;
    font-size: 0.9rem;
    text-transform: uppercase;
  }

  tr:hover {
    background-color: #f9fbf9;
  }

  tr.pos-1 {
    background-color: #fffde7;
    font-weight: 600;
  }
  tr.pos-2 {
    background-color: #f5f5f5;
  }
  tr.pos-3 {
    background-color: #efebe9;
  }

  .badge-pos {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-weight: 700;
    font-size: 1rem;
  }

  .badge-pos.gold { background-color: #fff176; color: #f57f17; }
  .badge-pos.silver { background-color: #e0e0e0; color: #424242; }
  .badge-pos.bronze { background-color: #d7ccc8; color: #4e342e; }
  .badge-pos.other { background-color: #eceff1; color: #607d8b; font-size: 0.85rem; }

  .badge-cat {
    padding: 4px 8px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    display: inline-block;
  }

  .badge-cat.sedentario { background-color: #ffe0b2; color: #e65100; }
  .badge-cat.activo { background-color: #e1f5fe; color: #0277bd; }

  /* Form Elements */
  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--text-color);
  }

  .form-control {
    width: 100%;
    padding: 10px 14px;
    font-size: 0.95rem;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-control:focus {
    border-color: var(--secondary-color);
    box-shadow: 0 0 0 3px rgba(2, 136, 209, 0.15);
  }

  .form-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
  }

  .btn {
    display: inline-block;
    padding: 10px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary {
    background-color: var(--primary-color);
    color: white;
  }

  .btn-primary:hover {
    background-color: var(--primary-dark);
  }

  .btn-secondary {
    background-color: var(--secondary-color);
    color: white;
  }

  .btn-secondary:hover {
    background-color: #0277bd;
  }

  .btn-block {
    width: 100%;
  }

  .alert {
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 0.9rem;
  }

  .alert-success { background-color: #e8f5e9; color: var(--success); border: 1px solid #c8e6c9; }
  .alert-danger { background-color: #ffebee; color: var(--danger); border: 1px solid #ffcdd2; }
  .alert-warning { background-color: #fff3e0; color: var(--warning); border: 1px solid #ffe0b2; }

  .sub-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }

  .sub-tab-btn {
    padding: 8px 14px;
    font-size: 0.85rem;
    background: #e0e0e0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }

  .sub-tab-btn.active {
    background: var(--secondary-color);
    color: white;
  }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 3px solid rgba(255,255,255,.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 1s ease-in-out infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Responsive Adjustments */
  @media (max-width: 600px) {
    header h1 { font-size: 1.4rem; }
    .nav-tabs { flex-direction: column; align-items: stretch; }
    .tab-btn { width: 100%; text-align: center; }
    th, td { padding: 10px 8px; font-size: 0.8rem; }
  }
</style>
