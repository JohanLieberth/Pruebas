<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <?!= include('CSS'); ?>
  </head>
  <body>
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div class="container py-5">
      <div id="alertPlaceholder"></div>

      <div class="row justify-content-center">
        <div class="col-md-4">
          <div class="text-center mb-4">
            <i class="fas fa-gamepad fa-4x text-primary mb-3"></i>
            <h3>Acceso al Sistema</h3>
          </div>
          <div class="card">
            <div class="card-body p-4">
              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label">Correo Electrónico</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" name="correo" class="form-control" required>
                  </div>
                </div>
                <div class="mb-4">
                  <label class="form-label">Contraseña</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" name="pass" class="form-control" required>
                  </div>
                </div>
                <div class="d-grid mb-3">
                  <button type="submit" class="btn btn-primary btn-lg">Iniciar Sesión</button>
                </div>
                <div class="text-center">
                  <a href="#" onclick="recuperarPass()" class="text-muted small">¿Olvidaste tu contraseña?</a>
                </div>
              </form>
            </div>
          </div>
          <div class="mt-4 text-center">
            <a href="<?= getScriptUrl() ?>" class="btn btn-link text-decoration-none">
              <i class="fas fa-arrow-left me-1"></i> Volver al inicio
            </a>
          </div>
        </div>
      </div>
    </div>

    <?!= include('JS'); ?>
    <script>
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        showLoading(true);

        const correo = this.correo.value;
        const pass = this.pass.value;

        google.script.run
          .withSuccessHandler(function(result) {
            showLoading(false);
            if (result.success) {
              // Store user in sessionStorage for MVP session management
              sessionStorage.setItem('user', JSON.stringify(result.user));

              if (result.user.rol === 'admin') {
                window.top.location.href = '<?= getScriptUrl() ?>?page=admin';
              } else {
                window.top.location.href = '<?= getScriptUrl() ?>?page=panelCliente';
              }
            } else {
              showAlert(result.message);
            }
          })
          .withFailureHandler(function(err) {
            showLoading(false);
            showAlert('Error de conexión: ' + err.message);
          })
          .validarLogin(correo, pass);
      });

      function recuperarPass() {
        const correo = document.querySelector('input[name="correo"]').value;
        if (!correo) {
          showAlert('Ingresa tu correo primero');
          return;
        }
        showAlert('Funcionalidad MVP: Por favor contacta al administrador para resetear tu contraseña.', 'info');
      }
    </script>
  </body>
</html>
