<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f4f7f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 400px;
    }
    .login-title {
      font-weight: bold;
      color: #333;
      margin-bottom: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h3 class="login-title">Mujeres Seguras</h3>
    <p class="text-muted text-center mb-4">Gestión de Contratos</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required placeholder="ejemplo@mujeresseguras.com">
      </div>
      <div class="mb-4">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" required placeholder="********">
      </div>
      <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>
      <button type="submit" class="btn btn-primary w-100 py-2">Iniciar Sesión</button>
    </form>
  </div>

  <script>
    const WEB_APP_URL = "<?= webAppUrl ?>";

    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.classList.add('d-none');

      google.script.run
        .withFailureHandler(err => {
          errorDiv.innerText = "Error de red o del servidor: " + err;
          errorDiv.classList.remove('d-none');
        })
        .withSuccessHandler(res => {
          if (res.success) {
            // Guardar en sessionStorage para control de acceso en cliente
            sessionStorage.setItem('userEmail', res.user.email);
            sessionStorage.setItem('userNombre', res.user.nombre);
            sessionStorage.setItem('userRol', res.user.rol);

            // Redirigir al dashboard principal de la app
            const sep = WEB_APP_URL.indexOf('?') !== -1 ? '&' : '?';
            window.top.location.href = WEB_APP_URL + sep + 'page=listaRegistros';
          } else {
            errorDiv.innerText = res.message || "Credenciales incorrectas.";
            errorDiv.classList.remove('d-none');
          }
        })
        .validarCredenciales(email, password);
    }

    // Si ya está logueado, redirigir automáticamente
    window.onload = function() {
      if (sessionStorage.getItem('userEmail')) {
        const sep = WEB_APP_URL.indexOf('?') !== -1 ? '&' : '?';
        window.top.location.href = WEB_APP_URL + sep + 'page=listaRegistros';
      }
    };
  </script>
</body>
</html>
