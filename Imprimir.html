<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background-color: white; font-family: 'Courier New', Courier, monospace; padding: 0; margin: 0; }

      /* Comprobante Cliente 55mm */
      .ticket {
        width: 55mm;
        margin: 0;
        padding: 2mm;
        font-size: 8pt;
        line-height: 1.2;
      }

      /* Etiqueta 48mm x 25mm */
      .ticket-short {
        width: 48mm;
        height: 25mm;
        margin: 0;
        padding: 1mm;
        font-size: 7pt;
        border: 1px solid #000;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .folio-big { font-size: 14pt; font-weight: bold; margin: 2px 0; text-align: center; }
      .logo-print { max-width: 100%; height: auto; display: block; margin: 0 auto 5px auto; }
      .qr-placeholder { background: #eee; width: 60px; height: 60px; display: flex; align-items: center; text-align: center; font-size: 6pt; margin: 5px auto; }
      .disclaimer-small { font-size: 6pt; color: #000; margin-top: 5px; border-top: 1px dashed #000; padding-top: 3px; }

      hr { border: 0; border-top: 1px dashed #000; margin: 5px 0; }

      @media print {
        .no-print { display: none; }
        body { width: auto; }
        @page { margin: 0; }
      }
    </style>
  </head>
  <body>
    <div class="no-print text-center mb-4">
      <button class="btn btn-primary" onclick="window.print()">Imprimir Ahora</button>
      <button class="btn btn-secondary" onclick="window.close()">Cerrar</button>
    </div>

    <? if (data.servicio) { ?>
      <? const config = getConfig(); ?>
      <? if (data.tipo === 'corto') { ?>
        <!-- Etiqueta 48mm x 25mm -->
        <div class="ticket-short">
          <div style="display: flex; align-items: center; justify-content: space-between;">
             <? if (config["Logo Pequeño"]) { ?>
               <img src="<?= config["Logo Pequeño"] ?>" style="height: 15px;">
             <? } ?>
             <strong><?= data.servicio.Folio ?></strong>
          </div>
          <div style="font-weight: bold; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">
            <?= data.servicio.Nombre ?>
          </div>
          <div><?= data.servicio["Fecha de recepción"] ?></div>
          <div style="font-size: 6pt; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">
            <?= data.servicio["Dispositivo a recibir"] ?>
          </div>
        </div>
      <? } else { ?>
        <!-- Comprobante 55mm -->
        <div class="ticket">
          <div style="text-align: center; margin-bottom: 5px;">
            <? if (config["Logo Pequeño"]) { ?>
              <img src="<?= config["Logo Pequeño"] ?>" class="logo-print">
            <? } else { ?>
              <strong>GameService Pro</strong>
            <? } ?>
          </div>

          <div class="folio-big">ORDEN: <?= data.servicio.Folio ?></div>
          <div style="text-align: center;"><?= data.servicio["Fecha de recepción"] ?></div>

          <hr>

          <strong>CLIENTE:</strong><br>
          <?= data.servicio.Nombre ?><br>
          Tel: <?= data.servicio["Teléfono"] ?><br>

          <hr>

          <strong>EQUIPO:</strong><br>
          <?= data.servicio["Dispositivo a recibir"] ?><br>
          Estado: <?= data.servicio["Estado del equipo"] ?><br>

          <hr>

          <strong>FALLA:</strong><br>
          <?= data.servicio["Descripción de la falla"] ?>

          <hr>

          <div style="text-align: center;">
            <div class="qr-placeholder">
              Estatus:<br>
              <?= data.servicio.Folio ?>
            </div>
            <span><?= data.scriptUrl ?>?page=estatus&folio=<?= data.servicio.Folio ?></span>
          </div>

          <div class="disclaimer-small">
            <?= getDisclaimer() ?>
          </div>
        </div>
      <? } ?>
    <? } else { ?>
      <div class="alert alert-danger">Servicio no encontrado.</div>
    <? } ?>

    <script>
      // window.print(); // Optional: trigger print on load
    </script>
  </body>
</html>
