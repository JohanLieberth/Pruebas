<!-- CATALOGOS.HTML -->
<div id="view-catalogos" class="app-view d-none">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-1"><i class="bi bi-tags text-primary me-2"></i>Gestión de Catálogos</h3>
      <p class="text-muted small mb-0">Administración de listas desplegables y valores del sistema</p>
    </div>
  </div>

  <div class="row g-4">
    <!-- Formulario Agregar Item -->
    <div class="col-12 col-md-5">
      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-header bg-white fw-bold py-3 border-bottom">
          <i class="bi bi-plus-circle me-2 text-primary"></i>Agregar Nuevo Valor
        </div>
        <div class="card-body">
          <form id="form-catalogo" onsubmit="event.preventDefault(); guardarCatalogoItemModal();">
            <div class="mb-3">
              <label for="catalogo-tipo" class="form-label fw-semibold">Tipo de Catálogo *</label>
              <select class="form-select" id="catalogo-tipo" required onchange="toggleCatalogoPadreField();">
                <option value="Dependencia">Dependencia</option>
                <option value="Subdirección">Subdirección</option>
                <option value="Jefatura">Jefatura / Departamento</option>
                <option value="Etapa">Etapa</option>
                <option value="Prioridad">Prioridad</option>
                <option value="Estatus">Estatus</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="catalogo-valor" class="form-label fw-semibold">Valor / Descripción *</label>
              <input type="text" class="form-control" id="catalogo-valor" required placeholder="Ej. Departamento de Mantenimiento">
            </div>

            <!-- Campo Padre para relación jerárquica (Jefatura -> Subdirección) -->
            <div class="mb-3 d-none" id="contenedor-catalogo-padre">
              <label for="catalogo-padre" class="form-label fw-semibold">Subdirección Padre (Jerarquía)</label>
              <select class="form-select" id="catalogo-padre">
                <option value="">-- Seleccionar Subdirección Padre --</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 rounded-pill py-2">
              <i class="bi bi-save me-1"></i> Guardar en Catálogo
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Lista de Catálogos Existentes -->
    <div class="col-12 col-md-7">
      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-header bg-white fw-bold py-3 border-bottom d-flex justify-content-between align-items-center">
          <span><i class="bi bi-list-ul me-2 text-primary"></i>Valores Registrados</span>
          <select class="form-select form-select-sm w-auto" id="filtro-catalogo-tipo" onchange="renderizarTablaCatalogos();">
            <option value="">-- Ver Todos --</option>
            <option value="Dependencia">Dependencia</option>
            <option value="Subdirección">Subdirección</option>
            <option value="Jefatura">Jefatura / Departamento</option>
            <option value="Etapa">Etapa</option>
            <option value="Prioridad">Prioridad</option>
            <option value="Estatus">Estatus</option>
          </select>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="tabla-catalogos">
              <thead>
                <tr>
                  <th>Tipo</th>
                  <th>Valor Registrado</th>
                  <th>Depende de (Padre)</th>
                  <th class="text-end">Acción</th>
                </tr>
              </thead>
              <tbody>
                <!-- Inyectado por JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
