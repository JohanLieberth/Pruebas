<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <?!= include('CSS'); ?>
  </head>
  <body>
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <nav class="navbar navbar-expand-lg mb-4">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="<?= getScriptUrl() ?>">
          <img id="headerLogo" src="" alt="Logo" style="height: 40px; margin-right: 10px; display: none;">
          <span id="systemName">Mis Servicios</span>
        </a>
        <div class="ms-auto d-flex align-items-center">
          <a href="<?= getScriptUrl() ?>" class="btn btn-outline-light btn-sm me-2">Inicio</a>
          <button type="button" class="btn btn-outline-light btn-sm" onclick="logout()">Cerrar Sesión</button>
        </div>
      </div>
    </nav>

    <div class="container">
      <div id="alertPlaceholder"></div>

      <div class="row mb-4">
        <div class="col">
          <h2 id="userName">Hola</h2>
          <p class="text-muted">Aquí puedes ver el historial de tus equipos en nuestro taller.</p>
        </div>
      </div>

      <div class="row g-4" id="servicesGrid">
        <!-- Loaded via JS -->
      </div>
    </div>

    <!-- Details Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Detalle del Servicio</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="detailsBody">
            <!-- Content -->
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <?!= include('JS'); ?>
    <script>
      let currentUser;
      let detailsModal;

      window.addEventListener('load', function() {
        cargarConfig();
        const userStr = sessionStorage.getItem('user');
        if (!userStr) {
          window.top.location.href = '<?= getScriptUrl() ?>?page=login';
          return;
        }
        currentUser = JSON.parse(userStr);
        document.getElementById('userName').innerText = 'Hola, ' + currentUser.nombre;
        detailsModal = new bootstrap.Modal(document.getElementById('detailsModal'));
        cargarMisServicios();
      });

      function cargarConfig() {
        google.script.run
          .withFailureHandler(handleGlobalError)
          .withSuccessHandler(function(config) {
            if (config["Logo Pequeño"]) {
              document.getElementById('headerLogo').src = config["Logo Pequeño"];
              document.getElementById('headerLogo').style.display = 'inline-block';
              document.getElementById('systemName').style.display = 'none';
            }
          })
          .getConfig();
      }

      function cargarMisServicios() {
        showLoading(true);
        google.script.run
          .withFailureHandler(handleGlobalError)
          .withSuccessHandler(function(servicios) {
            showLoading(false);
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = '';

            servicios = servicios.filter(s => s["Correo electrónico"] === currentUser.email);

            if (servicios.length === 0) {
              grid.innerHTML = '<div class="col-12 text-center py-5"><i class="fas fa-box-open fa-3x text-muted mb-3"></i><p>No tienes servicios registrados con este correo.</p></div>';
              return;
            }

            servicios.forEach(s => {
              const col = document.createElement('div');
              col.className = 'col-md-6 col-lg-4';

              const card = document.createElement('div');
              card.className = 'card h-100';
              const body = document.createElement('div');
              body.className = 'card-body';

              const headerDiv = document.createElement('div');
              headerDiv.className = 'd-flex justify-content-between mb-2';
              const folioSpan = document.createElement('span');
              folioSpan.className = 'fw-bold text-primary';
              folioSpan.textContent = s.Folio;
              headerDiv.appendChild(folioSpan);
              const statusDiv = document.createElement('div');
              statusDiv.innerHTML = formatStatus(s["Estatus (admin)"]);
              headerDiv.appendChild(statusDiv);

              const title = document.createElement('h5');
              title.className = 'card-title';
              title.textContent = s["Dispositivo a recibir"];

              const date = document.createElement('p');
              date.className = 'card-text small text-muted mb-1';
              date.textContent = s["Fecha de recepción"];

              const total = document.createElement('p');
              total.className = 'card-text fw-bold text-success mb-3';
              total.textContent = 'Total: $' + (s["Total ($)"] || '0.00');

              const btnDiv = document.createElement('div');
              btnDiv.className = 'd-grid';
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'btn btn-outline-primary btn-sm';
              btn.textContent = 'Ver detalles';
              btn.onclick = function() { verDetalle(s); };
              btnDiv.appendChild(btn);

              body.appendChild(headerDiv);
              body.appendChild(title);
              body.appendChild(date);
              body.appendChild(total);
              body.appendChild(btnDiv);
              card.appendChild(body);
              col.appendChild(card);
              grid.appendChild(col);
            });
          })
          .obtenerServicios({ rol: 'cliente', correo: currentUser.email });
      }

      function verDetalle(s) {
        const body = document.getElementById('detailsBody');
        body.innerHTML = '';

        const sections = [
          { label: 'Falla reportada:', value: s["Descripción de la falla"] },
          { label: 'Estado del equipo:', value: s["Estado del equipo"] },
          { label: 'Solución / Notas:', value: s["Solución aplicada (admin)"] || 'Pendiente de revisión' },
          { label: 'Fecha Estimada de Entrega:', value: s["Fecha de entrega (admin)"] || 'Por confirmar' },
          { label: 'Total:', value: '$' + (s["Total ($)"] || '0.00'), class: 'fs-5 fw-bold text-success' }
        ];

        sections.forEach(sec => {
          const div = document.createElement('div');
          div.className = 'mb-3';
          const label = document.createElement('label');
          label.className = 'fw-bold small text-uppercase text-muted';
          label.textContent = sec.label;
          const p = document.createElement('p');
          if (sec.class) p.className = sec.class;
          p.textContent = sec.value;
          div.appendChild(label);
          div.appendChild(p);
          body.appendChild(div);
        });

        detailsModal.show();
      }

    </script>
  </body>
</html>
