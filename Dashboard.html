<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script>
  /**
   * Definición de funciones en el ámbito global.
   */

  // Definir primero para asegurar disponibilidad
  function drawChartsWithData(stats) {
    console.log('Dibujando gráficas con:', stats);

    if (typeof google === 'undefined' || !google.visualization || !google.visualization.PieChart) {
      console.warn('Google Charts no disponible aún.');
      return;
    }

    if (!stats) return;

    try {
      // Gráfica de Vendedores
      var vData = [['Vendedor', 'Ventas']];
      if (stats.ventasPorVendedor) {
        for (var v in stats.ventasPorVendedor) {
          vData.push([v, stats.ventasPorVendedor[v]]);
        }
      }
      if (vData.length === 1) vData.push(['Sin datos', 0]);
      var vendedorDataTable = google.visualization.arrayToDataTable(vData);

      var vendedorOptions = {
        pieHole: 0.4,
        colors: ['#0E7490', '#F57C00', '#1CA7C8', '#FBC02D', '#F44336'],
        legend: { position: 'bottom' },
        chartArea: { width: '90%', height: '80%' }
      };

      var chartVDiv = document.getElementById('vendedorChart');
      if (chartVDiv) {
        var chartV = new google.visualization.PieChart(chartVDiv);
        chartV.draw(vendedorDataTable, vendedorOptions);
      }

      // Gráfica de Estatus
      var estatusData = google.visualization.arrayToDataTable([
        ['Estado', 'Cantidad'],
        ['Pagada', (stats.ventasPorEstatus && stats.ventasPorEstatus['Pagada']) || 0],
        ['Pendiente', (stats.ventasPorEstatus && stats.ventasPorEstatus['Pendiente']) || 0],
        ['Parcial', (stats.ventasPorEstatus && stats.ventasPorEstatus['Parcialmente Pagada']) || 0],
        ['Vencida', (stats.ventasPorEstatus && stats.ventasPorEstatus['Vencida']) || 0]
      ]);

      var estatusOptions = {
        legend: { position: 'bottom' },
        colors: ['#27ae60', '#FBC02D', '#1CA7C8', '#F44336'],
        chartArea: { width: '90%', height: '80%' }
      };

      var chartEDiv = document.getElementById('estatusChart');
      if (chartEDiv) {
        var chartE = new google.visualization.PieChart(chartEDiv);
        chartE.draw(estatusData, estatusOptions);
      }
    } catch(e) {
      console.error('Excepción en drawChartsWithData:', e);
    }
  }

  function renderStats(stats) {
    if (!stats) return;
    try {
      console.log('Renderizando indicadores...');

      var values = document.querySelectorAll('.stat-value');
      if (values.length >= 3) {
        values[0].innerText = '$' + (stats.totalVentas || 0).toLocaleString(undefined, {minimumFractionDigits: 2});
        values[1].innerText = '$' + (stats.totalCobrado || 0).toLocaleString(undefined, {minimumFractionDigits: 2});
        values[2].innerText = '$' + (stats.saldoPendiente || 0).toLocaleString(undefined, {minimumFractionDigits: 2});
      }

      var metaLabel = document.getElementById('metaLabel');
      if (metaLabel) metaLabel.innerText = 'Meta Mensual: $' + (stats.meta || 0).toLocaleString(undefined, {minimumFractionDigits: 2});

      var metaDesc = document.getElementById('metaDesc');
      var vSelect = document.getElementById('filtroVendedor');
      if (metaDesc && vSelect) {
        metaDesc.innerText = (vSelect.value === 'Todos') ? 'Progreso hacia la meta global' : 'Progreso hacia la meta individual de $10,000';
      }

      var progressBar = document.querySelector('.progress-bar');
      if (progressBar) {
        var prog = stats.progresoMeta || 0;
        progressBar.style.width = Math.min(prog, 100) + '%';
        progressBar.innerText = prog.toFixed(1) + '%';
      }

      // Ranking
      var rankingHtml = '';
      if (stats.ranking && stats.ranking.length > 0) {
        stats.ranking.forEach(function(r) {
           rankingHtml += '<tr>' +
             '<td>' + (r.posicion || '-') + '</td>' +
             '<td>' + (r.nombre || 'N/A') + '</td>' +
             '<td>$' + (r.total || 0).toLocaleString(undefined, {minimumFractionDigits: 2}) + '</td>' +
             '<td>' + (r.cumplimiento || 0).toFixed(1) + '%</td>' +
           '</tr>';
        });
      } else {
        rankingHtml = '<tr><td colspan="4" style="text-align:center;">Sin datos de ranking</td></tr>';
      }

      var tbody = document.querySelector('table tbody');
      if (tbody) tbody.innerHTML = rankingHtml;

      // Dibujar gráficas
      drawChartsWithData(stats);

    } catch (e) {
      console.error('Error en renderStats:', e);
      alert('Error al mostrar los datos: ' + e.message);
    }
  }

  function cargarVendedoresFiltro() {
    var select = document.getElementById('filtroVendedor');
    if (!select) return;

    google.script.run
      .withSuccessHandler(function(vendedores) {
        select.innerHTML = '<option value="Todos">Todos</option>';
        vendedores.forEach(function(v) {
          var opt = document.createElement('option');
          opt.value = v;
          opt.innerText = v;
          select.appendChild(opt);
        });
      })
      .withFailureHandler(function(err) {
        console.error("Error al cargar vendedores para filtro:", err);
        select.innerHTML = '<option value="Todos">Error al cargar</option>';
      })
      .getVendedores();
  }

  function actualizarDashboard() {
    var vSelect = document.getElementById('filtroVendedor');
    var mSelect = document.getElementById('filtroMes');
    if (!vSelect || !mSelect) return;

    var v = vSelect.value;
    var m = mSelect.value;

    var loader = document.getElementById('loading-overlay');
    var content = document.getElementById('statsContent');

    if (loader) loader.style.display = 'flex';
    if (content) content.style.opacity = '0.5';

    google.script.run
      .withSuccessHandler(function(stats) {
         try {
           renderStats(stats);
         } catch(e) {
           console.error("Error al renderizar stats:", e);
         } finally {
           if (content) content.style.opacity = '1';
           if (loader) loader.style.display = 'none';
         }
      })
      .withFailureHandler(function(err) {
         console.error("Error del servidor:", err);
         alert('Error al actualizar dashboard: ' + err.message);
         if (loader) loader.style.display = 'none';
         if (content) content.style.opacity = '1';
      })
      .getDashboardData(v, m);
  }


  // Inicialización de Google Charts
  google.charts.load('current', {'packages':['corechart']});
  google.charts.setOnLoadCallback(function() {
    console.log('Callback de Google Charts ejecutado.');
    try {
      var initialStats = <?!= JSON.stringify(stats || {}) ?>;
      if (initialStats && Object.keys(initialStats).length > 0) {
        renderStats(initialStats);
      }
    } catch(e) {
      console.error('Error en inicialización:', e);
    }
  });

  // Cargar vendedores al iniciar
  document.addEventListener('DOMContentLoaded', function() {
    cargarVendedoresFiltro();
  });
</script>
