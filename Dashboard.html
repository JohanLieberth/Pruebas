    <div class="container py-4">
      <div class="row g-4 mb-4">
        <div class="col-12">
          <div class="card p-3">
             <h5 class="card-title"><i class="fas fa-money-bill-wave me-2"></i>Cobros Mensuales (Abonos + Anticipos + Pagos)</h5>
             <div id="chart_collections" style="width: 100%; height: 400px;"></div>

        <div class="col-12">
          <div class="card p-3">
             <h5 class="card-title"><i class="fas fa-user-tie me-2"></i>Trabajos por Supervisor y Estatus</h5>
             <div id="chart_supervisors" style="width: 100%; height: 400px;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <?!= include('JS'); ?>
    <script>
      google.charts.load('current', {'packages':['corechart', 'bar']});
      google.charts.setOnLoadCallback(drawCharts);

      function drawCharts() {
        showLoading(true);
        google.script.run
          .withFailureHandler(handleGlobalError)
          .withSuccessHandler(function(data) {
            showLoading(false);
            drawCollectionsChart(data.dailyCollections);
            drawSupervisorsChart(data.supervisorStats);
          })
          .getDashboardData();
      }

      function drawCollectionsChart(dailyData) {
        const dataArray = [['Día', 'Total Cobrado']];
        const days = Object.keys(dailyData).sort();
        days.forEach(day => {
          dataArray.push([day, dailyData[day]]);
        });

        const data = google.visualization.arrayToDataTable(dataArray);
        const options = {
          title: 'Total Cobrado por Día',
          legend: { position: 'none' },
          hAxis: { title: 'Día/Mes' },
          vAxis: { title: 'Monto ($)' },
          colors: ['#2ecc71']
        };

        const chart = new google.visualization.ColumnChart(document.getElementById('chart_collections'));
        chart.draw(data, options);
      }

      function drawSupervisorsChart(supStats) {
        const dataArray = [['Supervisor', 'Pendiente', 'En reparación', 'Listo', 'Entregado', 'Cancelado']];
        const supervisors = Object.keys(supStats);
        supervisors.forEach(sup => {
          const s = supStats[sup];
          dataArray.push([sup, s.Pendiente, s['En reparación'], s.Listo, s.Entregado, s.Cancelado]);
        });

        if (supervisors.length === 0) {
           document.getElementById('chart_supervisors').innerHTML = '<p class="text-center py-5">No hay datos de asignación disponibles.</p>';
           return;
        }

        const data = google.visualization.arrayToDataTable(dataArray);
        const options = {
          title: 'Productividad por Supervisor',
          isStacked: true,
          hAxis: { title: 'Supervisor' },
          vAxis: { title: 'Equipos' }
        };

        const chart = new google.visualization.BarChart(document.getElementById('chart_supervisors'));
        chart.draw(data, options);
      }

      window.addEventListener('load', function() {
        inicializarTema();
      });
    </script>
  </body>
</html>
