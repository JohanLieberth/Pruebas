             <h5 class="card-title text-center"><i class="fas fa-chart-pie me-2 text-danger"></i>Estatus Global</h5>
             <canvas id="chart_status"></canvas>

             <canvas id="chart_income"></canvas>
          </div>

        <div class="col-12">
          <div class="card p-3 shadow-sm">
             <h5 class="card-title text-center"><i class="fas fa-user-gear me-2 text-primary"></i>Rendimiento por Supervisor</h5>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <?!= include('JS'); ?>
    <script>
      function drawCharts() {
        const userStr = sessionStorage.getItem('user');
        const user = userStr ? JSON.parse(userStr) : null;

        showLoading(true);
        google.script.run
          .withFailureHandler(handleGlobalError)
          .withSuccessHandler(function(data) {
            showLoading(false);
            renderStatusChart(data);
            renderIncomeChart(data.dailyCollections);
            renderPerformanceChart(data.supervisorStats);
          })
          .getDashboardData(user);
      }

      function renderStatusChart(fullData) {
        const stats = {
          "Pendiente": 0, "En reparación": 0, "Listo": 0, "Entregado": 0, "Cancelado": 0
        };
        Object.values(fullData.supervisorStats).forEach(s => {
          for(let k in stats) stats[k] += s[k];
        });

        new Chart(document.getElementById('chart_status'), {
          type: 'doughnut',
          data: {
            labels: Object.keys(stats),
            datasets: [{
              data: Object.values(stats),
              backgroundColor: ['#f39c12', '#343A40', '#2ecc71', '#7f8c8d', '#e74c3c']
            }]
          }
        });
      }

      function renderIncomeChart(dailyData) {
        const labels = Object.keys(dailyData).sort();
        new Chart(document.getElementById('chart_income'), {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Recaudado ($)',
              data: labels.map(l => dailyData[l]),
              borderColor: '#e94560',
              backgroundColor: 'rgba(233, 69, 96, 0.1)',
              fill: true,
              tension: 0.3
            }]
          }
        });
      }

      function renderPerformanceChart(supStats) {
        const supervisors = Object.keys(supStats);
        const statusKeys = ["Pendiente", "En reparación", "Listo", "Entregado", "Cancelado"];
        const colors = ['#f39c12', '#343A40', '#2ecc71', '#7f8c8d', '#e74c3c'];

        const datasets = statusKeys.map((status, i) => ({
          label: status,
          data: supervisors.map(sup => supStats[sup][status]),
          backgroundColor: colors[i]
        }));

        new Chart(document.getElementById('chart_performance'), {
          type: 'bar',
          data: {
            labels: supervisors,
            datasets: datasets
          },
          options: {
            indexAxis: 'y',
            scales: { x: { stacked: true }, y: { stacked: true } }
          }
        });
      }

      window.addEventListener('load', function() {
        const userStr = sessionStorage.getItem('user');
        const user = userStr ? JSON.parse(userStr) : null;
        if (!user || user.rol !== 'Administrador') {
           window.top.location.href = '<?= getScriptUrl() ?>?page=login';
           return;
        }
        drawCharts();
      });
    </script>
  </body>
</html>
