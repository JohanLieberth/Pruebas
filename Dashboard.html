<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script>
  function actualizarDashboard() {
    var v = document.getElementById('filtroVendedor').value;
    var m = document.getElementById('filtroMes').value;

    // Mostramos un loader simple
    document.getElementById('statsContent').style.opacity = '0.5';

    google.script.run.withSuccessHandler(function(stats) {
       renderStats(stats);
       document.getElementById('statsContent').style.opacity = '1';
    }).getDashboardData(v, m);
  }

  function renderStats(stats) {
     // Actualizar valores de las cards
     document.querySelectorAll('.stat-value')[0].innerText = '$' + stats.totalVentas.toFixed(2);
     document.querySelectorAll('.stat-value')[1].innerText = '$' + stats.totalCobrado.toFixed(2);
     document.querySelectorAll('.stat-value')[2].innerText = '$' + stats.saldoPendiente.toFixed(2);

     // Actualizar meta y barra
     document.querySelector('.progress-bar').style.width = Math.min(stats.progresoMeta, 100) + '%';
     document.querySelector('.progress-bar').innerText = stats.progresoMeta.toFixed(1) + '%';

     // Re-dibujar gráficas
     drawChartsWithData(stats);

     // Actualizar Ranking
     var rankingHtml = '';
     var sortedVendedores = Object.keys(stats.ventasPorVendedor).sort(function(a,b){
          return stats.ventasPorVendedor[b] - stats.ventasPorVendedor[a];
     });
     sortedVendedores.forEach(function(v) {
        rankingHtml += '<tr><td>' + v + '</td><td>$' + stats.ventasPorVendedor[v].toFixed(2) + '</td></tr>';
     });
     document.querySelector('table tbody').innerHTML = rankingHtml;
  }
</script>
<script type="text/javascript">
  google.charts.load('current', {'packages':['corechart']});
  google.charts.setOnLoadCallback(drawCharts);

  function drawCharts() {
    // Primera carga con datos iniciales
    var initialStats = <?!= JSON.stringify(stats) ?>;
    drawChartsWithData(initialStats);
  }

  function drawChartsWithData(stats) {
    // Gráfica de Vendedores
    var vData = [['Vendedor', 'Ventas']];
    for (var v in stats.ventasPorVendedor) {
      vData.push([v, stats.ventasPorVendedor[v]]);
    }
    if (vData.length === 1) vData.push(['Sin datos', 0]);
    var vendedorData = google.visualization.arrayToDataTable(vData);

    var vendedorOptions = {
      pieHole: 0.4,
      colors: ['#0E7490', '#F57C00', '#1CA7C8', '#FBC02D', '#F44336'],
      legend: { position: 'bottom' }
    };

    var chartV = new google.visualization.PieChart(document.getElementById('vendedorChart'));
    chartV.draw(vendedorData, vendedorOptions);

    // Gráfica de Estatus
    var estatusData = google.visualization.arrayToDataTable([
      ['Estado', 'Cantidad'],
      ['Pagada', stats.ventasPorEstatus['Pagada'] || 0],
      ['Pendiente', stats.ventasPorEstatus['Pendiente'] || 0],
      ['Parcial', stats.ventasPorEstatus['Parcialmente Pagada'] || 0],
      ['Vencida', stats.ventasPorEstatus['Vencida'] || 0]
    ]);

    var estatusOptions = {
      legend: { position: 'bottom' },
      colors: ['#27ae60', '#FBC02D', '#1CA7C8', '#F44336']
    };

    var chartE = new google.visualization.PieChart(document.getElementById('estatusChart'));
    chartE.draw(estatusData, estatusOptions);
  }
</script>
