<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script>
  /**
   * Definición de funciones en el ámbito global.
   */

  function drawChartsWithData(stats) {
    if (typeof google === 'undefined' || !google.visualization || !google.visualization.ColumnChart) {
      console.warn('Google Charts no disponible aún.');
      return;
    }

    if (!stats) return;

    try {
      // Ajuste 3: Gráfica de Barras - Ventas por Vendedor
      var vData = [['Vendedor', 'Total Ventas ($)', { role: 'style' }]];
      if (stats.graficaVendedores && stats.graficaVendedores.length > 0) {
        stats.graficaVendedores.forEach(function(row) {
          vData.push([row[0], row[1], 'color: #0E7490']);
        });
      }
      if (vData.length === 1) vData.push(['Sin datos', 0, 'color: #ccc']);
      var vendedorDataTable = google.visualization.arrayToDataTable(vData);

      var vendedorOptions = {
        legend: { position: 'none' },
        chartArea: { width: '80%', height: '70%' },
        hAxis: { title: 'Vendedor' },
        vAxis: { title: 'Total ($)', format: 'currency' }
      };

      var chartVDiv = document.getElementById('vendedorChart');
      if (chartVDiv) {
        var chartV = new google.visualization.ColumnChart(chartVDiv);
        chartV.draw(vendedorDataTable, vendedorOptions);
      }

      // Ajuste 4: Gráfica de Barras - Estado de Ventas (Montos $)
      var eData = [['Estado', 'Monto Total ($)', { role: 'style' }]];
      var colores = { 'Pagada': '#27ae60', 'Pendiente': '#FBC02D', 'Parcialmente Pagada': '#1CA7C8', 'Vencida': '#F44336' };

      if (stats.graficaEstados && stats.graficaEstados.length > 0) {
        stats.graficaEstados.forEach(function(row) {
          eData.push([row[0], row[1], 'color: ' + (colores[row[0]] || '#ccc')]);
        });
      }
      var estatusDataTable = google.visualization.arrayToDataTable(eData);

      var estatusOptions = {
        legend: { position: 'none' },
        chartArea: { width: '80%', height: '70%' },
        hAxis: { title: 'Estado' },
        vAxis: { title: 'Monto Total ($)', format: 'currency' }
      };

      var chartEDiv = document.getElementById('estatusChart');
      if (chartEDiv) {
        var chartE = new google.visualization.ColumnChart(chartEDiv);
        chartE.draw(estatusDataTable, estatusOptions);
      }
    } catch(e) {
      console.error('Excepción en drawChartsWithData:', e);
    }
  }

  function renderStats(stats) {
    if (!stats) return;
    try {
      // Ajuste 2, 3, 4: Indicadores
      document.getElementById('valTotalVentas').innerText = '$' + (stats.totalVentas || 0).toLocaleString(undefined, {minimumFractionDigits: 2});
      document.getElementById('valTotalCobrado').innerText = '$' + (stats.totalCobrado || 0).toLocaleString(undefined, {minimumFractionDigits: 2});
      document.getElementById('valSaldoPendiente').innerText = '$' + (stats.saldoPendiente || 0).toLocaleString(undefined, {minimumFractionDigits: 2});

      // Ajuste 6: Meta
      document.getElementById('metaLabel').innerText = 'Meta Mensual: $' + (stats.meta || 0).toLocaleString(undefined, {minimumFractionDigits: 2});

      var vSelect = document.getElementById('filtroVendedor');
      document.getElementById('metaDesc').innerText = (vSelect.value === 'Todos') ? 'Progreso hacia la meta global' : 'Progreso hacia la meta individual de $10,000';

      var progressBar = document.getElementById('valProgresoMetaBar');
      if (progressBar) {
        var prog = stats.progresoMeta || 0;
        progressBar.style.width = Math.min(prog, 100) + '%';
        progressBar.innerText = prog.toFixed(1) + '%';
      }

      // Ajuste 5: Ranking
      var rankingHtml = '';
      if (stats.ranking && stats.ranking.length > 0) {
        stats.ranking.forEach(function(r) {
           rankingHtml += '<tr>' +
             '<td>' + r.posicion + '</td>' +
             '<td>' + r.nombre + '</td>' +
             '<td>$' + (r.totalVentas || 0).toLocaleString(undefined, {minimumFractionDigits: 2}) + '</td>' +
             '<td>' + (r.cumplimiento || 0).toFixed(1) + '%</td>' +
           '</tr>';
        });
      } else {
        rankingHtml = '<tr><td colspan="4" style="text-align:center;">No hay datos para mostrar</td></tr>';
      }
      document.getElementById('rankingBody').innerHTML = rankingHtml;

      drawChartsWithData(stats);

    } catch (e) {
      console.error('Error en renderStats:', e);
      alert('Error al mostrar los datos: ' + e.message);
    }
  }

  function cargarVendedoresFiltro() {
    var select = document.getElementById('filtroVendedor');
    google.script.run
      .withSuccessHandler(function(vendedores) {
        select.innerHTML = '<option value="Todos">Todos los vendedores</option>';
        if (vendedores) {
          vendedores.forEach(function(v) {
            var opt = document.createElement('option');
            opt.value = v;
            opt.innerText = v;
            select.appendChild(opt);
          });
        }
      })
      .getVendedores();
  }

  function actualizarDashboard() {
    var mes = document.getElementById('filtroMes').value;
    var vend = document.getElementById('filtroVendedor').value;

    document.getElementById('loading-overlay').style.display = 'flex';
    document.getElementById('statsContent').style.opacity = '0.5';

    google.script.run
      .withSuccessHandler(function(stats) {
         try {
           renderStats(stats);
         } finally {
           document.getElementById('statsContent').style.opacity = '1';
           document.getElementById('loading-overlay').style.display = 'none';
         }
      })
      .withFailureHandler(function(err) {
         alert('Error: ' + err.message);
         document.getElementById('loading-overlay').style.display = 'none';
         document.getElementById('statsContent').style.opacity = '1';
      })
      .obtenerDatosDashboard(mes, vend);
  }

  google.charts.load('current', {'packages':['corechart']});
  google.charts.setOnLoadCallback(function() {
    var initialStats = <?!= JSON.stringify(stats || {}) ?>;
    if (initialStats && Object.keys(initialStats).length > 0) {
      renderStats(initialStats);
    }
  });

  document.addEventListener('DOMContentLoaded', function() {
    cargarVendedoresFiltro();
  });
</script>
