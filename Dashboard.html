<div class="card">
  <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); align-items: end;">
    <div class="form-group">
      <label>Filtrar por Vendedor</label>
      <select id="filtroVendedor" class="form-control" onchange="actualizarDashboard()">
        <option value="Todos">Cargando...</option>
      </select>
    </div>
    <div class="form-group">
      <label>Filtrar por Mes</label>
      <select id="filtroMes" class="form-control" onchange="actualizarDashboard()">
        <option value="Todos">Todos</option>
        <option value="1">Enero</option>
        <option value="2">Febrero</option>
        <option value="3">Marzo</option>
        <option value="4">Abril</option>
        <option value="5">Mayo</option>
        <option value="6">Junio</option>
        <option value="7">Julio</option>
        <option value="8">Agosto</option>
        <option value="9">Septiembre</option>
        <option value="10">Octubre</option>
        <option value="11">Noviembre</option>
        <option value="12">Diciembre</option>
      </select>
    </div>
  </div>
</div>

<div id="statsContent">
  <? var stats = getDashboardData(); ?>
<div class="grid">
  <div class="card stat-card">
    <span class="stat-label">Total Ventas Mes</span>
    <span class="stat-value">$<?= stats.totalVentas.toFixed(2) ?></span>
  </div>
  <div class="card stat-card" style="border-color: var(--secondary);">
    <span class="stat-label">Total Cobrado</span>
    <span class="stat-value">$<?= stats.totalCobrado.toFixed(2) ?></span>
  </div>
  <div class="card stat-card" style="border-color: var(--warning);">
    <span class="stat-label">Saldo Pendiente</span>
    <span class="stat-value">$<?= stats.saldoPendiente.toFixed(2) ?></span>
  </div>
</div>

<div class="card">
  <h3 id="metaLabel">Meta Mensual: $<?= stats.meta.toFixed(2) ?></h3>
  <div class="progress-container">
    <div class="progress-bar" style="width: <?= Math.min(stats.progresoMeta, 100) ?>%">
      <?= stats.progresoMeta.toFixed(1) ?>%
    </div>
  </div>
  <p id="metaDesc" style="text-align: center; color: #666;">Progreso hacia la meta global</p>
</div>

<div class="grid">
  <div class="card">
    <h3>Ventas por Vendedor</h3>
    <div id="vendedorChart" style="height: 300px;"></div>
  </div>
  <div class="card">
    <h3>Estado de Ventas</h3>
    <div id="estatusChart" style="height: 300px;"></div>
  </div>
</div>

<div class="card">
  <h3>Ranking de Vendedores</h3>
  <table>
    <thead>
      <tr>
        <th>Pos</th>
        <th>Vendedor</th>
        <th>Total Vendido</th>
        <th>% Meta Indiv.</th>
      </tr>
    </thead>
    <tbody>
      <? for (var i=0; i<stats.ranking.length; i++) {
           var r = stats.ranking[i];
      ?>
      <tr>
        <td><?= r.posicion ?></td>
        <td><?= r.nombre ?></td>
        <td>$<?= r.total.toFixed(2) ?></td>
        <td><?= r.cumplimiento.toFixed(1) ?>%</td>
      </tr>
      <? } ?>
    </tbody>
  </table>
</div>
</div>

<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script>
  function cargarVendedoresFiltro() {
    var select = document.getElementById('filtroVendedor');
    google.script.run
      .withSuccessHandler(function(vendedores) {
        select.innerHTML = '<option value="Todos">Todos</option>';
        vendedores.forEach(function(v) {
          var opt = document.createElement('option');
          opt.value = v;
          opt.innerText = v;
          select.appendChild(opt);
        });
      })
      .getVendedores();
  }

  document.addEventListener('DOMContentLoaded', cargarVendedoresFiltro);

  function actualizarDashboard() {
    var v = document.getElementById('filtroVendedor').value;
    var m = document.getElementById('filtroMes').value;

    // Mostramos un loader (Overlay global definido en Index.html)
    document.getElementById('loading-overlay').style.display = 'flex';
    document.getElementById('statsContent').style.opacity = '0.5';

    google.script.run
      .withSuccessHandler(function(stats) {
         try {
           renderStats(stats);
         } catch(e) {
           console.error("Error en success handler:", e);
         } finally {
           document.getElementById('statsContent').style.opacity = '1';
           document.getElementById('loading-overlay').style.display = 'none';
         }
      })
      .withFailureHandler(function(err) {
         console.error("Error del servidor:", err);
         alert('Error al actualizar dashboard: ' + err.message);
         document.getElementById('loading-overlay').style.display = 'none';
         document.getElementById('statsContent').style.opacity = '1';
      })
      .getDashboardData(v, m);
  }

  function renderStats(stats) {
    try {
      console.log('Iniciando renderizado de estadísticas:', stats);

      // Actualizar indicadores principales (AJUSTE 1)
      var values = document.querySelectorAll('.stat-value');
      if (values.length >= 3) {
        values[0].innerText = '$' + (stats.totalVentas || 0).toLocaleString(undefined, {minimumFractionDigits: 2});
        values[1].innerText = '$' + (stats.totalCobrado || 0).toLocaleString(undefined, {minimumFractionDigits: 2});
        values[2].innerText = '$' + (stats.saldoPendiente || 0).toLocaleString(undefined, {minimumFractionDigits: 2});
      }

      // Actualizar meta y barra (AJUSTE 2)
      var metaLabel = document.getElementById('metaLabel');
      if (metaLabel) metaLabel.innerText = 'Meta Mensual: $' + (stats.meta || 0).toLocaleString(undefined, {minimumFractionDigits: 2});

      var metaDesc = document.getElementById('metaDesc');
      var filtroV = document.getElementById('filtroVendedor').value;
      if (metaDesc) metaDesc.innerText = (filtroV === 'Todos') ? 'Progreso hacia la meta global' : 'Progreso hacia la meta individual de $10,000';

      var progressBar = document.querySelector('.progress-bar');
      if (progressBar) {
        var prog = stats.progresoMeta || 0;
        progressBar.style.width = Math.min(prog, 100) + '%';
        progressBar.innerText = prog.toFixed(1) + '%';
      }

      // Re-dibujar gráficas (AJUSTE 3)
      drawChartsWithData(stats);

      // Actualizar Ranking (AJUSTE 4 - Con Posición Real)
      var rankingHtml = '';
      if (stats.ranking && stats.ranking.length > 0) {
        stats.ranking.forEach(function(r) {
           rankingHtml += '<tr>' +
             '<td>' + (r.posicion || '-') + '</td>' +
             '<td>' + (r.nombre || 'N/A') + '</td>' +
             '<td>$' + (r.total || 0).toLocaleString(undefined, {minimumFractionDigits: 2}) + '</td>' +
             '<td>' + (r.cumplimiento || 0).toFixed(1) + '%</td>' +
           '</tr>';
        });
      } else {
        rankingHtml = '<tr><td colspan="4" style="text-align:center;">Sin datos de ranking</td></tr>';
      }

      var tbody = document.querySelector('table tbody');
      if (tbody) tbody.innerHTML = rankingHtml;

      console.log('Renderizado completado con éxito.');
    } catch (e) {
      console.error('Error en renderStats:', e);
      alert('Error al mostrar los datos: ' + e.message);
    }
  }
</script>
<script type="text/javascript">
  google.charts.load('current', {'packages':['corechart']});
  google.charts.setOnLoadCallback(drawCharts);

  function drawCharts() {
    // Primera carga con datos iniciales
    var initialStats = <?!= JSON.stringify(stats) ?>;
    drawChartsWithData(initialStats);
  }

  function drawChartsWithData(stats) {
    // Gráfica de Vendedores
    var vData = [['Vendedor', 'Ventas']];
    for (var v in stats.ventasPorVendedor) {
      vData.push([v, stats.ventasPorVendedor[v]]);
    }
    if (vData.length === 1) vData.push(['Sin datos', 0]);
    var vendedorData = google.visualization.arrayToDataTable(vData);

    var vendedorOptions = {
      pieHole: 0.4,
      colors: ['#0E7490', '#F57C00', '#1CA7C8', '#FBC02D', '#F44336'],
      legend: { position: 'bottom' }
    };

    var chartV = new google.visualization.PieChart(document.getElementById('vendedorChart'));
    chartV.draw(vendedorData, vendedorOptions);

    // Gráfica de Estatus
    var estatusData = google.visualization.arrayToDataTable([
      ['Estado', 'Cantidad'],
      ['Pagada', stats.ventasPorEstatus['Pagada'] || 0],
      ['Pendiente', stats.ventasPorEstatus['Pendiente'] || 0],
      ['Parcial', stats.ventasPorEstatus['Parcialmente Pagada'] || 0],
      ['Vencida', stats.ventasPorEstatus['Vencida'] || 0]
    ]);

    var estatusOptions = {
      legend: { position: 'bottom' },
      colors: ['#27ae60', '#FBC02D', '#1CA7C8', '#F44336']
    };

    var chartE = new google.visualization.PieChart(document.getElementById('estatusChart'));
    chartE.draw(estatusData, estatusOptions);
  }
</script>
