  height: 50%;

  border-radius: 8px;

  width: 20px;
  height: 20px;
  border-color: #16a085;
  border-style: solid;
}

.corner.top-left {
  top: -2px;
  left: -2px;
  border-width: 3px 0 0 3px;
  border-radius: 4px 0 0 0;
}

.corner.top-right {
  top: -2px;
  right: -2px;
  border-width: 3px 3px 0 0;
  border-radius: 0 4px 0 0;
}

.corner.bottom-left {
  bottom: -2px;
  left: -2px;

  border-radius: 0 0 0 4px;
}

.corner.bottom-right {
  bottom: -2px;
  right: -2px;
  border-width: 0 3px 3px 0;
  border-radius: 0 0 4px 0;
}

  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 2px;

  animation: scan 2s infinite linear;

}
