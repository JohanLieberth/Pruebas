<style>

}

  border: 1px solid rgba(22, 160, 133, 0.4);
}

}

.bg-light-primary {

.bg-light-success {

}

.bg-light-warning {

}

}

.table-responsive {

}

.table-striped tbody tr:nth-of-type(odd) {

}

.text-ellipsis {

}

  align-items: center;
}
