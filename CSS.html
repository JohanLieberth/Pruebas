<style>
  :root {
    --primary-color: #1a1a2e;
    --secondary-color: #e94560;
    --bg-color: #f5f5f5;
    --success-color: #2ecc71;
    --warning-color: #f39c12;
    --danger-color: #e74c3c;
    --text-color: #333;
  }

  body {
    background-color: var(--bg-color);
    font-family: 'Roboto', sans-serif;
    color: var(--text-color);
  }

  .navbar {
    background-color: var(--primary-color);
  }

  .navbar-brand, .nav-link {
    color: white !important;
  }

  .btn-primary {
    background-color: var(--secondary-color);
    border-color: var(--secondary-color);
  }

  .btn-primary:hover {
    background-color: #d63d57;
    border-color: #d63d57;
  }

  .card {
    border: none;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  .card-header {
    background-color: var(--primary-color);
    color: white;
  }

  .status-badge {
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 0.85em;
    font-weight: bold;
  }

  .status-pendiente { background-color: var(--warning-color); color: white; }
  .status-en-reparacion { background-color: var(--primary-color); color: white; }
  .status-listo { background-color: var(--success-color); color: white; }
  .status-entregado { background-color: #7f8c8d; color: white; }
  .status-cancelado { background-color: var(--danger-color); color: white; }

  .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    display: none;
  }

  @media print {
    .no-print {
      display: none !important;
    }
    body {
      background-color: white;
    }
    .card {
      box-shadow: none;
      border: 1px solid #ddd;
    }
  }

  .disclaimer-text {
    font-size: 0.8rem;
    color: #666;
    line-height: 1.2;
  }
